<!doctype html><meta charset=utf-8><link rel=stylesheet href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0}#m{width:900px;height:700px}.t{position:absolute;z-index:999;top:10px;left:10px;background:#fff;padding:6px 10px;font:bold 17px sans-serif;border-radius:6px}</style><div id=m></div><div class=t id=t></div>
<script>const C=[['US-7968','E. Lucy Braun SNP','ky-nature-preserves.geojson','Braun',[36.9649,-83.1094]],['US-1263','Lake Malone SP','ky-state-parks.geojson','Lake Malone',[37.0711,-87.0554]],['US-1255','Fishtrap Lake WMA','ky-hunting-areas.geojson','Fishtrap',[37.4348,-82.3508]],['US-4526','GW & Jefferson NF (KY part)','ky-hunting-areas.geojson','Jefferson National',[38.1056,-79.6509]]];
const i=+new URLSearchParams(location.search).get('i'),c=C[i];
Promise.all([fetch(c[2]).then(r=>r.json()),fetch('newpins.json').then(r=>r.json())]).then(([g,P])=>{document.getElementById('t').textContent=c[0]+' '+c[1]+' — red = new POTA pin, blue = new KFF pin, gray = old pin';
const m=L.map('m',{zoomControl:false});L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(m);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}').addTo(m);
const f={type:'FeatureCollection',features:g.features.filter(x=>x.properties.NAME.includes(c[3]))};const l=L.geoJSON(f,{style:{color:'#ff2fd0',weight:3,fillOpacity:.12}}).addTo(m);
const pts=[];const pin=(ll,col,r)=>{L.circleMarker(ll,{radius:r,color:'#fff',weight:2,fillColor:col,fillOpacity:1}).addTo(m);pts.push(ll)};
if(i<3)pin(c[4],'#888',7);const k=Object.keys(P).find(x=>x.startsWith('KFF')&&((i==0&&x=='KFF-6879')||(i==1&&x=='KFF-1263')||(i==2&&x=='KFF-1255')||(i==3&&x=='KFF-6295')));if(k)pin(P[k],'#1e6bff',7);pin(P[c[0]],'#e01b1b',9);
if(i==3)m.fitBounds(l.getBounds(),{padding:[40,40]});else m.fitBounds(L.latLngBounds(pts).pad(i==2?1.2:2.5));setTimeout(()=>document.title='ready',6000)})</script>
