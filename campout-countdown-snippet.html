<!-- ===== KPC CAMPOUT COUNTDOWN + LIVE BOARD — paste this whole block into campout.html where you want it ===== -->
<section class="kpcc" id="countdown" aria-label="Campout countdown">
<style>
.kpcc{background:#070707;color:#fff;border-top:1px solid rgba(213,166,58,.45);border-bottom:1px solid rgba(213,166,58,.45);padding:56px 24px;font-family:Arial,Helvetica,sans-serif;position:relative;overflow:hidden}
.kpcc:before{content:"";position:absolute;width:520px;height:520px;left:-200px;bottom:-260px;border:1px solid rgba(213,166,58,.3);border-radius:50%;box-shadow:0 0 0 55px rgba(213,166,58,.03)}
.kpcc *{box-sizing:border-box}.kpcc a{text-decoration:none;color:inherit}
.kpcc-in{width:min(1100px,100%);margin:auto;text-align:center;position:relative}
.kpcc-k{color:#f0c96b;font-size:13px;font-weight:900;letter-spacing:4px;display:flex;align-items:center;justify-content:center;gap:10px}
.kpcc h2{margin:10px 0 6px;font:700 clamp(30px,4.6vw,52px)/1.05 Georgia,"Times New Roman",serif;color:#fff}.kpcc h2 span{color:#f0c96b}
.kpcc-sub{margin:0 auto;max-width:640px;color:#d9d4c8;font-size:17px}
.kpcc-clock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:720px;margin:30px auto 0}
.kpcc-u{padding:20px 8px;background:#151515;border:1px solid #363636;border-top:4px solid #d5a63a}
.kpcc-u b{display:block;font:700 clamp(36px,6vw,64px)/1 Georgia,serif;color:#fff;font-variant-numeric:tabular-nums}
.kpcc-u span{display:block;margin-top:8px;font-size:11px;font-weight:900;letter-spacing:3px;color:#bcb8ae}
.kpcc-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}
.kpcc-btn{display:inline-flex;align-items:center;min-height:46px;padding:11px 18px;border-radius:7px;font-size:12px;font-weight:900;letter-spacing:1px;background:#d5a63a;color:#0b0b0b}
.kpcc-btn.alt{background:transparent;border:1px solid #d5a63a;color:#f0c96b}
.kpcc-dot{width:11px;height:11px;border-radius:50%;background:#3ecf6e;animation:kpccp 1.8s infinite}
@keyframes kpccp{0%{box-shadow:0 0 0 0 rgba(62,207,110,.6)}70%{box-shadow:0 0 0 10px rgba(62,207,110,0)}100%{box-shadow:0 0 0 0 rgba(62,207,110,0)}}
.kpcc-board{display:grid;gap:10px;max-width:820px;margin:26px auto 0;text-align:left}
.kpcc-spot{display:grid;grid-template-columns:140px 110px 1fr auto;gap:14px;align-items:center;padding:14px 18px;background:#151515;border:1px solid #363636;border-left:5px solid #1d5a3a}
.kpcc-spot.m{border-left-color:#d5a63a;background:#1b1810}
.kpcc-spot .c{font:700 20px Georgia,serif}.kpcc-spot .f{font:700 19px Georgia,serif;color:#7fd39a}.kpcc-spot .p{font-size:13px;color:#bcb8ae}.kpcc-spot .t{font-size:12px;color:#bcb8ae;text-align:right}
.kpcc-badge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:4px;background:#d5a63a;color:#0b0b0b;font:900 10px Arial;letter-spacing:1px;vertical-align:middle}
.kpcc-empty{padding:22px;border:1px dashed #444;color:#bcb8ae;text-align:center}
@media(max-width:640px){.kpcc{padding:44px 16px}.kpcc-clock{gap:8px}.kpcc-u{padding:14px 4px}.kpcc-u span{letter-spacing:1.5px;font-size:10px}.kpcc-spot{grid-template-columns:1fr auto}.kpcc-spot .p{grid-column:1/-1}.kpcc-spot .t{grid-column:1/-1;text-align:left}.kpcc-btn{width:100%;justify-content:center}}
</style>
<div class="kpcc-in" id="kpccIn"></div>
<script>
(function(){
/* ---- EDIT HERE ---- */
const START='2027-09-24T12:00:00-04:00';   // campout opens (Eastern time)
const END  ='2027-09-26T12:00:00-04:00';   // campout ends
const PARK ='US-1271', PARKNAME='Taylorsville Lake State Park';
const MEMBERS=['KZ4CP','N4BDW','KQ4HZK','K4ZSR'];
/* ------------------- */
const el=document.getElementById('kpccIn'),s=+new Date(START),e=+new Date(END);
const force=new URLSearchParams(location.search).get('campout'); // ?campout=live or ?campout=after to preview
const base=c=>String(c||'').toUpperCase().split('/').reduce((a,b)=>b.length>a.length?b:a,'');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const cal=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('KPC KYPOTA Campout 2027')}&dates=${new Date(s).toISOString().replace(/[-:]|\.\d{3}/g,'')}/${new Date(e).toISOString().replace(/[-:]|\.\d{3}/g,'')}&location=${encodeURIComponent(PARKNAME+', Kentucky')}&details=${encodeURIComponent('Kentucky Portable Club campout at '+PARK)}`;
let mode='',last=0;
function phase(){if(force)return force;const n=Date.now();return n<s?'before':n<e?'live':'after'}
function before(){if(mode!=='before'){mode='before';el.innerHTML=`<div class="kpcc-k">KPC 2027 KYPOTA CAMPOUT</div><h2>SEPTEMBER 24–26 • <span>${esc(PARKNAME.toUpperCase())}</span></h2><p class="kpcc-sub">${PARK} • Radio, camping, conversation, games and activations. See you at the lake.</p>
 <div class="kpcc-clock"><div class="kpcc-u"><b id="kd">–</b><span>DAYS</span></div><div class="kpcc-u"><b id="kh">–</b><span>HOURS</span></div><div class="kpcc-u"><b id="km">–</b><span>MINUTES</span></div><div class="kpcc-u"><b id="ks">–</b><span>SECONDS</span></div></div>
 <div class="kpcc-btns"><a class="kpcc-btn" href="${cal}" target="_blank" rel="noopener">ADD TO GOOGLE CALENDAR</a><a class="kpcc-btn alt" href="https://pota.app/#/park/${PARK}" target="_blank" rel="noopener">${PARK} ON POTA ↗</a></div>`}
 let t=Math.max(0,s-Date.now())/1000;const d=Math.floor(t/86400);t-=d*86400;const h=Math.floor(t/3600);t-=h*3600;const m=Math.floor(t/60),sec=Math.floor(t-m*60);
 document.getElementById('kd').textContent=d;document.getElementById('kh').textContent=pad(h);document.getElementById('km').textContent=pad(m);document.getElementById('ks').textContent=pad(sec)}
async function live(){if(mode!=='live'){mode='live';el.innerHTML=`<div class="kpcc-k"><span class="kpcc-dot"></span>HAPPENING NOW</div><h2>THE CAMPOUT IS <span>ON THE AIR</span></h2><p class="kpcc-sub">Live POTA spots from ${esc(PARKNAME)} (${PARK}) and every KPC member on the air. Updates every minute.</p><div class="kpcc-board" id="kb"><div class="kpcc-empty">Loading spots…</div></div><div class="kpcc-btns"><a class="kpcc-btn" href="kpc-spots.html">ALL KPC SPOTS →</a></div>`}
 try{const r=await fetch('https://api.pota.app/spot/activator',{cache:'no-store'});const all=await r.json();
  const list=all.filter(x=>x.reference===PARK||MEMBERS.includes(base(x.activator))).sort((a,b)=>String(b.spotTime).localeCompare(String(a.spotTime)));
  document.getElementById('kb').innerHTML=list.length?list.map(x=>{const m=MEMBERS.includes(base(x.activator)),t=new Date(String(x.spotTime).endsWith('Z')?x.spotTime:x.spotTime+'Z');
   return`<div class="kpcc-spot${m?' m':''}"><div class="c"><a href="https://www.qrz.com/db/${encodeURIComponent(base(x.activator))}" target="_blank" rel="noopener">${esc(x.activator)}</a>${m?'<span class="kpcc-badge">KPC</span>':''}</div><div class="f">${(parseFloat(x.frequency)/1000).toFixed(3)} <small style="font:900 11px Arial;color:#bcb8ae">${esc(x.mode)}</small></div><div class="p">${esc(x.reference)} • ${esc(x.name||x.parkName||'')}${x.comments?`<br>“${esc(x.comments)}”`:''}</div><div class="t">${t.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div></div>`}).join(''):`<div class="kpcc-empty">No spots at ${PARK} right now — someone go get on the air!</div>`}
 catch(_){document.getElementById('kb').innerHTML='<div class="kpcc-empty">Couldn’t reach POTA right now — retrying.</div>'}}
function after(){if(mode==='after')return;mode='after';el.innerHTML=`<div class="kpcc-k">THANK YOU</div><h2>SEE YOU <span>NEXT YEAR</span></h2><p class="kpcc-sub">Thanks to everyone who camped, operated and hunted the 2027 KYPOTA Campout at ${esc(PARKNAME)}.</p><div class="kpcc-btns"><a class="kpcc-btn" href="parks.html">EXPLORE MORE KENTUCKY PARKS →</a></div>`}
function tick(){const p=phase();if(p==='before')before();else if(p==='live'){if(mode!=='live'||Date.now()-last>60000){last=Date.now();live()}}else after()}
tick();setInterval(tick,1000);
})();
</script>
</section>
<!-- ===== END KPC CAMPOUT COUNTDOWN ===== -->
