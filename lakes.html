<!doctype html><meta charset=utf-8><link rel=stylesheet href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0}#m{width:900px;height:640px}.t{position:absolute;z-index:999;top:10px;left:10px;background:rgba(0,0,0,.75);color:#fff;padding:7px 12px;font:bold 20px sans-serif;border-radius:6px}.t small{display:block;font:14px sans-serif;color:#f0c96b}</style><div id=m></div><div class=t id=t></div>
<script>const k=new URLSearchParams(location.search).get('k');Promise.all([fetch('future-lakes.geojson').then(r=>r.json()),fetch('future-parks.json').then(r=>r.json())]).then(([g,d])=>{const L=d.future.find(x=>x.key===k);
document.getElementById('t').innerHTML=L.name+'<small>'+L.county+' County · about '+L.acres+' acres of water · NOT a POTA park yet</small>';
const m=L.map?null:null;const map=window.L.map('m',{zoomControl:false}).setView([L.pin[0],L.pin[1]],13);window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}').addTo(map);
const fs=g.features.filter(f=>f.properties.key===k);const lake=window.L.geoJSON({type:'FeatureCollection',features:fs.filter(f=>f.geometry.type!=='Point')},{style:{color:'#38d8ff',weight:3,fillOpacity:.12}}).addTo(map);
fs.filter(f=>f.geometry.type==='Point').forEach(f=>window.L.circleMarker([f.geometry.coordinates[1],f.geometry.coordinates[0]],{radius:9,color:'#000',weight:2,fillColor:'#ffd400',fillOpacity:1}).addTo(map).bindTooltip(f.properties.name,{permanent:true,direction:'right',offset:[10,0]}));
map.fitBounds(lake.getBounds(),{padding:[60,60]});setTimeout(()=>document.title='ready',7000)})</script>
