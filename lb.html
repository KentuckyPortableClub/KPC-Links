<!doctype html><meta charset=utf-8><link rel=stylesheet href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0}#m{width:1000px;height:760px}.t{position:absolute;z-index:999;top:10px;left:10px;background:#fff;padding:8px 12px;font:bold 17px sans-serif;border-radius:6px;line-height:1.35}.t small{font-weight:normal;font-size:13px}
.lab{background:#fff;border:2px solid #111;border-radius:6px;padding:3px 7px;font:bold 14px sans-serif;white-space:nowrap}</style><div id=m></div>
<div class=t>US-7968 / KFF-6879 · E. Lucy Braun State Nature Preserve<br><small>Satellite + streets · white = Little Shepherd Trail (KY 1679) · Pink = official preserve boundary (KY Office of Nature Preserves) · Harlan Co., Pine Mountain</small></div>
<script>Promise.all([fetch('ky-nature-preserves.geojson').then(r=>r.json()),fetch('lst.json').then(r=>r.json())]).then(([g,rd])=>{const m=L.map('m',{zoomControl:false}).setView([36.963,-83.105],15);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);const Z=+new URLSearchParams(location.search).get('z');if(Z){window.__z=Z}
const l=L.geoJSON({type:'FeatureCollection',features:g.features.filter(f=>f.properties.NAME.includes('Braun'))},{style:{color:'#ff2fd0',weight:4,fillOpacity:.13}}).addTo(m);if(window.__z)m.setView([36.9632,-83.1092],window.__z);else m.fitBounds(l.getBounds(),{padding:[60,60]});
L.polyline(rd,{color:'#000',weight:7,opacity:.45}).addTo(m);L.polyline(rd,{color:'#fff',weight:3.5}).addTo(m).bindTooltip('Little Shepherd Trail (KY 1679)',{permanent:true,direction:'top',className:'lab'}).openTooltip([36.9672,-83.118]);
const pin=(ll,n,col,dir)=>{L.circleMarker(ll,{radius:10,color:'#fff',weight:3,fillColor:col,fillOpacity:1}).addTo(m);L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="lab" style="border-color:'+col+'">'+n+'</div>',iconSize:null,iconAnchor:dir==='up'?[-14,40]:[-14,-8]})}).addTo(m)};
pin([36.96489,-83.10944],'1 · Road access (KY 1679)','#1e6bff','up');pin([36.96165,-83.10868],'2 · Inside the preserve','#e01b1b','down');
setTimeout(()=>document.title='ready',7000)})</script>
