name: KPC research helpers (park packets daily, atlas crawler weekly; notes only)
# Oct 30 2026 (chat 10; HQ 7:50 AM, Brandon 7:43 AM 'any other helper that make chat 8 work easier'). Fills chat 8's sheets:
# PARK PACKETS in .claude/build/research/fable/<area>.md (pin, county, agency guess, website, what was tried) and the atlas crawler's
# layer lists in .claude/build/research/agency-atlas/<area>.md. Decides nothing; nothing to the waiting room; the GIS hunter is untouched.
# Only .claude/** changes = no site rebuild. Never goes red (EMAIL rule).
on:
  push:   # Oct 30 (Brandon 10:36 AM 'auto start when it has work to do'): a new server root written in an atlas file = crawl just the new ones
    branches: [main]
    paths: ['.claude/build/research/agency-atlas/**']
  schedule:
    - cron: '23 13 * * *'   # packets + solve every day (atlas + link check too on Sundays)
    - cron: '23 5 * * *'    # 12:23 AM CDT: inbox tidy + the daily habits line (HQ Oct 30 8:45 AM (5) + (7))
  workflow_dispatch:
    inputs:
      mode:
        description: 'packets | atlas | both | solve | inbox | links | storage | daily | weekly'
        default: 'both'
      areas:
        description: 'Areas to do (e.g. "US-DE"); blank = all'
        default: ''
permissions:
  contents: write
  actions: write
  pull-requests: read
concurrency:
  group: kpc-research-helpers
  cancel-in-progress: false
jobs:
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: "KPC-Data (read-only, hunter + documents results, park pins, manners)"
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Data
          path: kpcdata
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            data/gis-hunter
            data/docs
            data/parkinfo
            data/parkinfo-web.json
            data/canada.json
            data/pota
      - name: Fill the sheets
        id: kept_green_1
        continue-on-error: true
        env:
          DATA: kpcdata
        run: |
          M="${{ inputs.mode }}"
          if [ -z "$M" ]; then if [ "${{ github.event_name }}" = push ]; then M=atlas-new; elif [ "$(date -u +%H)" = 05 ]; then M=inbox; elif [ "$(date -u +%u)" = 7 ]; then M=weekly; else M=daily; fi; fi
          R=".github/scripts/kpc_research_helpers.py"
          case "$M" in daily|weekly|solve) timeout 20m python3 $R solve ${{ inputs.areas }} || { kpc_rc=$?; echo "::warning title=step::a script stopped with an error (exit $kpc_rc)"; echo "step - a script stopped with an error (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; } ;; esac
          case "$M" in daily|weekly|packets|both) timeout 120m python3 $R packets ${{ inputs.areas }} || { kpc_rc=$?; echo "::warning title=step::a script stopped with an error (exit $kpc_rc)"; echo "step - a script stopped with an error (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; } ;; esac
          case "$M" in weekly|atlas|both) timeout 90m python3 $R atlas ${{ inputs.areas }} || { kpc_rc=$?; echo "::warning title=step::a script stopped with an error (exit $kpc_rc)"; echo "step - a script stopped with an error (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; } ;; esac
          case "$M" in atlas-new) timeout 90m python3 $R atlas-new || { kpc_rc=$?; echo "::warning title=step::a script stopped with an error (exit $kpc_rc)"; echo "step - a script stopped with an error (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; } ;; esac
          case "$M" in weekly|links) timeout 250m python3 $R links || { kpc_rc=$?; echo "::warning title=step::a script stopped with an error (exit $kpc_rc)"; echo "step - a script stopped with an error (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; } ;; esac
          case "$M" in inbox) python3 $R inbox ${{ inputs.areas }} || { kpc_rc=$?; echo "::warning title=step::a script stopped with an error (exit $kpc_rc)"; echo "step - a script stopped with an error (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; } ;; esac
          case "$M" in weekly|storage)   # Oct 30 (HQ 8:50 AM): the storage keeper's KPC-Links half: clean this repo + a warning line for HQ
            K=kpcdata/.github/scripts/kpc_storage_keeper.py
            GH_TOKEN=${{ github.token }} REPO=${{ github.repository }} python3 $K clean || { kpc_rc=$?; echo "::warning title=step::a script stopped with an error (exit $kpc_rc)"; echo "step - a script stopped with an error (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
            GH_TOKEN=${{ github.token }} REPO=${{ github.repository }} HIST=/tmp/storage.json python3 $K measure > /tmp/m.txt || { kpc_rc=$?; echo "::warning title=step::a script stopped with an error (exit $kpc_rc)"; echo "step - a script stopped with an error (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
            LINE="$(grep '^LINE=' /tmp/m.txt | cut -d= -f2-)" python3 $K warn || { kpc_rc=$?; echo "::warning title=step::a script stopped with an error (exit $kpc_rc)"; echo "step - a script stopped with an error (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; } ;;
          esac
      - name: Save, notes only
        id: kept_green_2
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude/build/research/fable .claude/build/research/agency-atlas .claude/build/research/dead-links.md .claude/inbox 2>/dev/null || true   # ok: an optional path may not exist
          git diff --cached --quiet && exit 0
          git commit -qm 'Research helpers: packets / solved rows / atlas lists / dead links / inbox tidy (notes only)'
          { for i in 1 2 3 4; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i*5)); done; echo "::error title=Save::not saved after every try; the next run tries again"; }
          true
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
