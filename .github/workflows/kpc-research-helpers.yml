name: KPC research helpers (park packets daily, atlas crawler weekly; notes only)
# Oct 30 2026 (chat 10; HQ 7:50 AM, Brandon 7:43 AM 'any other helper that make chat 8 work easier'). Fills chat 8's sheets:
# PARK PACKETS in .claude/build/research/fable/<area>.md (pin, county, agency guess, website, what was tried) and the atlas crawler's
# layer lists in .claude/build/research/agency-atlas/<area>.md. Decides nothing; nothing to the waiting room; the GIS hunter is untouched.
# Only .claude/** changes = no site rebuild. Never goes red (EMAIL rule).
on:
  schedule:
    - cron: '23 13 * * *'   # packets + solve every day (atlas + link check too on Sundays)
    - cron: '23 5 * * *'    # 12:23 AM CDT: inbox tidy + the daily habits line (HQ Oct 30 8:45 AM (5) + (7))
  workflow_dispatch:
    inputs:
      mode:
        description: 'packets | atlas | both | solve | inbox | links | storage | daily | weekly'
        default: 'both'
      areas:
        description: 'Areas to do (e.g. "US-DE"); blank = all'
        default: ''
permissions:
  contents: write
  actions: write
  pull-requests: read
concurrency:
  group: kpc-research-helpers
  cancel-in-progress: false
jobs:
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: "KPC-Data (read-only, hunter + documents results, park pins, manners)"
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Data
          path: kpcdata
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            data/gis-hunter
            data/docs
            data/parkinfo
            data/parkinfo-web.json
            data/canada.json
            data/pota
      - name: Fill the sheets
        continue-on-error: true
        env:
          DATA: kpcdata
        run: |
          M="${{ inputs.mode }}"
          if [ -z "$M" ]; then if [ "$(date -u +%H)" = 05 ]; then M=inbox; elif [ "$(date -u +%u)" = 7 ]; then M=weekly; else M=daily; fi; fi
          R=".github/scripts/kpc_research_helpers.py"
          case "$M" in daily|weekly|solve) timeout 20m python3 $R solve ${{ inputs.areas }} || true ;; esac
          case "$M" in daily|weekly|packets|both) timeout 120m python3 $R packets ${{ inputs.areas }} || true ;; esac
          case "$M" in weekly|atlas|both) timeout 90m python3 $R atlas ${{ inputs.areas }} || true ;; esac
          case "$M" in weekly|links) timeout 250m python3 $R links || true ;; esac
          case "$M" in inbox) python3 $R inbox ${{ inputs.areas }} || true ;; esac
          case "$M" in weekly|storage)   # Oct 30 (HQ 8:50 AM): the storage keeper's KPC-Links half: clean this repo + a warning line for HQ
            K=kpcdata/.github/scripts/kpc_storage_keeper.py
            GH_TOKEN=${{ github.token }} REPO=${{ github.repository }} python3 $K clean || true
            GH_TOKEN=${{ github.token }} REPO=${{ github.repository }} HIST=/tmp/storage.json python3 $K measure > /tmp/m.txt || true
            LINE="$(grep '^LINE=' /tmp/m.txt | cut -d= -f2-)" python3 $K warn || true ;;
          esac
      - name: Save, notes only
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude/build/research/fable .claude/build/research/agency-atlas .claude/build/research/dead-links.md .claude/inbox 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm 'Research helpers: packets / solved rows / atlas lists / dead links / inbox tidy (notes only)'
          for i in 1 2 3 4; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i*5)); done
          true
