name: KY official map links
# Saves the boundary-map links from each Kentucky agency page (Fish & Wildlife WMAs, State Parks, Nature Preserves)
# into data/ky-official-maps.json for the Map Rep Tool Box. Tuesdays (after the Monday new-lands scan), or any time.
on:
  schedule:
    - cron: '17 9 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-ky-maps
  cancel-in-progress: false
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Read the map links
        run: python3 .github/scripts/kpc_ky_maps.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ky-official-maps.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update KY official map links'
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
          fi
