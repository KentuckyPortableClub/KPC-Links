name: KY official map links
# Saves the boundary-map links from each Kentucky agency page (Fish & Wildlife WMAs, State Parks, Nature Preserves)
# into data/ky-official-maps.json for the Map Rep Tool Box. Tuesdays (after the Monday new-lands scan), or any time.
on:
  schedule:
    - cron: '17 9 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-ky-maps
  cancel-in-progress: false
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Read the map links
        run: python3 .github/scripts/kpc_ky_maps.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ky-official-maps.json
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'Update KY official map links' - -- data/ky-official-maps.json
