name: KPC state leaders
# Weekly: top POTA activators in every US state (for the Hunters Lounge). Only parks with new activations are re-read.
on:
  schedule:
    - cron: '23 6 * * 3'
  workflow_dispatch:
    inputs:
      states:
        description: 'States (blank = all)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-state-leaders
  cancel-in-progress: false
jobs:
  leaders:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: .cache/leaders
          key: kpc-leaders-${{ github.run_id }}
          restore-keys: kpc-leaders-
      - run: python3 .github/scripts/kpc_state_leaders.py
        env:
          STATES: ${{ inputs.states }}
          BUDGET_MIN: '300'
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/leaders
          key: kpc-leaders-${{ github.run_id }}
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/leaders
          if ! git diff --cached --quiet; then git commit -m 'State leaders'; git pull --rebase --autostash || true; git push; fi
