name: KPC bot check
# Oct 23 2026 (Brandon: 'I do want daily checks on bots'): once a day, every timed bot is checked (did its last run
# fail? has it run as often as its timer says?) and the picture goes into ONE issue labelled bot-health. Only a NEW
# problem adds a comment (= one email). No Claude needed. Never fails.
on:
  schedule:
    - cron: '53 12 * * *'   # 7:53 AM Central, after the morning bots
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: read
concurrency:
  group: kpc-bot-health
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 300
      - name: Check every bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_bot_health.py || true
      - name: Save
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bot-health.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'Bot check'
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done; exit 0
