name: TEMP Kentucky park maps probe (chat 2, delete after one run)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        continue-on-error: true
        run: |
          pip install -q playwright || true
          python3 -m playwright install --with-deps chromium >/dev/null 2>&1 || true
          python3 .github/scripts/kpc_ky_parkmaps_probe.py || true
      - name: Save
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude/build/research/ky-parkmaps-probe.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "Kentucky park maps probe result (temp, chat 2)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i * 9)); done
          true
