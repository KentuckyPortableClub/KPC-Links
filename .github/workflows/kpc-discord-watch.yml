name: KPC Discord watch
# Nudges the staff room when somebody asked something in a club room and nobody replied.
# Hourly, plus at once when the club-room form asks (repository_dispatch 'kpc-discord-watch', Nov 3). Run it by hand with mode
# 'list' to see which rooms the bot can see. Never fails, never emails.
on:
  schedule:
    - cron: '47 * * * *'   # hourly (Nov 3, Brandon YES 5:29 PM: stays hourly)   # G9 Nov 2: was '48 * * * *' (spread the start times; now 1 min earlier)
  # Nov 3 (Brandon YES 5:29 PM): the club-room form can start a normal watch run at once, between the hourly runs.
  # What the form calls (either one; the form's own token, kept in the form's script properties, never in this repo):
  #   A) POST https://api.github.com/repos/KentuckyPortableClub/KPC-Links/dispatches
  #      body {"event_type": "kpc-discord-watch"}                        (token: fine-grained, this repo, Contents: read and write)
  #   B) POST https://api.github.com/repos/KentuckyPortableClub/KPC-Links/actions/workflows/kpc-discord-watch.yml/dispatches
  #      body {"ref": "main", "inputs": {"mode": "watch"}}               (token: fine-grained, this repo, Actions: read and write)
  #      (B MUST send mode=watch: the by-hand default is 'list'.)
  #   Headers for both: Authorization: Bearer <token>, Accept: application/vnd.github+json. GitHub answers 204 = started.
  repository_dispatch:
    types: [kpc-discord-watch]
  workflow_dispatch:
    inputs:
      mode:
        description: 'list = show the rooms the bot can see; watch = the normal job'
        type: choice
        options: [test, list, watch, delete]
        default: list
      target:
        description: 'For mode test: which room (admin, parks, general, announce, campout)'
        default: 'admin'
      message_id:
        description: 'For mode delete: the last number in the message link'
        default: ''
      dry_run:
        description: 'Practice run: print instead of posting'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-discord-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Look at the rooms
        id: kept_green_1
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KPC_ADMIN_WEBHOOK: ${{ secrets.KPC_ADMIN_WEBHOOK }}
          KPC_DISCORD_WEBHOOK: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          KPC_YOUTUBE_WEBHOOK: ${{ secrets.KPC_YOUTUBE_WEBHOOK }}
          MSG_ID: ${{ inputs.message_id }}
          TARGET: ${{ inputs.target }}
          KPC_PARKS_WEBHOOK: ${{ secrets.KPC_PARKS_WEBHOOK }}
          KPC_GENERAL_WEBHOOK: ${{ secrets.KPC_GENERAL_WEBHOOK }}
          KPC_ANNOUNCE_WEBHOOK: ${{ secrets.KPC_ANNOUNCE_WEBHOOK }}
          KPC_CAMPOUT_WEBHOOK: ${{ secrets.KPC_CAMPOUT_WEBHOOK }}
          MODE: ${{ inputs.mode || 'watch' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          echo "::notice title=Watch::step started, mode=$MODE"
          python3 .github/scripts/kpc_discord_watch.py || { kpc_rc=$?; echo "::error title=kpc_discord_watch.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_discord_watch.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Remember what was flagged
        id: kept_green_2
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Oct 25: put back a state file whose only change is a time stamp, so quiet runs commit nothing
          python3 .github/scripts/kpc_save_filter.py data/discord-watch-state.json || { kpc_rc=$?; echo "::error title=kpc_save_filter.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_save_filter.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          git add data/discord-watch-state.json 2>/dev/null || true   # ok: an optional path may not exist
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'Discord watch: what has been flagged' - -- data/discord-watch-state.json
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
