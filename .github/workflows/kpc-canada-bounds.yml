name: KPC Canada park boundaries
# Monthly (and by hand): official outlines for Canadian POTA parks from CPCAD (Environment and Climate Change Canada)
# -> data/canada-bounds/<REF>.json for the KPC US Trip Planner. Resumable: each run continues where the last one stopped.
on:
  # Oct 25 storage plan: the monthly schedule is RETIRED (cron was '29 8 9 * *'); the Canada answer key (kpc-ca-key.yml) decides the outlines now
  workflow_dispatch:
    inputs:
      mode:
        description: 'info = only print the service layers and fields'
        required: false
        default: ''
      limit:
        description: 'Only this many parks (0 = all)'
        required: false
        default: '0'
      misses:
        description: '1 = look again only at the parks that were not matched'
        required: false
        default: ''
      recheck:
        description: '1 = look again at parks already saved'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-canada-bounds
  cancel-in-progress: false
jobs:
  bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v5
      - name: Find the outlines
        continue-on-error: true      # Oct 28: a map server that misbehaves must not fail the run (a failed run emails Brandon)
        env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          RECHECK: ${{ inputs.recheck }}
          MISSES: ${{ inputs.misses }}
          MINUTES: '160'
        run: python3 .github/scripts/kpc_canada_bounds.py
      - name: Save
        if: ${{ inputs.mode != 'info' }}
        # Oct 28 (tune pass): the one safe save (fresh copy of main + only the changed files); red ONLY when the save failed
        env:
          STRICT: '1'
        run: |
          bash .github/scripts/kpc_push_data.sh . 'Canada park boundaries (CPCAD)' data/canada-bounds
