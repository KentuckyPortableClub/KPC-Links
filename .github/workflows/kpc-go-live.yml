name: KPC Go-Live (Oct 21, 2026)
# One-time job: at 4:30 PM Eastern (3:30 PM Central) on Wednesday, October 21, 2026, this
#   1. puts the new pages live: campoutHOLD.html -> campout.html, eventsHOLD.html -> events.html,
#      resourcesHOLD.html -> resources.html (the old versions stay in the git history),
#      and unhides kpc-campgrounds.html (menu, search, Find It, Tool Box) with .github/scripts/kpc_golive_campgrounds.py
#      and makes videos.html public (kpc_golive_videos.py, Brandon Oct 20)
#   2. (Oct 17: the roundup post was removed at Brandon's request; the regular daily posts carry on.)
# It only does anything on that date while the HOLD files still exist, so it can't run twice.
# To go live early, run it from the Actions tab and tick "go live now".
on:
  schedule:
    - cron: '30 20 21 10 *'    # 20:30 UTC = 4:30 PM EASTERN / 3:30 PM Central (Brandon Oct 21: Zach is on Eastern, so go live on HIS clock to be safe)
  workflow_dispatch:
    inputs:
      now:
        description: 'Go live now (ignore the date)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-social
  cancel-in-progress: false
jobs:
  golive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Swap in the HOLD pages
        id: swap
        env:
          FORCE: ${{ inputs.now }}
        run: |
          today=$(TZ=America/Chicago date +%F)
          if [ "$today" != "2026-10-21" ] && [ "$FORCE" != "true" ]; then
            echo "::notice title=Go-live::Not the go-live date ($today); nothing to do."; echo "done=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          moved=""
          for p in campout events resources; do
            if [ -f "${p}HOLD.html" ]; then git mv -f "${p}HOLD.html" "${p}.html"; moved="$moved $p"; fi
          done
          if [ -z "$moved" ]; then
            echo "::notice title=Go-live::HOLD pages already live; nothing to do."; echo "done=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 .github/scripts/kpc_golive_campgrounds.py && python3 .github/scripts/kpc_golive_videos.py && git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Go live: new${moved} pages and Campgrounds & Cabins (Oct 21, 2026)"
          git pull --rebase --autostash || true
          git push
          echo "::notice title=Go-live::Now live:${moved}"
          echo "done=yes" >> "$GITHUB_OUTPUT"
