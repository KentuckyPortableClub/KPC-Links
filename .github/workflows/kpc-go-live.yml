name: KPC Go-Live (Oct 21, 2026)
# One-time job: at 5 PM Central on Wednesday, October 21, 2026, this
#   1. puts the new pages live: campoutHOLD.html -> campout.html, eventsHOLD.html -> events.html,
#      resourcesHOLD.html -> resources.html (the old versions stay in the git history)
#   2. then posts the "New on the KPC website" roundup to Discord and the KPC Facebook Page.
# It only does anything on that date while the HOLD files still exist, so it can't run twice.
# To go live early, run it from the Actions tab and tick "go live now".
on:
  schedule:
    - cron: '0 22 21 10 *'     # 22:00 UTC = 5:00 PM CDT
  workflow_dispatch:
    inputs:
      now:
        description: 'Go live now (ignore the date)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-social
  cancel-in-progress: false
jobs:
  golive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Swap in the HOLD pages
        id: swap
        env:
          FORCE: ${{ inputs.now }}
        run: |
          today=$(TZ=America/Chicago date +%F)
          if [ "$today" != "2026-10-21" ] && [ "$FORCE" != "true" ]; then
            echo "::notice title=Go-live::Not the go-live date ($today); nothing to do."; echo "done=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          moved=""
          for p in campout events resources; do
            if [ -f "${p}HOLD.html" ]; then git mv -f "${p}HOLD.html" "${p}.html"; moved="$moved $p"; fi
          done
          if [ -z "$moved" ]; then
            echo "::notice title=Go-live::HOLD pages already live; nothing to do."; echo "done=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Go live: new${moved} pages (Oct 21, 2026)"
          git pull --rebase --autostash || true
          git push
          echo "::notice title=Go-live::Now live:${moved}"
          echo "done=yes" >> "$GITHUB_OUTPUT"
      - name: Announce what's new
        if: steps.swap.outputs.done == 'yes'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FORCE_PAGES: '1'
        run: |
          node .github/scripts/kpc_social.js pages
          git add kpc-social-state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Remember announced pages'
            git pull --rebase --autostash || true
            git push || true
          fi
