name: KPC state camps probe
# BY HAND ONLY (no timer, no email). Asks each state's GIS portal, agency ArcGIS account and reservation site what they
# answer, from GitHub's network, and saves the facts to data/campstate/probe.json. Read the result, then extend the
# weekly bot (kpc-state-camps.yml). Every step ends green.
on:
  workflow_dispatch:
    inputs:
      states:
        description: 'States, e.g. "GA NC" (blank = all but KY)'
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-state-camps-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        continue-on-error: true
        env:
          STATES: ${{ inputs.states }}
        run: python3 .github/scripts/kpc_state_camps_probe.py || true
      - name: Save
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/campstate/probe.json 2>/dev/null || true
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'State camps probe: what each portal and reservation site answers' - -- data/campstate/probe.json
