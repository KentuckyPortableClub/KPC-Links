name: KPC YouTube Feed
# Keeps videos.html current and shares new videos on the Facebook Page and in the KPC Discord.
# Once a day this reads the public YouTube feed for each
# club channel and saves the newest videos to kpc-youtube.json (no API key needed).
#  - Only commits when a video is added, removed or renamed (or twice a day for view counts).
#  - If YouTube doesn't answer, the last good list is kept, so the page never goes blank.
#  - To add a channel: add a line to CHANNELS below and a matching entry in videos.html (CH).
on:
  schedule:
    - cron: '23 23 * * *'   # once a day, 5:23 PM Central (winter) / 6:23 PM (summer). PR1 Nov 2, Brandon: 'YouTube once a day' (was twice a day; before Oct 28 every 2 h). Undo: '23 11,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-youtube
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Read the YouTube channel feeds
        run: |
          python3 - <<'PY'
          import datetime as dt, json, pathlib, time, urllib.request
          import xml.etree.ElementTree as ET

          CHANNELS = [
              {'key': 'kpc',     'id': 'UCsslHOb5hapSGIopm1qVb1Q', 'handle': '@KPC-KR4PIY',      'name': 'Kentucky Portable Club'},
              {'key': 'campout', 'id': 'UCPaMbm_P0d_819-i5CXo29g', 'handle': '@KY.POTA.Campout', 'name': 'KY POTA Campout'},
          ]
          NS = {'a': 'http://www.w3.org/2005/Atom', 'yt': 'http://www.youtube.com/xml/schemas/2015', 'm': 'http://search.yahoo.com/mrss/'}
          OUT = pathlib.Path('kpc-youtube.json')

          try:
              old = json.loads(OUT.read_text(encoding='utf-8'))
          except Exception:
              old = {}
          old_by = {c.get('key'): c for c in old.get('channels', [])}

          def fetch(url):
              last = None
              for i in range(4):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (KPC site feed; kentuckyportableclub.github.io)'})
                      with urllib.request.urlopen(req, timeout=25) as r:
                          return r.read()
                  except Exception as e:
                      last = e
                      time.sleep(5 * (i + 1))
              raise last

          channels = []
          for ch in CHANNELS:
              try:
                  root = ET.fromstring(fetch('https://www.youtube.com/feeds/videos.xml?channel_id=' + ch['id']))
                  vids = []
                  for e in root.findall('a:entry', NS):
                      vid = e.findtext('yt:videoId', namespaces=NS)
                      if not vid:
                          continue
                      link = e.find('a:link', NS)
                      href = link.get('href', '') if link is not None else ''
                      g = e.find('m:group', NS)
                      desc = (g.findtext('m:description', default='', namespaces=NS) if g is not None else '') or ''
                      st = g.find('m:community/m:statistics', NS) if g is not None else None
                      views = int(st.get('views')) if st is not None and (st.get('views') or '').isdigit() else None
                      vids.append({'id': vid, 'title': (e.findtext('a:title', default='', namespaces=NS) or '').strip(),
                                   'published': e.findtext('a:published', default='', namespaces=NS),
                                   'views': views, 'short': '/shorts/' in href, 'desc': desc.strip()[:600]})
                  channels.append({**ch, 'ok': True, 'videos': vids})
                  print(ch['name'], '->', len(vids), 'videos')
              except Exception as e:
                  print('Could not read', ch['name'], '-', e, '- keeping the last good list')
                  prev = old_by.get(ch['key'])
                  channels.append(prev if prev else {**ch, 'ok': False, 'videos': []})

          def sig(chs):
              return [(c.get('key'), [(v['id'], v['title']) for v in c.get('videos', [])]) for c in chs]

          now = dt.datetime.now(dt.timezone.utc)
          try:
              last = dt.datetime.fromisoformat(old.get('updated', '').replace('Z', '+00:00'))
          except Exception:
              last = None
          changed = sig(channels) != sig(old.get('channels', []))
          stale = last is None or (now - last) > dt.timedelta(hours=12)
          if changed or stale:
              OUT.write_text(json.dumps({'updated': now.strftime('%Y-%m-%dT%H:%M:%SZ'), 'channels': channels}, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
              print('Saved kpc-youtube.json', '(new or changed videos)' if changed else '(refreshed view counts)')
          else:
              print('No new videos; nothing to save')
          PY
      - name: Save the video list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kpc-youtube.json
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'Update KPC YouTube video list' - -- kpc-youtube.json
      - name: Share new videos on the Facebook Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          # Brandon Oct 21: nothing goes out about today's videos before 4:55 PM Central. Self-expiring:
          # after that moment this check always passes, so the bot is back to normal from tomorrow.
          if [ "$(date -u +%s)" -lt "$(date -u -d '2026-10-21 21:55' +%s)" ]; then
            echo "::notice title=Videos::Holding video posts until 4:55 PM Central today."; exit 0
          fi
          # G7: post from the newest main; if it cannot be fetched, do not post (a stale state file could post twice)
          git fetch -q origin main && git reset -q --hard origin/main || { echo '::error title=Posting::could not fetch the newest main, so nothing was posted this time'; exit 0; }
          # Nov 11 (bots review, package E): a refused post must not skip the save below (the videos already shared would be posted
          # again at the next run). The step still ends red afterwards when Facebook refused, as before.
          node .github/scripts/kpc_facebook.js videos || fb_rc=$?
          if [ -f kpc-fb-posted.json ]; then
            git add kpc-fb-posted.json
            # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
            KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
              bash .github/scripts/kpc_save_overwrite.sh --copy 'Remember videos shared on Facebook' - -- kpc-fb-posted.json
          fi
          exit "${fb_rc:-0}"
      - name: Share new videos in the KPC Discord
        if: ${{ !cancelled() }}
        env:
          KPC_DISCORD_WEBHOOK: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          KPC_YOUTUBE_WEBHOOK: ${{ secrets.KPC_YOUTUBE_WEBHOOK }}
          KPC_GENERAL_WEBHOOK: ${{ secrets.KPC_GENERAL_WEBHOOK }}
        run: |
          # Brandon Oct 21: nothing goes out about today's videos before 4:55 PM Central. Self-expiring:
          # after that moment this check always passes, so the bot is back to normal from tomorrow.
          if [ "$(date -u +%s)" -lt "$(date -u -d '2026-10-21 21:55' +%s)" ]; then
            echo "::notice title=Videos::Holding video posts until 4:55 PM Central today."; exit 0
          fi
          # G7: post from the newest main; if it cannot be fetched, do not post (a stale state file could post twice)
          git fetch -q origin main && git reset -q --hard origin/main || { echo '::error title=Posting::could not fetch the newest main, so nothing was posted this time'; exit 0; }
          node .github/scripts/kpc_discord_videos.js || dv_rc=$?   # Nov 11: save first, then end red if it failed
          if [ -f kpc-discord-videos.json ]; then
            git add kpc-discord-videos.json
            # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
            KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
              bash .github/scripts/kpc_save_overwrite.sh --copy 'Remember videos shared on Discord' - -- kpc-discord-videos.json
          fi
          exit "${dv_rc:-0}"
