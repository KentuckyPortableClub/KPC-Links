name: KPC Watcher
# Chat 5, Oct 26 2026 (Brandon GO 11:50 AM). Once a week, read-only: what changed out there, routed by chat
# (KY park pages + POTA/SOTA/WWFF rules -> chat 8; closure sources that now answer -> chat 2; ARRL hamfests +
# special events for KY and neighbours -> chat 6). Never fails, never posts, never emails (no issue comments).
# Memory + report live on the 'bot-state' branch (one commit, replaced weekly): nothing on main changes, so the
# site is not rebuilt. Read it:  git fetch origin bot-state && git show FETCH_HEAD:watcher-report.md
on:
  schedule:
    - cron: '29 4 * * 2'    # Monday 11:29 PM Central (10:29 in winter): a quiet hour, report ready Tuesday morning
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-watcher
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Last week's memory (bot-state branch)
        id: kept_green_1
        continue-on-error: true
        run: |
          git fetch -q --depth=1 origin bot-state 2>/dev/null && git show FETCH_HEAD:watcher-state.json > /tmp/old-state.json 2>/dev/null || echo '{}' > /tmp/old-state.json
          echo "memory: $(wc -c < /tmp/old-state.json) bytes"
      - name: Watch
        id: kept_green_2
        continue-on-error: true
        timeout-minutes: 40
        env:
          WATCH_MINUTES: '35'
        run: |
          python3 .github/scripts/kpc_watcher.py /tmp/old-state.json /tmp/watcher-state.json /tmp/watcher-report.md || { kpc_rc=$?; echo "::error title=kpc_watcher.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_watcher.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          if [ -s /tmp/watcher-report.md ]; then cat /tmp/watcher-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save memory + report to the bot-state branch (replaces last week's, no history kept)
        id: kept_green_3
        continue-on-error: true
        run: |
          [ -s /tmp/watcher-state.json ] || exit 0
          python3 -c "import json;json.load(open('/tmp/watcher-state.json'))" || exit 0
          AUTH="$(git config --get http.https://github.com/.extraheader || true)"   # ok: an optional file or tidy step
          mkdir -p /tmp/bs && cd /tmp/bs && git init -q && git checkout -q -b bot-state
          cp /tmp/watcher-state.json /tmp/watcher-report.md .
          printf 'Bot memory that the website never reads (KPC storage plan, Oct 25-26 2026). One commit, replaced by each run.\n' > README.md
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m 'KPC Watcher memory + report'
          { for i in 1 2 3; do git -c http.https://github.com/.extraheader="$AUTH" push -q -f "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/bot-state && exit 0; sleep $((i*10)); done; echo "::error title=Save::not saved after every try; the next run tries again"; }
          exit 0
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
