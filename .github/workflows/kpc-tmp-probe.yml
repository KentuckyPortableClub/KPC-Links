name: KPC tmp probe
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - continue-on-error: true
        run: |
          python3 - <<'PY' || true
          import json,urllib.request,urllib.parse,re,glob
          def g(u,p):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u+'?'+urllib.parse.urlencode(p),headers={'User-Agent':'KPC probe'}),timeout=90).read())
          def n(t,m): print('::notice title=%s::%s'%(t,str(m).replace('\n',' ')[:950]),flush=True)
          U='https://gis.arkansas.gov/arcgis/rest/services/FEATURESERVICES/Boundaries/FeatureServer/21'
          try:
              d=g(U,{'f':'json'}); fl=[f['name'] for f in d['fields']]; n('AR layer',f"{d.get('name')} {d.get('geometryType')} fields {fl[:20]} copyright {str(d.get('copyrightText'))[:80]}")
              j=g(U+'/query',{'where':'1=1','outFields':'*','returnGeometry':'true','outSR':4326,'maxAllowableOffset':0.01,'geometryPrecision':3,'f':'json','resultRecordCount':2000})
              fs=j['features']; n('AR count',len(fs))
              KW=re.compile(r'\b(natural|area|areas|state|park|wildlife|management|the|of|and|nature|preserve)\b')
              core=lambda x:' '.join(KW.sub(' ',re.sub(r'[^a-z0-9 ]',' ',str(x or '').lower())).split())
              names=[]
              for f in fs:
                  a=f['attributes']; nm=next((v for k,v in a.items() if isinstance(v,str) and re.search('name',k,re.I)),'')
                  rs=(f.get('geometry') or {}).get('rings') or []; pts=[p for r in rs for p in r]
                  bb=[min(p[0] for p in pts),min(p[1] for p in pts),max(p[0] for p in pts),max(p[1] for p in pts)] if pts else None
                  names.append((core(nm),nm,bb))
              key=json.load(open('data/us-key/US-AR.json'))['parks']; P=json.load(open('data/parkinfo/US-AR.json'))['parks']
              gives=[];already=[]
              for r,p in key.items():
                  v=P.get(r)
                  if not v or v[5] is None: continue
                  c=core(v[0])
                  for cn,nm,bb in names:
                      if c and cn==c and bb and bb[0]-.3<=v[6]<=bb[2]+.3 and bb[1]-.3<=v[5]<=bb[3]+.3:
                          (already if p.get('m') else gives).append(f"{r} {v[0]} -> {nm}"); break
              n('AR gives (no outline yet)',f"{len(gives)}: "+' | '.join(gives)[:850])
              n('AR same name, already outlined',f"{len(already)}: "+' | '.join(already)[:850])
              n('AR name field',[k for k in fs[0]['attributes']][:15])
          except Exception as e: n('err',e)
          PY
