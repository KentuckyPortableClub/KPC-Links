name: KPC tmp probe
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - continue-on-error: true
        run: |
          python3 - <<'PY' || true
          import json,urllib.request,urllib.parse
          def g(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'KPC probe'}),timeout=40).read())
          def n(t,m): print('::notice title=%s::%s'%(t,str(m).replace('\n',' ')[:950]),flush=True)
          B='https://services2.arcgis.com/wCOMu5IS7YdSyPNx/arcgis/rest/services'
          for s in ['Facilities_Components_APCA_OpenOuvert','Interest_Point_Interet_APCA_OpenOuvert']:
              try:
                  info=g(B+'/'+s+'/FeatureServer?f=json'); 
                  for L in info.get('layers',[])[:4]:
                      U=B+'/'+s+'/FeatureServer/%d'%L['id']
                      d=g(U+'?f=json'); fl=[f['name'] for f in d['fields']]
                      c=g(U+'/query?where=1%3D1&returnCountOnly=true&f=json').get('count')
                      sm=g(U+'/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=1&f=json')['features']
                      n(s[:22]+' %d'%L['id'],'%s %s count %s fields %s | %s'%(L['name'],d.get('geometryType'),c,fl[:25],json.dumps([x['attributes'] for x in sm],ensure_ascii=False)[:350]))
                      tf=[f for f in fl if any(w in f.lower() for w in ('type','categ','class'))][:1]
                      for f in tf:
                          st=g(U+'/query?'+urllib.parse.urlencode({'where':'1=1','groupByFieldsForStatistics':f,'outStatistics':json.dumps([{'statisticType':'count','onStatisticField':fl[0],'outStatisticFieldName':'n'}]),'f':'json'}))['features']
                          n(s[:12]+' %d types'%L['id'], ' ; '.join('%s=%s'%(str(x['attributes'].get(f))[:40],x['attributes'].get('n')) for x in sorted(st,key=lambda x:-x['attributes']['n']))[:950])
              except Exception as e: n(s[:30]+' err',e)
          PY
