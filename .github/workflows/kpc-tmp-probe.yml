name: KPC temp probe (chat 2, delete after)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        continue-on-error: true
        run: |
          python3 - <<'PY' || true
          import urllib.request, re, html
          P = {'deer': ('https://fw.ky.gov/Hunt/Pages/Deer.aspx', ['Sept. 5', 'Jan. 18', 'Sept. 19', 'Oct. 10', 'Oct. 17', 'Nov. 14', 'Nov. 29', 'Dec. 12', 'Dec. 20', 'Dec. 26']),
               'elk': ('https://fw.ky.gov/Hunt/Pages/Elk-Hunting-Regs.aspx', ['Sept. 26', 'Oct. 3', 'Oct. 7', 'Nov. 28', 'Dec. 2', 'Jan. 2', 'Jan. 6']),
               'bear': ('https://fw.ky.gov/Hunt/Pages/Bear-Hunting.aspx', ['Dec. 12', 'Dec. 14', 'Dec. 16']),
               'ballard': ('https://app.fw.ky.gov/Public_Lands_Search/detail.aspx?Kdfwr_id=224', ['Oct. 15', 'March 15', 'Mar. 15']),
               'boatwright': ('https://app.fw.ky.gov/Public_Lands_Search/detail.aspx?Kdfwr_id=222', ['Oct. 15', 'March 15', 'Mar. 15', 'Swan Lake']),
               'fishtrap': ('https://app.fw.ky.gov/Public_Lands_Search/detail.aspx?Kdfwr_id=25', ['muzzleloader', 'October', 'quota'])}
          for k, (u, want) in P.items():
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 KPC check'}), timeout=40).read().decode('utf-8', 'replace')
                  t = re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', b)))
                  have = {w: (w.lower() in t.lower()) for w in want}
                  sn = ''
                  if k in ('ballard', 'boatwright', 'fishtrap'):
                      m = re.search(r'.{0,160}(Oct\.? 15|muzzleloader).{0,200}', t, re.I); sn = m.group(0) if m else ''
                  print(f'::notice title=probe {k}::{len(t)} chars; ' + ', '.join(f"{w}={'Y' if v else 'n'}" for w, v in have.items()) + (' || ' + sn[:380] if sn else ''))
              except Exception as e:
                  print(f'::notice title=probe {k}::FAILED {str(e)[:150]}')
          PY
