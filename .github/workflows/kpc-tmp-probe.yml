name: KPC tmp probe
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - continue-on-error: true
        run: |
          python3 - <<'PY' || true
          import json,urllib.request,urllib.parse
          def g(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'KPC probe'}),timeout=40).read())
          def n(t,m): print('::notice title=%s::%s'%(t,str(m).replace('\n',' ')[:950]),flush=True)
          B='https://services2.arcgis.com/wCOMu5IS7YdSyPNx/arcgis/rest/services'
          try:
              sv=[x['name'] for x in g(B+'?f=json')['services']]
              n('svc', str(len(sv))+' services; facility/component/park/access ones: '+', '.join(x for x in sv if any(w in x.lower() for w in ('facil','compon','park','access','trail','install','amen','poi','place')))[:900])
          except Exception as e: n('svc err',e)
          for s in ['vw_Facilities_Installations_Point_V2_FGP','Facilities_Installations_Point_OpenData']:
              U=B+'/'+s+'/FeatureServer/0'
              try:
                  d=g(U+'?f=json'); fl=[f['name'] for f in d['fields']]
                  c=g(U+'/query?where=1%3D1&returnCountOnly=true&f=json').get('count')
                  sm=g(U+'/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=2&f=json')['features']
                  n(s[:30],'%s %s count %s fields %s | sample %s'%(d.get('geometryType'),d.get('editingInfo',{}).get('lastEditDate',''),c,fl,json.dumps([x['attributes'] for x in sm],ensure_ascii=False)[:500]))
                  tf=[f for f in fl if any(w in f.lower() for w in ('type','categ','class'))][:2]
                  for f in tf:
                      st=g(U+'/query?'+urllib.parse.urlencode({'where':'1=1','groupByFieldsForStatistics':f,'outStatistics':json.dumps([{'statisticType':'count','onStatisticField':fl[0],'outStatisticFieldName':'n'}]),'f':'json'}))['features']
                      n(s[:20]+' '+f, ' ; '.join('%s=%s'%(x['attributes'].get(f),x['attributes'].get('n')) for x in sorted(st,key=lambda x:-x['attributes']['n']))[:950])
              except Exception as e: n(s[:30]+' err',e)
          PY
