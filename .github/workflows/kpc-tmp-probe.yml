name: KPC temp probe (chat 2, delete after)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        continue-on-error: true
        run: |
          python3 - <<'PY' || true
          import urllib.request, json, re
          U = {'WY': 'https://wyo-prop-div.wyo.gov/tax-districts/maps-gis-data',
               'MD': 'https://planning.maryland.gov/MSDC/Pages/91_property_mapping/md-property-view.aspx',
               'DE': 'https://deldot.gov/Business/drc/index.shtml?dc=rightofway',
               'ND': 'https://www.gis.nd.gov/',
               'NH': 'https://granit24a.sr.unh.edu/nhgeodata/rest/services/CAD/ParcelMosaic/MapServer?f=json',
               'VA': 'https://vgin.vdem.virginia.gov/',
               'AR': 'https://services5.arcgis.com/bPacKTm9cauMXVfn/arcgis/rest/services/Arkansas_State_Parks/FeatureServer/0?f=json'}
          for k, u in U.items():
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'KPC check (kentuckyportableclub.github.io)'}), timeout=40)
                  b = r.read().decode('utf-8', 'replace')
                  if u.endswith('f=json'):
                      j = json.loads(b); extra = f"name={j.get('name')} type={j.get('geometryType')} fields={[f['name'] for f in j.get('fields', [])][:14]} layers={[l.get('name') for l in j.get('layers', [])][:8]}"
                  else:
                      links = sorted(set(re.findall(r'href="(https?://[^"]*(?:parcel|property|viewer|map|ownership)[^"]*)"', b, re.I)))[:6]
                      extra = f"title={(re.search(r'<title>(.*?)</title>', b, re.S | re.I) or [None, ''])[1].strip()[:80]} links={links}"
                  print(f'::notice title=probe {k}::{r.status} {extra}'[:900])
              except Exception as e:
                  print(f'::notice title=probe {k}::FAILED {str(e)[:150]}')
          PY
