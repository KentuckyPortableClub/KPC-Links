name: KPC tmp probe
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - continue-on-error: true
        run: |
          python3 - <<'PY' || true
          import json,urllib.request,urllib.parse
          def g(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'KPC probe'}),timeout=40).read())
          def n(t,m): print('::notice title=%s::%s'%(t,str(m).replace('\n',' ')[:950]),flush=True)
          A='https://open.canada.ca/data/api/3/action/'
          out=[]
          for q in ['Facilities - Point','Components - Point','Parks Canada parking','Parks Canada trailheads']:
              try:
                  r=g(A+'package_search?'+urllib.parse.urlencode({'q':'title:"%s"'%q if 'Point' in q else q,'rows':8}))['result']['results']
                  out.append(q+' => '+' ; '.join(p['id'][:8]+' '+p['title'][:40]+' ['+p.get('organization',{}).get('name','')+']' for p in r))
              except Exception as e: out.append(q+' err '+str(e))
          for t in out: n('search',t)
          try:
              p=g(A+'package_show?id=3969368d-33b5-47c8-8953-f31b15d8e007')['result']
              n('show',p['title']+' | '+p.get('license_title','')+' | '+' ; '.join(r.get('format','')+' '+r.get('url','') for r in p['resources']))
          except Exception as e: n('show err',e)
          PY
