name: KPC temp probe (chat 2, delete after)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        continue-on-error: true
        run: |
          python3 - <<'PY' || true
          import urllib.request, urllib.parse, json
          N = 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/NPS_Land_Resources_Division_Boundary_and_Tract_Data_Service/FeatureServer/2'
          F = 'https://services.arcgis.com/QVENGdaPbd4LUkLV/arcgis/rest/services/FWSApproved_Authoritative/FeatureServer/0'
          def g(u, q=None):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u + ('?' + urllib.parse.urlencode(q) if q else ''), headers={'User-Agent': 'KPC check'}), timeout=60).read())
          for name, u, w in (('NPS', N, "UNIT_CODE IN ('CURE','KALA','UPDE','MNRR','DAAV','BLRV','CAKR')"), ('FWS', F, 'ORGCODE IN (41570,22560)')):
              try:
                  info = g(u, {'f': 'json'})
                  j = g(u + '/query', {'where': w, 'outFields': '*', 'returnGeometry': 'false', 'f': 'json'})
                  rows = [{k: v for k, v in f['attributes'].items() if isinstance(v, (str, int)) and k.upper() in ('OBJECTID', 'UNIT_CODE', 'UNIT_NAME', 'PARKNAME', 'ORGCODE', 'ORGNAME', 'STATE', 'STATE_ABBR', 'GIS_ACRES', 'GNIS_NAME', 'UNIT_TYPE')} for f in j.get('features', [])]
                  print(f"::notice title=probe {name}::oid={info.get('objectIdField')} fields={[x['name'] for x in info.get('fields', [])][:30]} rows={rows}"[:950])
              except Exception as e:
                  print(f'::notice title=probe {name}::FAILED {str(e)[:150]}')
          PY
