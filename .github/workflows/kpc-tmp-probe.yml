name: KPC temp probe (chat 2, delete after)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        continue-on-error: true
        run: |
          python3 - <<'PY' || true
          import urllib.request, json
          base = 'https://services1.arcgis.com/CNPdEkvnGl65jCX8/arcgis/rest/services/IDPR_Parks_and_Facilities/FeatureServer'
          U = {'ID svc': base + '?f=json'}
          try:
              for l in json.loads(urllib.request.urlopen(base + '?f=json', timeout=40).read()).get('layers', []):
                  U[f"ID L{l['id']} {l['name']}"[:40]] = base + f"/{l['id']}?f=json"
                  U[f"ID L{l['id']} rows"] = base + f"/{l['id']}/query?where=1%3D1&outFields=*&resultRecordCount=3&returnGeometry=false&f=json"
          except Exception as e: print('::notice title=probe list::' + str(e)[:100])
          for k, u in U.items():
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'KPC check (kentuckyportableclub.github.io)'}), timeout=45).read().decode('utf-8', 'replace')
                  j = json.loads(b)
                  if 'features' in j and 'type' in j and k.endswith('hub'):
                      x = '; '.join(f"{(f.get('properties') or {}).get('title')} [{(f.get('properties') or {}).get('type')}] {(f.get('properties') or {}).get('url') or ''}" for f in j['features'][:8])
                  elif k.endswith('rows'):
                      x = str([f.get('attributes') for f in j.get('features', [])])
                  elif k.startswith('ID L'):
                      x = str((j.get('geometryType'), [f['name'] for f in j.get('fields', [])][:25], j.get('copyrightText'), (j.get('description') or '')[:120]))
                  elif k == 'IA fields':
                      x = str([(f['name'], f.get('alias')) for f in j.get('fields', [])])
                  elif k == 'ID org':
                      x = str([sv['name'] for sv in j.get('services', []) if any(w in sv['name'].lower() for w in ('camp', 'park', 'recreat', 'site', 'facilit'))])
                  else:
                      x = json.dumps({kk: j.get(kk) for kk in ('count', 'name', 'error', 'geometryType')} | {'layers': [(l.get('id'), l.get('name')) for l in j.get('layers', [])][:14]})
                  print(f'::notice title=probe {k}::{x[:850]}')
              except Exception as e:
                  print(f'::notice title=probe {k}::FAILED {str(e)[:150]}')
          PY
