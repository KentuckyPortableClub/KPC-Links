name: KPC temp probe (chat 2, delete after)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        continue-on-error: true
        run: |
          python3 - <<'PY' || true
          import urllib.request, json
          U = {'IA public lands q': 'https://programs.iowadnr.gov/geospatial/rest/services/Boundaries/Public_Lands/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json',
               'IA state parks q': 'https://programs.iowadnr.gov/geospatial/rest/services/Recreation/State_Parks/MapServer/9/query?where=1%3D1&returnCountOnly=true&f=json',
               'IA recreation 11 q': 'https://programs.iowadnr.gov/geospatial/rest/services/Recreation/Recreation/MapServer/11/query?where=1%3D1&returnCountOnly=true&f=json',
               'MD feats': 'https://mdgeodata.md.gov/imap/rest/services/Environment/MD_ProtectedLands/FeatureServer/0/query?where=1%3D1&outFields=*&resultRecordCount=2&returnGeometry=false&f=json',
               'ID idpr hub': 'https://idpr-data-idaho.hub.arcgis.com/api/search/v1/collections/all/items?q=camp&limit=10',
               'ID hub2': 'https://data-idaho.hub.arcgis.com/api/search/v1/collections/all/items?q=state%20parks%20campgrounds&limit=10'}
          for k, u in U.items():
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'KPC check (kentuckyportableclub.github.io)'}), timeout=45).read().decode('utf-8', 'replace')
                  j = json.loads(b)
                  if 'features' in j and 'type' in j and k.endswith('hub'):
                      x = '; '.join(f"{(f.get('properties') or {}).get('title')} [{(f.get('properties') or {}).get('type')}] {(f.get('properties') or {}).get('url') or ''}" for f in j['features'][:8])
                  else:
                      x = json.dumps({kk: j.get(kk) for kk in ('count', 'name', 'error', 'geometryType')} | {'layers': [(l.get('id'), l.get('name')) for l in j.get('layers', [])][:14]})
                  print(f'::notice title=probe {k}::{x[:850]}')
              except Exception as e:
                  print(f'::notice title=probe {k}::FAILED {str(e)[:150]}')
          PY
