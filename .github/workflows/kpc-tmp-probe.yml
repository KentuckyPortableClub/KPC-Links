name: KPC temp probe (chat 2, delete after)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        continue-on-error: true
        run: |
          python3 - <<'PY' || true
          import urllib.request, re, html
          P = {'beaver creek': 39, 'dennis-gray': 148, 'curtis gates lloyd': 153, 'south shore': 9067, 'kentucky river': 169, 'sloughs': 230}
          for k, i in P.items():
              u = f'https://app.fw.ky.gov/Public_Lands_Search/detail.aspx?Kdfwr_id={i}'
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 KPC check'}), timeout=40).read().decode('utf-8', 'replace')
                  t = re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', b)))
                  m = re.search(r'Regulations(.{0,700})', t)
                  print(f'::notice title=probe {k}::' + (m.group(1) if m else t[:400])[:880])
              except Exception as e:
                  print(f'::notice title=probe {k}::FAILED {str(e)[:150]}')
          for k, u in {'quota page': 'https://fw.ky.gov/Hunt/Pages/Quota-Hunts.aspx', 'public land page': 'https://fw.ky.gov/Hunt/Pages/Public-Land-Hunting.aspx'}.items():
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 KPC check'}), timeout=40).read().decode('utf-8', 'replace')
                  t = re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', b)))
                  hits = [m.group(0) for m in re.finditer(r'.{0,90}(Nov\. 7|Nov\. 7-8|Nov\. 14|Dec\. 5).{0,90}', t)][:5]
                  print(f'::notice title=probe {k}::{len(t)} chars; ' + ' || '.join(hits)[:860])
              except Exception as e:
                  print(f'::notice title=probe {k}::FAILED {str(e)[:150]}')
          PY
