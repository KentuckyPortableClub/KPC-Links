name: KPC Park Notes
# Copies approved tips (and their photos) from the KPC Park Tips Google Form sheet to the Park Notes page.
# Runs every 2 hours, or any time from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: '41 0,6,12,18 * * *'   # every 6 h (Brandon GO Oct 28: was every 2 h)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-park-notes
  cancel-in-progress: false
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - name: Install image tools
        run: pip install --quiet pillow
      - name: Copy approved tips
        env:
          NOTES_SHEET_CSV: ${{ secrets.NOTES_SHEET_CSV }}
          KPC_CHECKS: data/kpc-checks-notes.json
        run: python3 .github/scripts/kpc_park_notes.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/kpc_light_guard.py kpc-park-notes.json kpc-park-notes-us.json || true   # Oct 30 (Brandon 6:07 AM GO, HQ step C): shrank by half / a row twice = keep the saved copy + a line to chat 11
          git add .claude/inbox/chat-11.md 2>/dev/null || true
          git add kpc-park-notes.json kpc-park-notes-form.json photos/notes 2>/dev/null || git add kpc-park-notes.json photos/notes
          if [ -e kpc-park-notes-us.json ]; then git add kpc-park-notes-us.json; fi
          if [ -e data/kpc-checks-notes.json ]; then git add data/kpc-checks-notes.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update park notes'
            git pull --rebase --autostash || true
            git push || echo 'Push skipped; will save on the next run.'
          fi
