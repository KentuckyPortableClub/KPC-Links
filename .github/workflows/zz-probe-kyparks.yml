name: zz pull KY park features (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          B='https://kygisserver.ky.gov/arcgis/rest/services/WGS84WM_Services/Ky_State_Parks_Features_WGS84WM/MapServer'
          def g(lid,flds):
              q={'where':'1=1','outFields':flds,'returnGeometry':'true','outSR':4326,'f':'json','resultRecordCount':2000}
              return json.loads(urllib.request.urlopen(urllib.request.Request(f'{B}/{lid}/query?'+urllib.parse.urlencode(q),headers={'User-Agent':'KPC'}),timeout=120).read())['features']
          th=[{'la':round(f['geometry']['y'],5),'lo':round(f['geometry']['x'],5),**{k:v for k,v in f['attributes'].items() if k in ('NAME','TRAIL_NAME','PARKING','RESTROOMS','AGENCY','DESCRIPTN')}} for f in g(0,'NAME,TRAIL_NAME,PARKING,RESTROOMS,AGENCY,DESCRIPTN')]
          info=[{'la':round(f['geometry']['y'],5),'lo':round(f['geometry']['x'],5),**{k:v for k,v in f['attributes'].items() if k in ('PARK_NAME','BL_NAME')}} for f in g(4,'PARK_NAME,BL_NAME')]
          json.dump({'source':'Kentucky State Parks GIS (kygisserver.ky.gov Ky_State_Parks_Features): State Park Trail Heads + Information Sites','trailheads':th,'info':info},open('data/ky-park-features.json','w'),indent=0)
          print(f'::notice title=pulled::{len(th)} trailheads, {len(info)} info sites')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ky-park-features.json && git commit -m 'KY State Parks trailheads + info sites (official GIS)' && git push
