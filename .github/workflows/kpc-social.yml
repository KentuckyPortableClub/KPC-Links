name: KPC Social Posts
# Automatic posts to the KPC Discord and the KPC Facebook Page:
#   Every morning  - campout countdown (60/30/14/7/1 days), member milestones, new photo albums,
#                    new guide/tool pages (the first one goes out with the Oct 21, 2026 go-live)
#   Wednesdays     - Rare Park of the Week
#   Thursdays      - "This weekend in Kentucky ham radio" (only when something is on)
#   Every morning  - member activation recaps (Kentucky parks, 10+ contacts, with a map picture)
#   Every morning  - club birthday + license anniversaries (only members listed in kpc-birthdays.json)
#   Fridays        - best band times from Kentucky this week (WSPR beacon reports)
# Nothing posts twice: what's been posted is remembered in kpc-social-state.json.
# Test any task from the Actions tab: Run workflow, pick the task, and leave "dry run" ticked to see the post without sending it.
on:
  schedule:
    - cron: '7 13 * * *'
    - cron: '29 14 * * 3'
    - cron: '13 22 * * 4'
    - cron: '17 12 * * 5'
  workflow_dispatch:
    inputs:
      task:
        description: 'Which post'
        type: choice
        options: [countdown, weekend, rarepark, milestones, recaps, bandtimes, birthdays, photos, pages, bandalert]
        default: weekend
      dry_run:
        description: 'Dry run (show the post, do not send)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: kpc-social
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Picture tools
        run: python3 -c 'import PIL' 2>/dev/null || pip install --quiet pillow
      - name: Post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          GENERAL_WEBHOOK_URL: ${{ secrets.KPC_GENERAL_WEBHOOK }}
          ANNOUNCE_WEBHOOK_URL: ${{ secrets.KPC_ANNOUNCE_WEBHOOK }}
          PARKS_WEBHOOK_URL: ${{ secrets.KPC_PARKS_WEBHOOK }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          SCHED: ${{ github.event.schedule }}
          TASK: ${{ inputs.task }}
        run: |
          case "$SCHED" in
            '7 13 * * *')  TASKS='countdown milestones recaps birthdays photos pages' ;;
            '17 12 * * 5') TASKS='bandtimes' ;;
            '29 14 * * 3') TASKS='rarepark' ;;
            '13 22 * * 4') TASKS='weekend' ;;
            *)             TASKS="$TASK" ;;
          esac
          rc=0
          for t in $TASKS; do node .github/scripts/kpc_social.js "$t" || rc=1; done
          exit $rc
      - name: Remember what was posted
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f kpc-social-state.json ]; then
            git add kpc-social-state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Remember social posts'
              git pull --rebase --autostash || true
              git push || echo 'Push skipped; will save on the next run.'
            fi
          fi
