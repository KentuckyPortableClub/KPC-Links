name: KPC Top 25
# Every Monday: refreshes kpc-top25.json (the 25 Kentucky POTA parks with the fewest QSOs and the 25 with
# the fewest activations) from POTA's public park numbers. kpc-guide-top25.html reads that file.
# Run it any time from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-top25
  cancel-in-progress: false
jobs:
  top25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rank Kentucky parks
        run: python3 .github/scripts/kpc_top25.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kpc-top25.json
          if git diff --cached --quiet; then echo 'No change.'; exit 0; fi
          # Nov 2 review (G7): save with the shared helper (shared with another workflow (kpc-top25.json): merged the old way, but loud). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE=rebase KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh 'Update Top 25 low-activity parks' - -- kpc-top25.json
