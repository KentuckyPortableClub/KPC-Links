name: KPC Top 25
# Every Monday: refreshes kpc-top25.json (the 25 Kentucky POTA parks with the fewest QSOs and the 25 with
# the fewest activations) from POTA's public park numbers. kpc-guide-top25.html reads that file.
# Run it any time from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-top25
  cancel-in-progress: false
jobs:
  top25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rank Kentucky parks
        run: python3 .github/scripts/kpc_top25.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kpc-top25.json
          if git diff --cached --quiet; then echo 'No change.'; exit 0; fi
          git commit -m 'Update Top 25 low-activity parks'
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 15))
          done
          echo '::notice title=Push skipped::Could not push kpc-top25.json; it will be saved on the next run.'
