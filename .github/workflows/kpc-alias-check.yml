name: KPC name-match check (temporary, by hand)
# Oct 29 2026 (chat 2; HQ 10:34 AM, Brandon 10:30 AM 'bot first, then review by 2'): one read-only look at chat 8's name-match
# candidates against the official layers; writes .claude/build/research/alias-check.json + KPC_AliasCheck_desk.md. Never fails.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
      - name: Read the moved data from KPC-Data
        continue-on-error: true
        run: bash .github/scripts/kpc_overlay.sh
      - name: Check
        continue-on-error: true
        env:
          MINUTES: '150'
        run: python3 .github/scripts/kpc_alias_check.py || true
      - name: Save the findings
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude/build/research/alias-check.json .claude/build/research/KPC_AliasCheck_desk.md 2>/dev/null || true
          git diff --cached --quiet || { git commit -m 'Name-match check findings (read only)'; for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 9; done; } || true
