name: KPC Campground Reviews
# Copies campground / cabin reviews (and their photos) from the KPC Campground Reviews Google Form sheet to the
# Campgrounds & Cabins page. Club members and the call signs in kpc-preapproved.json post right away; others after
# YES in the sheet's Approved column. Runs every 2 hours, or any time from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: '53 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-campground-notes
  cancel-in-progress: false
jobs:
  reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install image tools
        run: pip install --quiet pillow
      - name: Copy reviews
        env:
          CAMPGROUND_SHEET_CSV: ${{ secrets.CAMPGROUND_SHEET_CSV }}
        run: python3 .github/scripts/kpc_campground_notes.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kpc-campground-notes.json photos/campgrounds 2>/dev/null || git add kpc-campground-notes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update campground reviews'
            git pull --rebase --autostash || true
            git push || echo 'Push skipped; will save on the next run.'
          fi
