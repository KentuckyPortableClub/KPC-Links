name: KPC Guide PDFs
# Prints the web guides (kpc-guide-*.html) to PDF under the old PDF filenames, so every "Download PDF" link
# and every old link keeps working. Runs when a guide page or its data changes, after the weekly Top 25
# refresh, every Monday, or any time from the Actions tab ("Run workflow").
# A PDF is only replaced when its words or links really changed (not just the print date or an 'updated' date stamp).
# The Safety Guide keeps its original illustrated PDF and is not printed here.
on:
  push:
    branches: [main]
    paths:
      - 'kpc-guide-*'
      - 'kpc-guide.css'
      - 'kpc-ky-data.json'
      - 'kpc-ky-counties-hd.json'
      - 'kpc-top25.json'
      - '.github/scripts/kpc_guide_pdf.js'
  workflow_run:
    workflows: ['KPC Top 25']
    types: [completed]
  schedule:
    - cron: '41 13 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-guide-pdf
  cancel-in-progress: false
jobs:
  pdf:
    runs-on: ubuntu-24.04   # Nov 9: Playwright has no build for ubuntu 26.04 (Guide PDFs run 42637107981)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the PDF printer
        id: printer
        # Nov 10 (quiet runs): failed here (Playwright / browser download). Now 3 tries with a wait between, the error goes to the job
        # summary, and the next step decides whether the run may still end green.
        continue-on-error: true
        run: |
          ok=0
          for i in 1 2 3; do
            if { npm install --no-save --no-package-lock playwright@1.56.0 && npx playwright install --with-deps chromium && pip install --quiet pypdf; } > /tmp/printer.log 2>&1; then ok=1; break; fi
            echo "::warning title=PDF printer::install try $i failed; trying again"
            { echo "### PDF printer install, try $i failed"; echo '```'; tail -n 15 /tmp/printer.log | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            sleep $((i * 20))
          done
          [ "$ok" = 1 ] || exit 1
      - name: Printer missing - may this run still end green?
        if: ${{ steps.printer.outcome == 'failure' }}
        run: |
          # Red only if a PDF would ship wrong: some page, style or data file a guide reads changed since the newest commit that touched a PDF.
          git fetch -q --depth=300 origin main 2>/dev/null || true   # ok: a deeper look is optional (without it this run stays red, the safe side)
          P=$(git log -1 --format=%H -- '*.pdf' 2>/dev/null || true)   # ok: no PDF commit in view = the next lines stay red (safe side)
          if [ -z "$P" ] || ! git cat-file -e "$P" 2>/dev/null; then
            echo "::error title=Guide PDFs::the PDF printer is missing and the last PDF save is not in view: cannot show the PDFs are current"
            echo "**Printer missing, and the last PDF save could not be found: red (cannot show the PDFs are current).**" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          CH=$(git diff --name-only "$P" HEAD -- 'kpc-guide-*' kpc-guide.css kpc-ky-data.json kpc-ky-counties-hd.json kpc-top25.json .github/scripts/kpc_guide_pdf.js | grep -v '\.pdf$' || true)   # ok: grep finds nothing = no input changed
          if [ -n "$CH" ]; then
            echo "::error title=Guide PDFs::the PDF printer is missing and these inputs changed since the last PDF save: $(echo $CH | head -c 300)"
            { echo "**Printer missing and guide inputs changed since the last PDF save (${P:0:8}): red, a PDF may ship out of date.**"; echo "$CH" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "::notice title=Guide PDFs::the PDF printer is missing but no guide input changed since the last PDF save (${P:0:8}): nothing to print"
          echo "**Printer missing, but no guide page, style or data file changed since the last PDF save (${P:0:8}): no PDF needs reprinting, ending green.**" >> "$GITHUB_STEP_SUMMARY"
      - name: Print the guides
        if: ${{ steps.printer.outcome == 'success' }}
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          mkdir -p /tmp/guides
          node .github/scripts/kpc_guide_pdf.js /tmp/guides
      - name: Keep only PDFs that changed
        if: ${{ steps.printer.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import glob, os, shutil
          import re
          from pypdf import PdfReader
          # Date stamps ('Live data updated 2026-10-23.', 'Updated October 19, 2026') change whenever a
          # data file is re-saved, even when the lists are identical. They must not count as a change,
          # or every guide gets rewritten (about 3 MB each) for nothing. (HQ storage plan, Stage 1)
          STAMP = re.compile(r'(?:Live data )?[Uu]pdated\s+(?:\d{4}-\d\d-\d\d|[A-Z][a-z]+ \d{1,2}, \d{4})')
          def sig(p):
              r = PdfReader(p); out = []
              for pg in r.pages:
                  out.append(STAMP.sub('updated', ' '.join((pg.extract_text() or '').split())))
                  for a in pg.get('/Annots') or []:
                      a = a.get_object(); u = (a.get('/A') or {}).get('/URI')
                      if u: out.append(str(u))
              return out
          changed = []
          for new in sorted(glob.glob('/tmp/guides/*.pdf')):
              name = os.path.basename(new)
              try: same = os.path.exists(name) and sig(name) == sig(new)
              except Exception: same = False
              if not same: shutil.copy(new, name); changed.append(name)
          print(f"::notice title=Guide PDFs::{len(changed)} changed: {', '.join(changed) or 'none'}")
          PY
      - name: Save
        if: ${{ steps.printer.outcome == 'success' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.pdf'
          if git diff --cached --quiet; then echo 'No change.'; exit 0; fi
          PDFS=$(git diff --cached --name-only -- '*.pdf' | tr '\n' ' ')
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'Guide PDFs: reprint from the web guides' - -- $PDFS
