name: KPC Guide PDFs
# Prints the web guides (kpc-guide-*.html) to PDF under the old PDF filenames and uploads them to the
# 'site-pdfs' release (storage plan, Stage 2: keeps these out of the repo and its history, since this bot
# used to rewrite ~12 MB of PDFs on every guide change). Every "Download PDF" link points at the release
# asset, so links keep working. Runs when a guide page or its data changes, after the weekly Top 25
# refresh, every Monday, or any time from the Actions tab ("Run workflow").
# A PDF is only re-uploaded when its words or links really changed (not just the print date or an
# 'updated' date stamp). The Safety Guide keeps its original illustrated PDF and is not printed here.
on:
  push:
    branches: [main]
    paths:
      - 'kpc-guide-*'
      - 'kpc-guide.css'
      - 'kpc-ky-data.json'
      - 'kpc-ky-counties-hd.json'
      - 'kpc-top25.json'
      - '.github/scripts/kpc_guide_pdf.js'
  workflow_run:
    workflows: ['KPC Top 25']
    types: [completed]
  schedule:
    - cron: '41 13 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-guide-pdf
  cancel-in-progress: false
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the PDF printer
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          pip install --quiet pypdf
      - name: Print the guides
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          mkdir -p /tmp/guides
          node .github/scripts/kpc_guide_pdf.js /tmp/guides
      - name: Fetch the current PDFs from the release, for comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/current
          gh release view site-pdfs -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create site-pdfs -R "$GITHUB_REPOSITORY" --title 'KPC PDFs & Guides' \
            --notes 'Large PDFs for the KPC website (guides, flyers, archives). Hosted here instead of in the repo, per the storage plan. Pages link straight to these files; nothing here is meant to be browsed on the releases page.'
          for f in /tmp/guides/*.pdf; do
            n=$(basename "$f")
            gh release download site-pdfs -R "$GITHUB_REPOSITORY" -p "$n" -D /tmp/current --clobber 2>/dev/null || true
          done
      - name: Keep only PDFs that changed, and upload them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import glob, os
          import re
          from pypdf import PdfReader
          # Date stamps ('Live data updated 2026-10-23.', 'Updated October 19, 2026') change whenever a
          # data file is re-saved, even when the lists are identical. They must not count as a change,
          # or every guide gets re-uploaded (about 3 MB each) for nothing. (HQ storage plan, Stage 1)
          STAMP = re.compile(r'(?:Live data )?[Uu]pdated\s+(?:\d{4}-\d\d-\d\d|[A-Z][a-z]+ \d{1,2}, \d{4})')
          def sig(p):
              r = PdfReader(p); out = []
              for pg in r.pages:
                  out.append(STAMP.sub('updated', ' '.join((pg.extract_text() or '').split())))
                  for a in pg.get('/Annots') or []:
                      a = a.get_object(); u = (a.get('/A') or {}).get('/URI')
                      if u: out.append(str(u))
              return out
          changed = []
          for new in sorted(glob.glob('/tmp/guides/*.pdf')):
              name = os.path.basename(new)
              old = os.path.join('/tmp/current', name)
              try: same = os.path.exists(old) and sig(old) == sig(new)
              except Exception: same = False
              if not same: changed.append(new)
          with open('/tmp/changed.txt', 'w') as f:
              f.write('\n'.join(changed))
          print(f"::notice title=Guide PDFs::{len(changed)} changed: {', '.join(os.path.basename(c) for c in changed) or 'none'}")
          PY
          if [ -s /tmp/changed.txt ]; then
            xargs -a /tmp/changed.txt -d '\n' -I{} gh release upload site-pdfs {} -R "$GITHUB_REPOSITORY" --clobber
          fi
