name: TEMP Canada water + roads probe (delete after)
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Probe
        continue-on-error: true
        run: |
          cat > p.py <<'PY'
          import json, re, urllib.request
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'KPC'}), timeout=40) as r: return json.loads(r.read())
              except Exception as e: return {'_err': str(e)[:80]}
          PAT = re.compile(r'hydro|water|nhn|road|nrn|canvec|transport|lake|river', re.I)
          hits = []
          for root in ('https://maps-cartes.services.geo.ca/server_serveur/rest/services', 'https://geoappext.nrcan.gc.ca/arcgis/rest/services',
                       'https://maps-cartes.ec.gc.ca/arcgis/rest/services', 'https://webservices.maps.canada.ca/arcgis/rest/services',
                       'https://proxyinternet.nrcan-rncan.gc.ca/arcgis/rest/services'):
              j = get(root + '?f=json')
              if '_err' in j: print(f'::notice title=probe root::{root} {j["_err"]}'); continue
              folders = [''] + (j.get('folders') or [])
              print(f'::notice title=probe root::{root} folders {len(folders)-1}: {" ".join(folders)[:700]}')
              for f in folders:
                  jj = j if f == '' else get(f'{root}/{f}?f=json')
                  for s in jj.get('services') or []:
                      if PAT.search(s['name']): hits.append(f"{root}/{s['name']}/{s['type']}")
          for h in hits[:60]:
              info = get(h + '?f=json')
              lays = '; '.join(f"{l['id']}={l['name']}" for l in (info.get('layers') or [])[:25])
              print(f'::notice title=probe hit::{h} :: {lays[:800] or info.get("_err", "")}')
          print(f'::notice title=probe done::{len(hits)} hits')
          PY
          python3 p.py || true
