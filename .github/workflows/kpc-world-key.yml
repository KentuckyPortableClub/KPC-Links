name: KPC world answer key
# Busy POTA programs outside North America (AU DE GB JP + PL ES FR CH AT via the EEA): parks joined to OFFICIAL protected-area land only when name + kind match.
# Nov 3 (Brandon YES 5:29 PM): the monthly full rebuild hit the 300-minute limit (run 41631658745: one Australian source stopped
# answering at 12:01 UTC and the job sat there until it was cancelled at 16:58, so NO country after AU was built). Now:
#   plan  = the freeze check + tonight's list + the countries split over up to 3 jobs at once (biggest first, like the US key);
#   build = each job builds its countries, ONE COUNTRY AT A TIME with its own time limit (KPC_WORLD_COUNTRY_MIN, default 100 min;
#           a country that runs over is stopped and named in the build stamp as failed, the others go on); 350 min per job;
#   join  = puts the parts together (index.json merged country by country), the BUILD STAMP, ONE save, the world-bounds branch.
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  schedule:
    - cron: '17 11 3 * *'   # monthly
    - cron: '7 10 * * *'    # nightly, ONLY the countries BOT W wired a new approved layer for (data/world-key/answers-countries.txt)
  # Nov 4 (links-06; per Brandon via Super Head Bot (relayed), 5:48 AM CST Nov 4: "Full world rebuild yes after us and Canada..stand by for more"):
  # owner rule, 2026-11-10: no workflow_run trigger. The Canada key's chain job dispatches this key once per Canada run
  # (chained=ca-key). After a rules change this key waits for the keys before it (kpc_key_order.py). A chained start builds ONLY
  # a new-rules catch-up; otherwise it skips cleanly (one notice).
  workflow_dispatch:
    inputs:
      chained:
        description: "Set by the key before this one only (us-key / ca-key): a chained start after a bot-started run (blank = a normal by-hand run)"
        required: false
        default: ''
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
      pin_join:
        description: "Countries where a pin inside one official area counts as a match (default JP)"
        default: 'JP'
      countries:
        description: 'Countries, e.g. AU DE (blank = AU DE GB JP PL ES FR CH AT)'
        default: ''
      outline_test:
        description: 'yes = write the saved outlines to a test folder and print their size only (Oct 31: 3 m outlines, measure first)'
        default: ''
      force:
        description: "yes = build even while chat 11 grades a held build (Brandon's freeze, Nov 2: by hand only)"
        default: 'no'
      full_rebuild:
        description: "yes = build every listed country, never reuse one (per-area hashes, Nov 12; reuse is off unless the repo variable KPC_AREA_HASH=reuse)"
        default: ''
permissions:
  contents: write
concurrency:   # PR2 (Nov 2): one run of this bot at a time; a second start waits instead of piling up
  group: kpc-world-key
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      groups: ${{ steps.p.outputs.groups }}
      full: ${{ steps.p.outputs.full }}   # Nov 4 (links-04): 1 = the default ALL list was built (the join stamps the rules hash only then)
      expected: ${{ steps.p.outputs.expected }}   # Nov 12 (KPC owner, 2026-11-11): owner-signed expected holds, left out of the build, kept from main
      area_plan: ${{ steps.p.outputs.area_plan }}   # Nov 12 (KPC owner, 2026-11-12): per-country input hashes of this plan (kpc_area_hash.py), stamped on the saved rows
    steps:
      - uses: actions/checkout@v5
      - name: FREEZE CHECK (Brandon Nov 2 7:11 AM; Nov 4 links-04) - a held build on the CURRENT rules, at most 3 days old, with no person's sign-off (Brandon / KZ4CP, after the Nov 2 restart; or signed YES and not yet released) means no new build
        env:
          KPC_INDEX_REF: origin/main   # Nov 4 PM fix bundle (items 1-2): decide on the NEWEST main's stamp, not this queued run's checkout
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 .github/scripts/kpc_key_freeze.py check world-key || { kpc_rc=$?; echo "::error title=kpc_key_freeze.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_key_freeze.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          if grep -q '^FROZEN=1' "$GITHUB_ENV" 2>/dev/null; then echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: BUILD ORDER (links-06; per Brandon via Super Head Bot (relayed), 5:48 AM CST Nov 4) - after a rules change US, then Canada, then the world; a key whose turn has not come skips cleanly and is started again by workflow_run
        env:
          KPC_INDEX_REF: origin/main   # Nov 4 PM fix bundle (items 1-2): decide on the NEWEST main's stamp, not this queued run's checkout
          KPC_CHAINED: ${{ inputs.chained }}   # next round C1: set only when the key before this one dispatched it
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${SKIP:-}" != 1 ]; then python3 .github/scripts/kpc_key_order.py check world-key || { echo "SKIP=1" >> "$GITHUB_ENV"; echo "::notice title=Key build order::the order check stopped (exit $?): this start waits"; }; fi
      - name: Tonight's list (chat 2 Oct 30, Brandon 9:48 'Yes'; the nightly run only builds when BOT W wired a new layer)
        env:
          SCHED: ${{ (github.event.schedule || inputs.as_schedule) }}
        run: |
          # Nov 4 (links-04): RULES_CHANGED=1 (the newest world build was not a full build on the current rules) = build ALL tonight
          # Nov 12 (KPC owner, 2026-11-12): each country row carries the code hash it was built on; RULES_SCOPE (from the freeze check) = the
          # countries NOT yet built on the current rules (a kept country is planned again); empty = every country, as before
          if [ "${RULES_CHANGED:-}" = 1 ] && [ "${SKIP:-}" != 1 ] && [ -n "${RULES_SCOPE:-}" ]; then
            S=$(echo "$RULES_SCOPE" | tr ' ' '\n' | sed 's/^W-//' | tr '\n' ' ' | sed 's/ *$//'); echo "SCOPE_LIST=$S" >> "$GITHUB_ENV"
            echo "::notice title=World key tonight::RULES CHANGED since the newest build: only the countries not yet built on the current rules are built: $S"
          elif [ "${RULES_CHANGED:-}" = 1 ] && [ "${SKIP:-}" != 1 ]; then echo "::notice title=World key tonight::RULES CHANGED since the newest build: every country is built on the current rules (no force needed)"
          elif [ "$SCHED" = "7 10 * * *" ]; then
            L=$(cat data/world-key/answers-countries.txt 2>/dev/null | tr -s ' \n' ' ' | sed 's/^ *//;s/ *$//')
            if [ -z "$L" ]; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "::notice title=World key tonight::no new approved layer: nothing to rebuild tonight"; else echo "NIGHT_LIST=$L" >> "$GITHUB_ENV"; echo "::notice title=World key tonight::new approved layer(s) for: $L"; fi
          fi
      - name: Split the countries over the jobs (Nov 3)
        id: p
        env:
          COUNTRIES: ${{ inputs.countries }}
          GH_TOKEN: ${{ github.token }}
          # Nov 4 PM fix bundle (item 5; Brandon's yes relayed via Super Head Bot, 4:53 PM CST Nov 4): W-41895532587 was not a full build
          # because AU ran over the 100-min country limit in a job shared with 26 other countries. A SLOW country now gets a job of its
          # own and its own limit (repo variables KPC_WORLD_SLOW = space list, default AU; KPC_WORLD_SLOW_MIN, default 300 = under the
          # build step's 335). Two slow jobs at most; the other countries are split as before.
          SLOW: ${{ vars.KPC_WORLD_SLOW || 'AU' }}
          SLOW_MIN: ${{ vars.KPC_WORLD_SLOW_MIN || '300' }}
          AREA_MODE: ${{ vars.KPC_AREA_HASH || 'shadow' }}   # Nov 12: shadow (default) | add (D1 step 1) | reuse (step 3): not before the owner signs D1-D9
          FULL_REBUILD: ${{ inputs.full_rebuild }}
          KPC_SAVED_ONLY_HOSTS: ${{ vars.KPC_SAVED_ONLY_HOSTS }}
        run: |
          if [ "${SKIP:-}" = 1 ]; then echo 'groups=[]' >> "$GITHUB_OUTPUT"; exit 0; fi
          [ -n "${NIGHT_LIST:-}" ] && COUNTRIES="$NIGHT_LIST"
          SHEETC=$(jq -r '.countries|keys|join(" ")' data/world-key/sheet-countries.json 2>/dev/null || true)   # ok: an optional file or tidy step (Nov 1: Brandon's filled sheet)
          DEFAULT_ALL="AU DE GB JP PL ES FR CH AT NL PT SE CZ SI NO RO IT BE DK FI HU SK HR IE LT LV EE LU CO ZA CL $SHEETC"
          # Nov 12 (KPC owner, 2026-11-12): a rules catch-up builds only the countries of the default list not yet on the current rules
          if [ -z "${COUNTRIES:-}" ] && [ -n "${SCOPE_LIST:-}" ]; then COUNTRIES=$(for c in $DEFAULT_ALL; do case " $SCOPE_LIST " in *" $c "*) printf '%s ' "$c" ;; esac; done | sed 's/ *$//'); [ -n "$COUNTRIES" ] || COUNTRIES="$SCOPE_LIST"; fi
          export ALL="${COUNTRIES:-$DEFAULT_ALL}"
          # Nov 12 (KPC owner, 2026-11-11): a country on the owner-signed expected-hold list is decided HERE, before any build: it is left out
          # of the groups and keeps its previous join (one notice each). An unsigned / unknown / expired / sourceless entry, or one whose
          # saved copy no longer matches the bound copy_sha256, is ignored (built as normal); a hold with no joined park on main (nothing
          # to keep) stops the run red. Not the full list = not a full build (no rules stamp).
          mkdir -p cache/world
          HOLD_CCS=$(python3 -c "import json; print(' '.join((json.load(open('data/outlines/world-expected-holds.approved.json')).get('holds') or {})))" 2>/dev/null || true)   # ok: no approved holds file means an empty hold list; an expected --cache check still fails closed
          for c in $HOLD_CCS; do
            gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p "W-$c.json.gz" -D cache/world --clobber 2>/dev/null || echo "::notice title=World key $c::no saved copy W-$c.json.gz on the boundary-cache release to check the hold against"
          done
          EXPECTED=$(python3 .github/scripts/kpc_world_key_join.py expected --file data/outlines/world-expected-holds.approved.json --countries "$ALL" --key data/world-key --cache cache/world) || exit 1
          export EXPECTED; echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          # Nov 12 (KPC owner, 2026-11-12; per-area input hashes, handoff part B): each country's input hash (its layers, overrides, signed
          # baseline, host verdicts, POTA pins, the shared code). SHADOW by default: the table is printed and the list is NOT changed.
          # add = also build every country whose inputs moved since its last build (nothing removed); reuse = also leave out a country whose
          # inputs did not move (main's bytes stay); full_rebuild=yes = no reuse. The POTA pins come from KPC-Data (public, read only).
          rm -rf .pi; GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .pi 2>/dev/null \
            && git -C .pi sparse-checkout set --no-cone data/parkinfo data/intake/official-pins-nov12.json 2>/dev/null && git -C .pi checkout -q 2>/dev/null || { rm -rf .pi; echo "::warning title=Area hashes::KPC-Data pins not read: the pins part is left out this run"; }
          WANT=$(for c in $ALL; do case " $EXPECTED " in *" $c "*) ;; *) printf '%s ' "$c" ;; esac; done)
          ALL=$(python3 .github/scripts/kpc_area_hash.py plan world --list "$WANT" --mode "$AREA_MODE" --full "$FULL_REBUILD" $([ -d .pi ] && echo --data .pi) \
                --var "KPC_SAVED_ONLY_HOSTS=$KPC_SAVED_ONLY_HOSTS" --var "KPC_JP_A10_CROSSWALK=${{ vars.KPC_JP_A10_CROSSWALK || 'off' }}" --out "$RUNNER_TEMP/area-plan.json") || ALL="$WANT"; export ALL
          rm -rf .pi
          echo "area_plan=$(cat "$RUNNER_TEMP/area-plan.json" 2>/dev/null || echo '{}')" >> "$GITHUB_OUTPUT"
          REUSED=$(python3 -c "import json; print(' '.join(json.load(open('$RUNNER_TEMP/area-plan.json')).get('reused') or []))" 2>/dev/null || true)   # ok: no plan file = nothing reused
          if [ -z "${COUNTRIES:-}" ] && [ -z "$EXPECTED" ] && [ -z "$REUSED" ]; then echo 'full=1' >> "$GITHUB_OUTPUT"; else echo 'full=0' >> "$GITHUB_OUTPUT"; fi   # Nov 4 (links-04); Nov 12: a reused country = not a full build
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cs = [c for c in dict.fromkeys(os.environ['ALL'].upper().split()) if c not in set((os.environ.get('EXPECTED') or '').split())]   # Nov 12: expected holds are not built
          try: idx = json.load(open('data/world-key/index.json', encoding='utf-8')).get('countries', {})
          except Exception: idx = {}
          w = {c: ((idx.get(c) or {}).get('parks') or 200) + ((idx.get(c) or {}).get('areas') or 0) // 20 for c in cs}   # rough size: parks + official areas read
          slow = [c for c in dict.fromkeys((os.environ.get('SLOW') or '').upper().split()) if c in cs][:2]   # Nov 4 PM fix bundle (item 5)
          rest = [c for c in cs if c not in slow]
          n = max(1, min(3, len(rest))) if rest else 0
          g = [[] for _ in range(n)]; load = [0] * n
          for c in sorted(rest, key=lambda c: -w[c]):
              k = load.index(min(load)); g[k].append(c); load[k] += w[c]
          G = [{'i': k, 'countries': ' '.join(x), 'cmin': ''} for k, x in enumerate(g) if x]
          G += [{'i': n + j, 'countries': c, 'cmin': os.environ.get('SLOW_MIN') or '300'} for j, c in enumerate(slow)]
          print('groups=' + json.dumps(G))
          print(f"::notice title=World key plan::{len(G)} job(s): " + ' | '.join(x['countries'] + (f" (own job, limit {x['cmin']} min)" if x['cmin'] else '') for x in G), file=__import__('sys').stderr)   # next round C2: the run log, not $GITHUB_OUTPUT
          PY
  build:
    needs: plan
    if: ${{ needs.plan.outputs.groups != '[]' && needs.plan.outputs.groups != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub's own limit is 360 for one job
    strategy:
      fail-fast: false
      matrix:
        g: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - name: The saved outlines for a source that fails (next round v3 C11; read only, no new permission)
        # Quality's grade of v2 (Nov 5): the source fallback in kpc_world_key.py needs a real saved copy on the runner. This only
        # DOWNLOADS this job's W-<CC>.json.gz from the boundary-cache release (saved by kpc-world-cache.yml). GEO_CACHE_MODE stays
        # off: the build still reads every source live, and uses the saved copy only for a source that fails or comes back empty.
        # Nothing is uploaded or saved here. A country with no saved copy is held when a source fails (previous key kept).
        env:
          GH_TOKEN: ${{ github.token }}
          MINE: ${{ matrix.g.countries }}
        run: |
          mkdir -p cache/world
          for c in $MINE; do
            gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p "W-$c.json.gz" -D cache/world --clobber 2>/dev/null || echo "::notice title=World key $c::no saved outlines (W-$c.json.gz) on the boundary-cache release: a failed source holds $c"
          done
          echo "::notice title=World key saved outlines::$(ls cache/world 2>/dev/null | grep -c 'json.gz$') of $(echo $MINE | wc -w) countries have a saved copy for the source fallback"
      - name: Master outlines - read master first, and the saved-copy gate (Nov 10)
        # Checks data/outlines/, prints the refresh plan (no agency read unless the repo variable KPC_MASTER_PROBE=1), then checks each saved W-<CC> copy
        # against its baseline: a SHORT copy is moved aside (cache/world/short) so it cannot stand in for a failed source; that country is held as
        # if it had no saved copy, and the Master gate verdict step goes red.
        id: kept_green_master
        continue-on-error: true
        env:
          KPC_MASTER_PROBE: ${{ vars.KPC_MASTER_PROBE || '0' }}
        run: |
          python3 .github/scripts/kpc_master_cli.py check || { kpc_rc=$?; echo "::error title=Master check::the master outlines failed their check (exit $kpc_rc)"; echo "Master check - failed (exit $kpc_rc)" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          python3 .github/scripts/kpc_master_cli.py plan --prefix W- $([ "$KPC_MASTER_PROBE" = 1 ] || echo --no-probe) > /dev/null
          # Nov 11 (KPC owner, 2026-11-11): a copy trimmed to parks is checked against its OWN manifest (--allow-trimmed); an owner-signed
          # data/outlines/world-baselines.approved.json is read too (never the .proposed.json). The exit code is kept for the part's verdict:
          # no code = the join holds every country of this job (fail closed).
          rm -f "$RUNNER_TEMP/master-short.txt" "$RUNNER_TEMP/master-gate.rc"; python3 .github/scripts/kpc_master_cli.py gate --cache cache/world --report "$RUNNER_TEMP/master-short.txt" --allow-trimmed --approved data/outlines/world-baselines.approved.json && mg=0 || mg=$?
          echo "$mg" > "$RUNNER_TEMP/master-gate.rc"; echo "rc=$mg" >> "$GITHUB_OUTPUT"
          [ "$mg" = 0 ] || [ "$mg" = 7 ] || { echo "::error title=Master gate::stopped (exit $mg)"; echo "$mg" > "$RUNNER_TEMP/master-short.txt"; }
      - name: Bring back this country's layer checkpoints (Nov 7, world fix part A; inert until kpc_world_key.py writes cache/world/parts)
        # Slow (own-job) countries only. A stopped AU read can resume from the last saved page of each layer once part B of the
        # Nov 7 world fix lands; until then the folder stays empty and the save step below is skipped. Nothing here decides a join.
        if: ${{ matrix.g.cmin != '' }}
        id: kept_green_parts_in
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: cache/world/parts
          key: world-parts-${{ matrix.g.countries }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: world-parts-${{ matrix.g.countries }}-
      - name: Build (this job's countries)
        # Nov 12 (KPC owner, 2026-11-11; run 43148551915 built AU for 13 minutes after the gate had already held it): a gate that did not
        # say green (or left no exit code) makes this shard red and nothing of a red shard is joined, so the build is not started
        if: ${{ steps.kept_green_master.outputs.rc == '0' }}
        timeout-minutes: 335   # the step stops before the job's limit, so the part below is still uploaded
        continue-on-error: true
        id: kept_green_b
        env:
          PIN_JOIN: ${{ inputs.pin_join }}
          WB_DIR: ${{ inputs.outline_test == 'yes' && '/tmp/wb-test' || '' }}
          CMIN: ${{ matrix.g.cmin || vars.KPC_WORLD_COUNTRY_MIN || '100' }}   # Nov 4 PM fix bundle (item 5): a slow country's own limit
          MINE: ${{ matrix.g.countries }}
          # Nov 7 (world fix part A): a country HELD (exit 3: a source failed or came back empty with no saved records) is tried again
          # once at the end of the job, after a wait, inside the time this step has left. Timeouts (124/137) and errors are not retried.
          RETRIES: ${{ vars.KPC_WORLD_HELD_RETRIES || '1' }}
          WAITMIN: ${{ vars.KPC_WORLD_HELD_WAIT_MIN || '10' }}
          STEP_MIN: '335'   # = this step's timeout-minutes
          KPC_OFFICIAL_PINS: .op/data/intake/official-pins-nov12.json   # Nov 12 (KPC owner, 2026-11-12): official pin fills (kpc_pin_fill.py), read only from KPC-Data
          # Nov 12 (KPC owner, 2026-11-12): the Japan A10 crosswalk (kpc_jp_crosswalk.py) is OFF until the owner signs the A10 licence terms; only the
          # repo variable KPC_JP_A10_CROSSWALK=on turns it on (JP only). Unset = off; the JP build says 'JP A10 crosswalk: OFF (licence not signed)'.
          KPC_JP_A10_CROSSWALK: ${{ vars.KPC_JP_A10_CROSSWALK || 'off' }}
        run: |
          pip install --quiet --break-system-packages pykakasi pyshp || pip install --quiet pykakasi pyshp || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          # Nov 12 (KPC owner, 2026-11-12): official pin fills (KPC-Data data/intake/official-pins-nov12.json, read only, sparse) for parks POTA has no usable
          # pin for. Not read = NO fill this run (kpc_pin_fill.py fails closed and says so); every country is still built.
          rm -rf .op; git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .op 2>/dev/null && git -C .op sparse-checkout set --no-cone data/intake/official-pins-nov12.json 2>/dev/null && git -C .op checkout -q 2>/dev/null || { kpc_rc=$?; echo "::warning title=Official pin fills::KPC-Data could not be read (exit $kpc_rc): no official pin fill this run; every country is still built"; echo "official pin fills - KPC-Data could not be read (exit $kpc_rc); no fill applied" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          # Oct 20: one country at a time, so a problem in one country never stops the others or fails the run
          # Nov 2 review (Mapping #18): a country that stops is written down, and the build stamp names it (chat 11 must not grade it as a full build)
          # Nov 3: each country also has its own time limit (CMIN minutes); one that hangs is stopped and written down the same way
          T0=$(date +%s)
          mkdir -p part; : > part/failed.txt; : > part/held.txt; echo "$MINE" > part/countries.txt
          for c in $MINE; do
            echo "::group::World key $c (limit ${CMIN} min)"
            rc=0; COUNTRIES=$c timeout --kill-after=60 "${CMIN}m" python3 .github/scripts/kpc_world_key.py || rc=$?
            echo "::endgroup::"
            if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then echo "::warning title=World key $c::stopped after ${CMIN} min (a source stopped answering?); the build stamp lists it as failed"; echo "$c" >> part/failed.txt
            elif [ "$rc" = 3 ]; then echo "::warning title=World key $c::HELD (exit 3): a source failed or came back empty with no saved records; previous key kept (tried again at the end if time allows)"; echo "$c" >> part/failed.txt; echo "$c" >> part/held.txt
            elif [ "$rc" != 0 ]; then echo "::warning title=World key $c::stopped with an error (see the traceback above); the build stamp lists it as failed"; echo "$c" >> part/failed.txt
            else echo "$c" >> part/done.txt; fi   # owner rule, 2026-11-10: the one 'built this run' signal (the old key file is in the checkout too)
          done
          # Nov 7 (world fix part A): held countries again, after a wait with jitter, never past this step's own limit
          for n in $(seq 1 "${RETRIES:-0}"); do
            [ -s part/held.txt ] || break
            left=$(( STEP_MIN - 5 - ( $(date +%s) - T0 ) / 60 - WAITMIN ))
            if [ "$left" -lt 5 ]; then echo "::notice title=World key held retry::no time left in this job; still held: $(tr '\n' ' ' < part/held.txt)"; break; fi
            sleep $(( WAITMIN * 60 + ( WAITMIN > 0 ? RANDOM % 60 : 0 ) ))
            again=$(cat part/held.txt); : > part/held.txt
            for c in $again; do
              left=$(( STEP_MIN - 5 - ( $(date +%s) - T0 ) / 60 )); lim=$(( left < CMIN ? left : CMIN ))
              if [ "$lim" -lt 5 ]; then echo "$c" >> part/held.txt; continue; fi
              echo "::group::World key $c (held retry $n, limit ${lim} min)"
              rc=0; COUNTRIES=$c timeout --kill-after=60 "${lim}m" python3 .github/scripts/kpc_world_key.py || rc=$?
              echo "::endgroup::"
              if [ "$rc" = 0 ]; then awk -v c="$c" '$0 != c' part/failed.txt > part/failed.tmp; mv part/failed.tmp part/failed.txt; echo "$c" >> part/done.txt; echo "::notice title=World key $c::built on held retry $n"
              elif [ "$rc" = 3 ]; then echo "$c" >> part/held.txt; echo "::warning title=World key $c::still HELD after retry $n"
              else echo "::warning title=World key $c::held retry $n stopped (exit $rc); the build stamp lists it as failed"; fi
            done
          done
      - name: Keep this country's layer checkpoints (Nov 7, world fix part A; only when kpc_world_key.py wrote some)
        if: ${{ always() && matrix.g.cmin != '' && hashFiles('cache/world/parts/**') != '' }}
        id: kept_green_parts_out
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: cache/world/parts
          key: world-parts-${{ matrix.g.countries }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: This job's part
        if: always()
        run: |
          mkdir -p part/world-key/review part/world-bounds
          [ -f part/countries.txt ] || echo "${{ matrix.g.countries }}" > part/countries.txt
          for c in $(cat part/countries.txt); do
            # a country not finished THIS run (job stopped, error, held) = failed, and its old checkout file is not sent to the join
            grep -qx "$c" part/done.txt 2>/dev/null || { echo "$c" >> part/failed.txt; continue; }
            [ -f data/world-key/$c.json ] && cp data/world-key/$c.json part/world-key/
            [ -f data/world-key/review/$c.md ] && cp data/world-key/review/$c.md part/world-key/review/
            [ -f data/world-key/tracts/$c.json ] && mkdir -p part/world-key/tracts && cp data/world-key/tracts/$c.json part/world-key/tracts/   # Nov 6: tract side file
            [ -d data/world-bounds/$c ] && cp -r data/world-bounds/$c part/world-bounds/
          done
          for f in index.json layers.json eea-designations.json jp-wikidata.json outline-test.json; do [ -f data/world-key/$f ] && cp data/world-key/$f part/world-key/; done
          git rev-parse HEAD > part/built-sha.txt   # Nov 12 (KPC owner, 2026-11-12): the commit this job built from (an area hash is stamped only when it is the plan's)
          # Nov 11 (KPC owner, 2026-11-11): the master gate verdict goes INTO the part, last, with the sha256 of every file in it. The join
          # holds (does not save) every country of a part with no verdict, a gate that did not say green, or files that are not the listed ones.
          python3 .github/scripts/kpc_world_key_join.py verdict --part part --countries "$MINE" --rc-file "$RUNNER_TEMP/master-gate.rc" --short-file "$RUNNER_TEMP/master-short.txt" || { kpc_rc=$?; echo "::error title=Master gate verdict::not written (exit $kpc_rc): the join holds this job's countries"; echo "Master gate verdict - not written (exit $kpc_rc): the join holds this job's countries" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          true
        env:
          MINE: ${{ matrix.g.countries }}
      # Nov 11 (KPC owner, 2026-11-11): run 43082247085 lost job 2's part: 'Failed to CreateArtifact: Failed to make request after 5 attempts:
      # Unexpected token '<', "<!DOCTYPE "... is not valid JSON' (the action's own 5 attempts took 10 minutes); job 1 hit the same error twice
      # while finalizing and got through. Up to 3 tries of the whole step, 2 then 5 minutes apart, same artifact name (overwrite: an artifact
      # an earlier try made but could not finalize is replaced). All 3 failed = this job is red and the join gets no part from it (its
      # countries are named failed and keep their previous key).
      - name: Upload this job's part (try 1 of 3)
        id: retry_up1
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: world-key-part-${{ matrix.g.i }}
          path: part/
          retention-days: 3
      - name: Wait before upload try 2
        if: ${{ always() && steps.retry_up1.outcome == 'failure' }}
        run: sleep 120
      - name: Upload this job's part (try 2 of 3)
        id: retry_up2
        if: ${{ always() && steps.retry_up1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: world-key-part-${{ matrix.g.i }}
          path: part/
          retention-days: 3
          overwrite: true
      - name: Wait before upload try 3
        if: ${{ always() && steps.retry_up1.outcome == 'failure' && steps.retry_up2.outcome == 'failure' }}
        run: sleep 300
      - name: Upload this job's part (try 3 of 3)
        id: retry_up3
        if: ${{ always() && steps.retry_up1.outcome == 'failure' && steps.retry_up2.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: world-key-part-${{ matrix.g.i }}
          path: part/
          retention-days: 3
          overwrite: true
      - name: Upload this job's part - every try failed (fail closed, go red)
        if: ${{ always() && steps.retry_up1.outcome == 'failure' && steps.retry_up2.outcome == 'failure' && steps.retry_up3.outcome == 'failure' }}
        run: |
          echo "::error title=World key part::the part of job ${{ matrix.g.i }} was not uploaded after 3 tries: the join gets nothing from this job, its countries are named failed and keep their previous key"
          exit 1
      - name: Master gate verdict (Nov 10, fail closed) - a short saved copy was moved aside; that country was held as if it had none; go red
        if: ${{ always() }}
        run: |
          # Nov 11 (KPC owner, 2026-11-11): no exit code from the gate step (it did not run, or stopped early) is red too
          rc=$(cat "$RUNNER_TEMP/master-gate.rc" 2>/dev/null || echo none)
          if [ -s "$RUNNER_TEMP/master-short.txt" ] || [ "$rc" != 0 ]; then
            echo "::error title=Master gate::short saved copy, not used as a fallback and its country NOT saved by the join (the old key file is kept; gate exit $rc): $(tr '\n' ' ' < "$RUNNER_TEMP/master-short.txt" 2>/dev/null)"
            exit 1
          fi
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
  join:
    needs: [plan, build]
    # Nov 12 (KPC owner, 2026-11-11; run 43148551915 was CANCELLED, AU's shard red, and this job still saved a6c493c): never on a
    # cancelled run. Nov 12 (KPC owner, 2026-11-12; run 43200398601: five short countries blocked every save, the French layers too):
    # each country stands alone, so a red shard no longer stops the join: its countries keep their previous join from main, the green
    # countries are saved, and the verdict job after this one makes the run red.
    if: ${{ !cancelled() && needs.build.result != 'skipped' && needs.plan.outputs.groups != '[]' && needs.plan.outputs.groups != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      built: ${{ steps.tonight.outputs.built }}   # Nov 11: the countries saved this run (0 = nothing saved: no post-key check)
      red: ${{ steps.tonight.outputs.red }}   # Nov 12 (KPC owner, 2026-11-12): the countries kept from main (not saved) this run: the run ends red
      bounds: ${{ steps.kept_green_1.outcome }}   # Nov 12 (KPC owner, 2026-11-12): 'failure' = the world-bounds branch was not pushed: the run ends red
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # the newest main (other bots saved while the build ran)
      # Nov 11 (KPC owner, 2026-11-11): the download is tried up to 3 times too, each into an empty folder (no half download is mixed in);
      # a part that still comes short fails its verdict's file list and its countries are held.
      - name: Download the parts (try 1 of 3)
        id: retry_dl1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: world-key-part-*
          path: parts
      - name: Wait before download try 2
        if: ${{ steps.retry_dl1.outcome == 'failure' }}
        run: rm -rf parts; sleep 120
      - name: Download the parts (try 2 of 3)
        id: retry_dl2
        if: ${{ steps.retry_dl1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: world-key-part-*
          path: parts
      - name: Wait before download try 3
        if: ${{ steps.retry_dl1.outcome == 'failure' && steps.retry_dl2.outcome == 'failure' }}
        run: rm -rf parts; sleep 300
      - name: Download the parts (try 3 of 3)
        id: retry_dl3
        if: ${{ steps.retry_dl1.outcome == 'failure' && steps.retry_dl2.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          pattern: world-key-part-*
          path: parts
      - name: Put the parts together (Nov 3)
        id: tonight
        env:
          PLAN_GROUPS: ${{ needs.plan.outputs.groups }}
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: |
          # Nov 12 (KPC owner, 2026-11-12): --planned-groups = a planned country with no part, or not built in its part, is NOT joined: it
          # keeps its previous files and index row from main byte for byte and is named failed; every other country is joined. Exit 1 (NOTHING
          # written) only on a conflict or a country the plan did not give a part. --record = per country: built?, verdict, saved or kept, why.
          # Nov 11 (KPC owner, 2026-11-11): per country from its owning part, fail closed (kpc_world_key_join.py): one country in two parts,
          # a part carrying a country it does not own, or two parts changing one key of a shared file differently = exit 1, nothing written.
          # Nov 11 (KPC owner, 2026-11-11, run 43082247085 saved on a red gate): --gate = only the countries of a part whose verdict says green, or
          # that are not among its moved-aside copies, are joined; no verdict / an unknown gate / changed files = that part's countries held.
          python3 .github/scripts/kpc_world_key_join.py parts/world-key-part-* --gate --held-out /tmp/world-held.txt --out data/world-key --bounds data/world-bounds --failed-out /tmp/world-failed.txt --planned-groups "$PLAN_GROUPS" --expected "$EXPECTED" --record /tmp/world-join.json
          # Owner rule, 2026-11-10: a planned country with no part (or not in its part's done.txt) was not built: named failed
          python3 .github/scripts/kpc_key_freeze.py missing --planned-groups "$PLAN_GROUPS" --built-file parts/world-key-part-*/done.txt >> /tmp/world-failed.txt
          sort -u -o /tmp/world-failed.txt /tmp/world-failed.txt
      - name: May we save the green set? (Nov 12, KPC owner, 2026-11-12; fail closed) - every saved country built green, every other country main's bytes
        # BEFORE every step that writes or saves; each of them needs this step to have passed. A held / short / failed country is not a
        # reason to stop here (it is kept from main and the verdict job makes the run red); a saved country that was not built green, or a
        # kept country whose key / review page / tracts / index row is not main's, is: then NOTHING is saved.
        id: join_verdict
        if: ${{ !cancelled() && steps.tonight.outcome == 'success' }}
        run: python3 .github/scripts/kpc_world_key_join.py check-saved --record /tmp/world-join.json --key-dir data/world-key
      - name: Tonight's list (the plan job's, again)
        env:
          SCHED: ${{ (github.event.schedule || inputs.as_schedule) }}
        run: |
          if [ "$SCHED" = "7 10 * * *" ]; then
            L=$(cat parts/*/countries.txt 2>/dev/null | tr -s ' \n' ' ' | sed 's/^ *//;s/ *$//'); [ -n "$L" ] && echo "NIGHT_LIST=$L" >> "$GITHUB_ENV"   # the countries the jobs were given
          fi
          true
      - name: Join check (Nov 6 improvements 4, v2) - HOLD joins whose nearest outline part is over 15 km from the pin (not person-approved, not a trail) before the stamp; mark acres outside 0.5x-2x 'suspect'
        if: ${{ !cancelled() && steps.join_verdict.outcome == 'success' && steps.tonight.outputs.built != '0' && inputs.outline_test != 'yes' }}
        id: kept_green_joincheck
        continue-on-error: true
        env:
          KEY: world
          ANSWER_SHEET: .as/data/answer-sheet
        run: |
          # v2 (Quality L04 NO, 5:28 PM CST Nov 5): held joins -> data/world-key/review/held-joins.csv + held-joins-ledger.csv (pile-enter
          # proposals); the answer sheet (KPC-Data, read only, sparse) exempts joins a person signed off. KPC_JOIN_HOLD=mark = v1.
          # v2.1 (Quality): READ-ONLY, PUBLIC, NO TOKEN: an anonymous https clone (no credential helper, no auth header, no prompt),
          # never pushed, removed after the check; a failed read is LOUD (answer-sheet exemptions empty = more joins held, fail-safe)
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .as 2>/dev/null && git -C .as sparse-checkout set --no-cone data/answer-sheet 2>/dev/null && git -C .as checkout -q 2>/dev/null || { kpc_rc=$?; echo "::error title=Join check::KPC-Data answer sheet (public, read-only) not read (exit $kpc_rc): its exemptions are empty this build (more joins held)"; echo "Join check - KPC-Data answer sheet not read (exit $kpc_rc): its exemptions are empty this build (more joins held)" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          python3 .github/scripts/kpc_join_check.py || { kpc_rc=$?; echo "::warning title=Join check::stopped (exit $kpc_rc); the key build is not affected"; }
          rm -rf .as
      - name: Review files - every country not rebuilt this run keeps its rows from main (Nov 12, KPC owner, 2026-11-12)
        # the join check writes held-joins.* / join-check.* whole from this run's changed key files only (a6c493c wiped every other
        # country's rows that way); every country whose key file this run did not change (kept, held, failed, expected, or rebuilt to
        # the same bytes) keeps its rows byte for byte; a file that cannot be split per country is not written (main's copy kept)
        id: keep_rows
        if: ${{ !cancelled() && steps.join_verdict.outcome == 'success' && steps.tonight.outputs.built != '0' && inputs.outline_test != 'yes' }}
        env:
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: python3 .github/scripts/kpc_area_join.py keep-rows --unchanged --areas "$EXPECTED" --key-dir data/world-key --review data/world-key/review
      - name: BUILD STAMP (Brandon Nov 2) - this build's id, chat 11 grades only this id
        # Nov 12 (KPC owner, 2026-11-12): honest per country. Only the countries SAVED this run (KPC_PLANNED_AREAS) get the current code hash
        # in their index row; a kept country keeps main's row; the key-wide rules hash moves only on a full build where every planned
        # country saved (or once every row carries it). A country failed on main and not asked this run stays failed (KPC_ASKED_AREAS).
        # A stamp error stops the save (an unstamped key is not saved).
        id: stamp
        if: ${{ !cancelled() && steps.join_verdict.outcome == 'success' && steps.tonight.outputs.built != '0' && inputs.outline_test != 'yes' }}
        env:
          KPC_BUILD_FAILED_FILE: /tmp/world-failed.txt
          KPC_HELD_EXPECTED: ${{ needs.plan.outputs.expected }}   # Nov 12: kept from main, not rebuilt: complete false, held_expected
          KPC_FULL_BUILD: ${{ (needs.plan.outputs.full == '1' && needs.build.result == 'success') && '1' || '0' }}   # Nov 4 (links-04): a failed country keeps the old rules hash (stamp)
          PLAN_GROUPS: ${{ needs.plan.outputs.groups }}
          AREA_PLAN: ${{ needs.plan.outputs.area_plan }}
          AREA_MODE: ${{ vars.KPC_AREA_HASH || 'shadow' }}   # Nov 12 (Quality #163): shadow (default) = stamp-rows writes nothing to the key
        run: |
          export KPC_PLANNED_AREAS="$(python3 -c "import json; print(' '.join(json.load(open('/tmp/world-join.json')).get('joined') or []))")"
          export KPC_ASKED_AREAS="$(python3 .github/scripts/kpc_key_freeze.py missing --planned-groups "$PLAN_GROUPS" | tr '\n' ' ')"
          python3 .github/scripts/kpc_key_freeze.py stamp world-key || { kpc_rc=$?; echo "::error title=kpc_key_freeze.py::stopped with an error (exit $kpc_rc): nothing is saved"; echo "kpc_key_freeze.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit 1; }
          # Nov 12 (part B): each SAVED country's row records its area hash, parts, out_sha and built_sha (only when the build checked out the
          # plan's commit); areas_rebuilt / areas_reused at the top for Quality. Kept rows are not touched.
          printf '%s' "$AREA_PLAN" > "$RUNNER_TEMP/area-plan.json"
          BS=$(cat parts/world-key-part-*/built-sha.txt 2>/dev/null | sort -u); [ "$(printf '%s\n' "$BS" | grep -c .)" = 1 ] || BS=mixed
          # Nov 12 (KPC owner, 2026-11-12; Quality #163): SHADOW WRITES NOTHING: unless KPC_AREA_HASH is add / reuse, the stamp rows go to
          # $RUNNER_TEMP/area-stamp-shadow/ (uploaded as an artifact) and the job summary; index.json is left byte for byte
          python3 .github/scripts/kpc_area_hash.py stamp-rows world --mode "$AREA_MODE" --shadow-out "$RUNNER_TEMP/area-stamp-shadow/world.json" --index data/world-key/index.json --saved "$KPC_PLANNED_AREAS" --plan "$RUNNER_TEMP/area-plan.json" --built-sha "$BS" \
            || { kpc_rc=$?; echo "::warning title=Area hashes::the saved rows were not given their area hash: they are planned again next run (exit $kpc_rc)"; echo "Area hashes - the saved rows were not given their area hash: they are planned again next run (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Kept from main, checked again just before the save (Nov 12, KPC owner, 2026-11-12; fail closed)
        id: kept_check
        if: ${{ !cancelled() && steps.join_verdict.outcome == 'success' && steps.tonight.outputs.built != '0' }}
        run: python3 .github/scripts/kpc_area_join.py assert-kept --record /tmp/world-join.json --key-dir data/world-key
      - name: Whole-key sanity check (Nov 12, part B; read only, reported) - rows vs files, out_sha, no key-wide claim beyond the rows
        id: kept_green_sanity
        continue-on-error: true
        if: ${{ !cancelled() && steps.join_verdict.outcome == 'success' && steps.tonight.outputs.built != '0' }}
        run: python3 .github/scripts/kpc_area_hash.py sanity world
      - name: Area hashes, shadow record (Nov 12, KPC owner, 2026-11-12) - what the stamp WOULD record, as an artifact (never committed)
        id: kept_green_area_shadow   # Quality #163 must-fix: an upload that fails is reported by 'Report hidden failures', never blocks the key
        continue-on-error: true
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: area-stamp-shadow-world
          path: ${{ runner.temp }}/area-stamp-shadow/
          if-no-files-found: ignore
          retention-days: 30
      - name: Save
        # Nov 11 (KPC owner, 2026-11-11): only after the join itself finished (a join that stopped part way leaves no 'built' and saves nothing)
        # Nov 12 (KPC owner, 2026-11-11): never on a cancel (a cancel mid-join skips this step: nothing half-written is committed)
        # Nov 12 (KPC owner, 2026-11-12): the GREEN countries are saved even when another shard is red; only after "May we save the green
        # set?" passed, the review rows were merged per country, the stamp did not fail and the kept countries are still main's bytes
        id: save
        if: ${{ !cancelled() && steps.join_verdict.outcome == 'success' && steps.keep_rows.outcome != 'failure' && steps.stamp.outcome != 'failure' && steps.kept_check.outcome == 'success' && steps.tonight.outcome == 'success' && steps.tonight.outputs.built != '0' }}
        run: |
          # Nov 3: only the countries built tonight come off the list (a failed one, or one BOT W added during the build, stays for next night)
          if [ -n "$NIGHT_LIST" ] && [ -f data/world-key/answers-countries.txt ]; then
            python3 -c "import sys;l=open('data/world-key/answers-countries.txt').read().split();b=set(sys.argv[1].split())-set(open('/tmp/world-failed.txt').read().split());open('data/world-key/answers-countries.txt','w').write(' '.join(c for c in l if c not in b)+('\n' if [c for c in l if c not in b] else ''))" "$NIGHT_LIST"; git add data/world-key/answers-countries.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/world-key
          git add data/status 2>/dev/null || true   # ok: an optional file or tidy step (Oct 25 storage plan: when each file last changed)
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main; the chat-11 inbox and hand lists are merged, not copied). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" KPC_SAVE_SKIP="data/us-key/overrides.json data/us-key/overrides-parks-*.json data/us-key/answers-applied.json data/us-key/answers-states.txt data/ca-key/overrides.json data/ca-key/answers-applied.json data/ca-key/answers-provinces.txt data/world-key/overrides.json data/world-key/answers-applied.json data/world-key/extra-layers.json" KPC_SAVE_WORDS="data/world-key/answers-countries.txt" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'World answer key' - -- data/world-key data/status
      - name: Saved outlines to the branch world-bounds (one commit, replaced each time; Brandon Oct 31 7:24 PM)
        # per country: the push REPLACES the whole branch, so the new tree is the branch as it is now (read in full) with only the countries
        # joined this run (data/world-bounds/<CC>) put on top; every other country is carried over from that read, byte for byte.
        # Nov 12 (KPC owner, 2026-11-12; Quality #162 must-fix, fail closed): if the branch cannot be read in full (fetch, archive or unpack
        # failed, the branch is missing or holds no outlines, or what was unpacked is not every file the branch holds) NOTHING is pushed
        # (a push would leave only this run's countries and wipe every other country's saved outlines): ::error, and the verdict job
        # ends the run red. The key saved to main above is not affected.
        if: ${{ !cancelled() && steps.save.outcome == 'success' && steps.join_verdict.outcome == 'success' && steps.tonight.outcome == 'success' && steps.tonight.outputs.built != '0' && inputs.outline_test != 'yes' }}
        id: kept_green_1
        continue-on-error: true
        run: |
          set -o pipefail
          [ -d data/world-bounds ] || exit 0
          B=/tmp/wb; rm -rf $B; mkdir -p $B
          kpc_skip() { echo "::error title=World outlines::branch world-bounds NOT pushed: $1. A push now would keep only this run's countries and wipe every other country's saved outlines, so the branch is left as it is (rerun the world key once the branch can be read)"; echo "World outlines - branch world-bounds not pushed: $1" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit 1; }
          git fetch -q origin world-bounds || kpc_skip "the branch could not be read (git fetch exit $?)"
          git archive FETCH_HEAD | tar -x -C $B || kpc_skip "the branch could not be unpacked (git archive / tar exit $?)"
          # Quality #162 should-fix: the two file lists are compared NUL-separated (a name with a newline or a space cannot fool the check)
          W="$RUNNER_TEMP/wb-want.z"; H="$RUNNER_TEMP/wb-have.z"
          git ls-tree -r -z --name-only FETCH_HEAD -- data/world-bounds | LC_ALL=C sort -z > "$W" || kpc_skip "the branch's file list could not be read (exit $?)"
          [ -s "$W" ] || kpc_skip "the branch holds no saved outlines (data/world-bounds is missing or empty)"
          if [ -d $B/data/world-bounds ]; then (cd $B && find data/world-bounds ! -type d -print0 | LC_ALL=C sort -z) > "$H" || kpc_skip "the unpacked file list could not be read (exit $?)"; else : > "$H"; fi
          cmp -s "$W" "$H" || kpc_skip "what was unpacked ($(tr -cd '\0' < "$H" | wc -c) files) is not every file the branch holds ($(tr -cd '\0' < "$W" | wc -c))"
          for d in data/world-bounds/*/; do c=$(basename $d); rm -rf $B/data/world-bounds/$c; cp -r $d $B/data/world-bounds/$c; done   # only this run's countries
          cd $B && git init -q && git checkout -q -b world-bounds && git add -A && git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "World saved outlines ($(date -u +%F)): one commit, replaced every rebuild" \
            || kpc_skip "the new branch commit could not be made (exit $?)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" world-bounds || { kpc_rc=$?; echo "::error title=World outlines::the push of branch world-bounds did not land (exit $kpc_rc); the branch is left as it was"; echo "World outlines - push did not land (exit $kpc_rc)" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit 1; }
          echo "::notice title=World outlines::branch world-bounds replaced ($(du -sh data/world-bounds | cut -f1)): this run's countries new, every other country carried over"
      - name: Run summary (Nov 12, KPC owner, 2026-11-12) - one table, every country - area | built? | verdict | saved or kept from main | hash stamped | why
        # read-only: writes the step summary only
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/kpc_area_join.py summary --record /tmp/world-join.json --index data/world-key/index.json --title 'World key join'
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
  verdict:
    # Nov 12 (KPC owner, 2026-11-12): "is the run red?" is asked AFTER the green countries were saved. Red when a country was kept from
    # main (short, failed, held, not built), when a build shard was red, or when the join did not finish. Writes nothing.
    needs: [plan, build, join]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run verdict (red when any country was not saved)
        env:
          RED: ${{ needs.join.outputs.red }}
          BUILD: ${{ needs.build.result }}
          JOIN: ${{ needs.join.result }}
          BOUNDS: ${{ needs.join.outputs.bounds }}
          GROUPS: ${{ needs.plan.outputs.groups }}
        run: |
          if [ "$GROUPS" = '[]' ] || [ -z "$GROUPS" ]; then echo "nothing was planned: green"; exit 0; fi
          bad=0
          [ -z "$RED" ] || { echo "::error title=World key run::RED: not saved this run, previous join kept from main: $RED"; bad=1; }
          [ "$BUILD" = success ] || { echo "::error title=World key run::a build shard was $BUILD (its countries are listed above)"; bad=1; }
          [ "$JOIN" = success ] || { echo "::error title=World key run::the join was $JOIN: see its log (a refused join saves nothing)"; bad=1; }
          [ "$BOUNDS" != failure ] || { echo "::error title=World key run::the saved outlines were NOT pushed to the branch world-bounds (it could not be read in full, or the push failed): see the join log"; bad=1; }
          [ "$bad" = 0 ] && echo "every planned country was saved: green"
          exit $bad
  postcheck:
    # owner rule, 2026-11-10: dispatch is the ONLY path to the post-key check. Not for a cancelled or skipped build.
    needs: [plan, join]
    # Nov 11 (KPC owner, 2026-11-11): and only when the join saved a country (a1b6d54 checked a red run's save); nothing saved = no check
    # Nov 12 (KPC owner, 2026-11-11): and only when the join job was green (a join red on its gate verdict saved nothing)
    if: ${{ !cancelled() && needs.join.result == 'success' && needs.join.result != 'cancelled' && needs.join.result != 'skipped' && needs.join.outputs.built != '0' && needs.join.outputs.built != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the post-key check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run kpc-key-postcheck.yml -R "$GITHUB_REPOSITORY" --ref main -f key=world && echo "::notice title=World key::post-key check started" || { kpc_rc=$?; echo "::warning title=World key::could not start the post-key check (exit $kpc_rc): start 'KPC key check (after a key build)' by hand with key=world"; echo "World key - could not start the post-key check (exit $kpc_rc): start 'KPC key check (after a key build)' by hand with key=world" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
