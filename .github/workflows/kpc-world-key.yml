name: KPC world answer key
# Busy POTA programs outside North America (AU DE GB JP): parks joined to OFFICIAL protected-area land only when name + kind match.
on:
  schedule:
    - cron: '17 11 3 * *'   # monthly
  workflow_dispatch:
    inputs:
      countries:
        description: 'Countries, e.g. AU DE (blank = AU DE GB JP)'
        default: ''
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Build
        env:
          COUNTRIES: ${{ inputs.countries }}
        run: python3 .github/scripts/kpc_world_key.py
      - name: Save
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/world-key
          if ! git diff --cached --quiet; then git commit -m 'World answer key'; for i in 1 2 3 4; do git pull --rebase --autostash && git push && break; sleep $((i*7)); done; fi
