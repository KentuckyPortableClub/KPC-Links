name: zz probe ArcGIS experience (temporary)
on: workflow_dispatch
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          B='https://services5.arcgis.com/RMHPuOW5MJ6iyTV6/arcgis/rest/services/public_hunting_areas_service/FeatureServer'
          def q(l,ff):
              u=f"{B}/{l}/query?"+urllib.parse.urlencode({'where':'1=1','outFields':ff,'returnGeometry':'true','outSR':4326,'resultRecordCount':2000,'f':'json'})
              return json.loads(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'KPC'}),timeout=90).read())['features']
          lots=[[round(f['geometry']['y'],5),round(f['geometry']['x'],5),f['attributes'].get('Type'),(f['attributes'].get('Name') or '').strip(),f['attributes'].get('WMANAME')] for f in q(1,'Name,Type,WMANAME,PUBDISPLAY') if f.get('geometry') and f['attributes'].get('PUBDISPLAY')!='No']
          ent=[[round(f['geometry']['y'],5),round(f['geometry']['x'],5),'Entrance','',f['attributes'].get('AREANAME')] for f in q(0,'AREANAME') if f.get('geometry')]
          json.dump({'source':'KDFWR public_hunting_areas_service (WMA Explorer), layers 0 entrances + 1 Parking Lots and Kiosk','rows':ent+lots},open('data/ky-wma-parking.json','w'))
          print('::notice title=WMA parking::%d lots/kiosks, %d entrances'%(len(lots),len(ent)))
          PY
          git config user.name kpc-bot; git config user.email kpc-bot@users.noreply.github.com
          git add data/ky-wma-parking.json; git commit -qm "KDFWR WMA parking lots + entrances (official)"; git pull -q --rebase; git push -q
