name: zz pull KY roads near parks (temporary)
on: workflow_dispatch
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          BB=json.loads('{"US-1264": [-84.05994000000001, 37.0668, -84.02427999999999, 37.10953], "US-3787": [-84.35797000000001, 37.82784, -84.34684999999999, 37.838], "US-3789": [-84.55791, 37.458850000000005, -84.53792, 37.476389999999995], "US-3790": [-88.07758000000001, 36.46126, -87.8235, 36.515899999999995], "US-3802": [-84.86819, 38.124810000000004, -84.84527, 38.151509999999995], "US-4526": [-82.75358, 37.078210000000006, -82.52678999999999, 37.217819999999996], "US-10098": [-87.58222, 37.86775, -87.40737, 37.912389999999995], "US-10107": [-84.61393000000001, 36.59456, -84.52122, 36.67849], "US-12971": [-83.13877000000001, 38.37147, -83.12204, 38.38894], "US-12972": [-83.11850000000001, 38.35138, -83.10413, 38.36288]}')
          def g(u):
              try: return json.loads(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'KPC'}),timeout=120).read())
              except Exception as e: return {'err':str(e)[:150]}
          def n(t,m): print('::notice title=%s::%s'%(t,str(m)[:3000]))
          S='https://kygisserver.ky.gov/arcgis/rest/services/WGS84WM_Services/Ky_911_Road_Centerlines_WGS84WM/MapServer'
          root=g(S+'?f=json'); L=[l['id'] for l in root.get('layers',[])]
          lid=None
          for i in L:
              x=g(f'{S}/{i}?f=json')
              if x.get('geometryType')=='esriGeometryPolyline': lid=i; flds=[f['name'] for f in x.get('fields',[])]; break
          n('layer',f'{lid} {flds}')
          out={}
          for r,b in BB.items():
              q={'geometry':','.join(map(str,b)),'geometryType':'esriGeometryEnvelope','inSR':4326,'spatialRel':'esriSpatialRelIntersects','outFields':'*','returnGeometry':'true','outSR':4326,'f':'json','resultRecordCount':2000}
              j=g(f'{S}/{lid}/query?'+urllib.parse.urlencode(q))
              fs=j.get('features',[])
              out[r]=[[{k:v for k,v in f['attributes'].items() if v not in (None,'',' ') and not k.lower().startswith(('shape','globalid','objectid'))},f['geometry'].get('paths')] for f in fs if f.get('geometry')]
              n(r,f"{len(fs)} roads {j.get('err','')} {json.dumps(out[r][0][0])[:400] if out[r] else ''}")
          import os; os.makedirs('.claude/build/ap',exist_ok=True)
          json.dump(out,open('.claude/build/ap/roads.json','w'),separators=(',',':'))
          PY
          git config user.name kpc-bot; git config user.email kpc-bot@users.noreply.github.com
          git add .claude/build/ap/roads.json; git commit -qm "KY 911 road centerlines near parks (for access pins)"; git pull -q --rebase; git push -q
