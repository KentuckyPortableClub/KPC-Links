name: zz probe padus tiles
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install pillow >/dev/null
          mkdir out && cd out
          python3 - <<'P'
          import math,urllib.request
          from PIL import Image
          from collections import Counter
          EXT=20037508.342789244
          la,lo=37.2656,-85.1488
          for z in (12,13,14,15,16):
            n=2**z; x=int((lo+180)/360*n); r=math.radians(la); y=int((1-math.log(math.tan(r)+1/math.cos(r))/math.pi)/2*n)
            w=2*EXT/n; x0=-EXT+x*w; y1=EXT-y*w
            u=f"https://edits.nationalmap.gov/arcgis/rest/services/PAD-US/PAD_US/MapServer/export?bbox={x0},{y1-w},{x0+w},{y1}&bboxSR=3857&imageSR=3857&size=512,512&dpi=192&format=png32&transparent=true&f=image"
            d=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=60).read()
            open(f'z{z}.png','wb').write(d)
            im=Image.open(f'z{z}.png').convert('RGBA'); c=Counter(p for p in im.getdata() if p[3]>=60)
            print(f"::notice title=z{z}::"+' '.join(f"{k}:{v}" for k,v in c.most_common(8)))
          P
          git init -q; git config user.email a@b; git config user.name bot
          git add . && git commit -qm t && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:zz-padus
