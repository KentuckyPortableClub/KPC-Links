name: zz check water edge (temporary)
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          def g(u):
              try: return json.loads(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'KPC'}),timeout=90).read())
              except Exception as e: return {'err':str(e)[:150]}
          S='https://hydro.nationalmap.gov/arcgis/rest/services/nhd/MapServer'
          q={'geometry':'-89.068913,37.169117','geometryType':'esriGeometryPoint','inSR':4326,'distance':400,'units':'esriSRUnit_Meter','spatialRel':'esriSpatialRelIntersects','outFields':'ftype','returnGeometry':'true','outSR':4326,'f':'json'}
          j=g(f'{S}/9/query?'+urllib.parse.urlencode(q))
          import math
          P=(-89.068913,37.169117);best=(1e9,None)
          kx=111320*math.cos(math.radians(P[1]));ky=110570
          for f in j.get('features',[]):
              for r in f['geometry']['rings']:
                  for a,b in zip(r,r[1:]):
                      ax,ay=(a[0]-P[0])*kx,(a[1]-P[1])*ky;bx,by=(b[0]-P[0])*kx,(b[1]-P[1])*ky;dx,dy=bx-ax,by-ay;L=dx*dx+dy*dy
                      t=max(0,min(1,-(ax*dx+ay*dy)/L)) if L else 0
                      d=math.hypot(ax+t*dx,ay+t*dy)
                      if d<best[0]: best=(d,(a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])))
          print('::notice title=edge::%.0f m at %s'%(best[0],best[1]))
          PY
