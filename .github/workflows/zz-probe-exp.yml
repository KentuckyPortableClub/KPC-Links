name: zz pull ky park structures
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - <<'P'
          import urllib.request,urllib.parse,json
          H={'User-Agent':'Mozilla/5.0'}
          B='https://kygisserver.ky.gov/arcgis/rest/services/WGS84WM_Services/Ky_State_Parks_Features_WGS84WM/MapServer'
          out={}
          for l,nm in ((7,'structures'),(6,'campgrounds')):
            rows=[];off=0
            while True:
              u=f"{B}/{l}/query?"+urllib.parse.urlencode({'where':'1=1','outFields':'*','returnGeometry':'true','outSR':4326,'f':'json','resultOffset':off,'resultRecordCount':1000})
              f=json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=90).read()).get('features',[])
              for x in f:
                g=x.get('geometry') or {}; a=x['attributes']
                if 'y' in g: rows.append([round(g['y'],6),round(g['x'],6),{k:v for k,v in a.items() if k in ('PARK_NAME','BL_NAME','USE_DESCR','facilityNa','link')}])
              if len(f)<1000: break
              off+=1000
            out[nm]=rows
            print(f"::notice title={nm}::{len(rows)}")
          json.dump({'source':B,'layers':out},open('data/ky-park-structures.json','w'),separators=(',',':'))
          P
          git config user.email bot@kpc; git config user.name kpc-bot
          git add data/ky-park-structures.json && git commit -qm "KY State Parks public structures + campgrounds (state GIS)" && git pull -q --rebase && git push -q
