name: KPC tidy (delete after use)
# One-off: remove a Facebook post the park watcher made by mistake. Only deletes a post from the last hour
# whose words match the watcher's own wording. Prints what it found. Never fails.
on:
  workflow_dispatch:
    inputs:
      really:
        description: 'delete (otherwise just list)'
        type: boolean
        default: false
permissions: {}
jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Find and remove
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          REALLY: ${{ inputs.really && '1' || '' }}
        run: |
          python3 - <<'PY' || true
          import datetime, json, os, urllib.parse, urllib.request, urllib.error
          PID=(os.environ.get('FB_PAGE_ID') or '').strip(); TOK=(os.environ.get('FB_PAGE_TOKEN') or '').strip()
          G='https://graph.facebook.com/v21.0/'
          def call(path, method='GET', **q):
              q['access_token']=TOK
              url=G+path+('?'+urllib.parse.urlencode(q) if method=='GET' else '')
              data=None if method=='GET' else urllib.parse.urlencode(q).encode()
              req=urllib.request.Request(url, data=data, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return json.loads(r.read().decode())
              except urllib.error.HTTPError as e: return {'error': e.read().decode()[:200]}
              except Exception as e: return {'error': str(e)[:200]}
          j=call(f'{PID}/posts', fields='id,created_time,message', limit='10')
          posts=j.get('data') or []
          print(f"::notice title=Tidy::{len(posts)} recent post(s) found" + ('' if posts else ' - ' + str(j.get('error'))[:200]))
          now=datetime.datetime.now(datetime.timezone.utc)
          for p in posts:
              msg=(p.get('message') or '')[:70].replace('\n',' / ')
              try: age=(now-datetime.datetime.fromisoformat(p['created_time'].replace('+0000','+00:00'))).total_seconds()/60
              except Exception: age=9999
              mine='Kentucky park alert' in (p.get('message') or '')
              print(f"::notice title=Tidy::{int(age)} min ago · mine={mine} · {msg}")
              if mine and age < 90 and os.environ.get('REALLY'):
                  r=call(p['id'], method='DELETE')
                  print(f"::notice title=Tidy::deleted {p['id']}: {json.dumps(r)[:120]}")
          PY
