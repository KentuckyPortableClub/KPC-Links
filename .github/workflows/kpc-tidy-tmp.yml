name: KPC tidy (delete after use)
# One-off: removes a message this club's webhook posted in the wrong room. Deleted straight after.
on:
  workflow_dispatch:
    inputs:
      message_id:
        description: 'The message id from its Discord link (the last number)'
        required: true
permissions: {}
jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the message
        continue-on-error: true
        env:
          HOOK: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          MID: ${{ inputs.message_id }}
        run: |
          H="${HOOK%/}"
          echo "::notice title=Tidy::webhook set: $([ -n "$H" ] && echo yes || echo NO) · length ${#H} · starts https: $(case "$H" in https://discord*) echo yes;; *) echo no;; esac)"
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X DELETE "${H}/messages/${MID}" 2>/tmp/err) || true
          echo "::notice title=Tidy::HTTP ${code:-none} · body $(head -c 160 /tmp/out) · error $(head -c 160 /tmp/err | sed 's#https://[^ ]*#<url>#g')"
