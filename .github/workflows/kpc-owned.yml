name: KPC owned land (agency-land parks)
# Oct 27 2026 (Fable's boundary review #1, HQ GO 11:00 AM): the land an agency OWNS inside a forest / refuge / project
# line, for Am I in the Park and the map tools (rule B1 + B-G1). Kentucky first: ky-dbnf-owned.geojson. By hand + monthly.
# Never fails (a failed run emails Brandon); a map that does not answer keeps the last file.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 3 * *'
permissions:
  contents: write
concurrency:
  group: kpc-owned
  cancel-in-progress: false
jobs:
  owned:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Read the ownership maps
        continue-on-error: true
        timeout-minutes: 50
        run: python3 .github/scripts/kpc_owned.py ky || true
      - name: Save
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ky-dbnf-owned.geojson 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Owned land: Daniel Boone NF Forest Service land (kpc_owned.py)' || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done || true
