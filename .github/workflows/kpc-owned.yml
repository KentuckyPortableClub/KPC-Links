name: KPC owned land (agency-land parks)
# Oct 27 2026 (Fable's boundary review #1, HQ GO 11:00 AM): the land an agency OWNS inside a forest / refuge / project
# line, for Am I in the Park and the map tools (rule B1 + B-G1). Kentucky first: ky-dbnf-owned.geojson. By hand + monthly.
# Never fails (a failed run emails Brandon); a map that does not answer keeps the last file.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 3 * *'
permissions:
  contents: write
concurrency:
  group: kpc-owned
  cancel-in-progress: false
jobs:
  owned:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Read the ownership maps
        id: kept_green_1
        continue-on-error: true
        timeout-minutes: 50
        run: python3 .github/scripts/kpc_owned.py ky || echo "::error title=kpc_owned.py::stopped with an error (exit $?), see the log above"
      - name: Save
        if: always()
        id: kept_green_2
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ky-dbnf-owned.geojson 2>/dev/null || true   # ok: an optional path may not exist
          git diff --cached --quiet && exit 0
          git commit -m 'Owned land: Daniel Boone NF Forest Service land (kpc_owned.py)' || exit 0
          { saved=0; for i in 1 2 3; do git pull --rebase -q && git push -q && { saved=1; break; }; sleep 5; done; [ "$saved" = 1 ] || echo "::error title=Save::not saved after every try; the next run tries again"; }
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
