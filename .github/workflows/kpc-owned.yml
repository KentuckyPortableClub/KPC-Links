name: KPC owned land (agency-land parks)
# Oct 27 2026 (Fable's boundary review #1, HQ GO 11:00 AM): the land an agency OWNS inside a forest / refuge / project
# line, for Am I in the Park and the map tools (rule B1 + B-G1). Kentucky first: ky-dbnf-owned.geojson. By hand + monthly.
# Never fails (a failed run emails Brandon); a map that does not answer keeps the last file.
# Nov 11 (host rules, review package A): run through kpc_owned_run.py (kpc_owned.py is a 2-fer rule file, left as it is). The guard is
# on before any request; a map on a never-contact host (the Forest Service ownership map is one) is read from the saved copy
# only, and with no saved copy nothing is asked: the last file stays, with a visible warning and data/status/kpc_owned.json (STALE
# since, and the needs-download row for a person).
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 3 * *'
permissions:
  contents: write
concurrency:
  group: kpc-owned
  cancel-in-progress: false
jobs:
  owned:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Read the ownership maps
        id: kept_green_1
        continue-on-error: true
        timeout-minutes: 50
        run: python3 .github/scripts/kpc_owned_run.py ky || { kpc_rc=$?; echo "::error title=kpc_owned_run.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_owned_run.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Save
        if: always()
        id: kept_green_2
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ky-dbnf-owned.geojson 2>/dev/null || true   # ok: an optional path may not exist
          git add data/status/kpc_owned.json 2>/dev/null || true   # ok: written only when a map was blocked or did not answer
          git diff --cached --quiet && exit 0
          git commit -m 'Owned land: Daniel Boone NF Forest Service land (kpc_owned.py)' || exit 0
          { saved=0; for i in 1 2 3; do git pull --rebase -q && git push -q && { saved=1; break; }; sleep 5; done; [ "$saved" = 1 ] || { kpc_rc=$?; echo "::error title=Save::not saved after every try; the next run tries again"; echo "Save - not saved after every try; the next run tries again" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; }
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
