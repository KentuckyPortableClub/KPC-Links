name: KPC Canada pins
# Weekly: Canadian POTA parks, then the rest of North America (Mexico, Central America, Caribbean, Greenland: kpc_northam.py), (+ WWFF and SOTA from our weekly copies) for the KPC US Trip Planner.
on:
  schedule:
    - cron: '53 9 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-canada
  cancel-in-progress: false
jobs:
  canada:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/kpc_canada.py
      - run: python3 .github/scripts/kpc_northam.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/canada.json data/northam.json
          if ! git diff --cached --quiet; then git commit -m 'Canada + North America pins'; git pull --rebase --autostash || true; git push; fi
