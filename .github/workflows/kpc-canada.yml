name: KPC Canada pins
# Every night (Oct 23; was weekly): Canadian POTA parks, then the rest of North America (Mexico, Central America, Caribbean, Greenland: kpc_northam.py), (+ WWFF and SOTA from our weekly copies) for the KPC US Trip Planner.
on:
  schedule:
    - cron: '53 8 * * *'   # Oct 23: every night (3:53 AM Central)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-canada
  cancel-in-progress: false
jobs:
  canada:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - run: python3 .github/scripts/kpc_canada.py
      - run: python3 .github/scripts/kpc_northam.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/canada.json data/northam.json data/retired-refs.json 2>/dev/null || git add data/canada.json data/northam.json
          git add data/pota-pin-changes.json 2>/dev/null || true   # ok: only exists once a POTA pin has changed (Nov 11, kpc_pin_guard.py)
          git add data/status 2>/dev/null || true   # ok: an optional file or tidy step (Oct 25 storage plan: when each file last changed)
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'Canada + North America pins'
          # nightly now (Oct 23): a busy repo is not a fault worth an email; the next night saves it
          { for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*15)); done; echo "::error title=Save::not saved after every try; the next run tries again"; }
          echo "::notice title=Canada save::repo busy, the next run will save it"; exit 0
