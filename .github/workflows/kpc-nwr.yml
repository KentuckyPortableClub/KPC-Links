name: KPC NOAA Weather Radio list
# Refreshes kpc-nwr.json (NOAA Weather Radio transmitters around Kentucky) for the Weather page.
on:
  schedule:
    - cron: '17 9 3 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-nwr
  cancel-in-progress: false
jobs:
  nwr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/kpc_nwr.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kpc-nwr.json 2>/dev/null || true
          git add data/nwr 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update NOAA Weather Radio list'
            git pull --rebase --autostash || true
            git push || echo 'Push skipped; will save next run.'
          fi
