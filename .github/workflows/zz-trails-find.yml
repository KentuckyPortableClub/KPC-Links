name: zz trails discovery (temporary)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/kpc_us_trails.py
        env:
          MODE: info
          SEARCH: 'Continental Divide National Scenic Trail|North Country National Scenic Trail|Ice Age National Scenic Trail|Pacific Northwest National Scenic Trail|Nez Perce National Historic Trail|Florida National Scenic Trail|Arizona National Scenic Trail|National Scenic Trails owner:USFS'
          POTA: 'Florida Trail|Arizona Trail|New England Trail|Nez Perce'
