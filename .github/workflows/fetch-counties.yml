name: Fetch county outlines (temporary)
on: push
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: |
          mkdir -p /tmp/f && cd /tmp/f
          curl -sSL -o c.zip https://www2.census.gov/geo/tiger/GENZ2023/shp/cb_2023_us_county_500k.zip && unzip -q c.zip
          npm i -g mapshaper@0.6.102 >/dev/null
          for p in 30 15 8; do
            mapshaper cb_2023_us_county_500k.shp -filter 'STATEFP=="21"' -simplify $p% keep-shapes -o format=geojson precision=0.0001 ky$p.json
          done
          mapshaper cb_2023_us_county_500k.shp -filter 'STATEFP=="21"' -dissolve -simplify 15% keep-shapes -o format=geojson precision=0.0001 kyout.json
          cat > go.js <<'JS'
          const fs=require('fs');
          const rings=g=>(g.type==='Polygon'?[g.coordinates]:g.coordinates).flatMap(p=>p);
          const out={src:'US Census Bureau cartographic boundary file cb_2023_us_county_500k, simplified with mapshaper (keep-shapes)'};
          for(const p of [30,15,8]){const d=JSON.parse(fs.readFileSync('ky'+p+'.json'));out['c'+p]=d.features.map(f=>({n:f.properties.NAME,r:rings(f.geometry)}));
            console.log(p,out['c'+p].length,out['c'+p].reduce((a,f)=>a+f.r.reduce((b,r)=>b+r.length,0),0));}
          out.ky=rings(JSON.parse(fs.readFileSync('kyout.json')).features[0].geometry);
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/fetched-counties-hd.json',JSON.stringify(out));
          JS
          node go.js
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add fetched-counties-hd.json && git commit -m "fetched hd counties" && git push origin HEAD:claude-trail-fetch
