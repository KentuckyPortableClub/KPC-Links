name: KPC Special Event Stations & Contests
# Every morning: reads the ARRL Special Event Stations list (next ~75 days) and works out the big yearly
# on-the-air events, then saves kpc-special-events.json for the Events page calendar and the Live page spot filter.
# Run it any time from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-ses
  cancel-in-progress: false
jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find special event stations
        run: python3 .github/scripts/kpc_ses.py
      - name: Contest calendar (WA7BNM RSS feed + big yearly contests)
        run: python3 .github/scripts/kpc_contests.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kpc-special-events.json kpc-contests.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update special event stations and contests'
            git pull --rebase --autostash || true
            git push || echo 'Push skipped; will save on the next run.'
          fi
