name: KPC Special Event Stations & Contests
# Every morning: reads the ARRL Special Event Stations list (next ~75 days) and works out the big yearly
# on-the-air events, then saves kpc-special-events.json for the Events page calendar and the Live page spot filter.
# Run it any time from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-ses
  cancel-in-progress: false
jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find special event stations
        run: python3 .github/scripts/kpc_ses.py
      - name: PDF reader for the ARRL Contest Corral
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Contest calendar (WA7BNM RSS feed + ARRL Contest Corral + big yearly contests)
        run: python3 .github/scripts/kpc_contests.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/kpc_light_guard.py kpc-special-events.json kpc-contests.json || echo "::error title=kpc_light_guard.py::stopped with an error (exit $?), see the log above"   # Oct 30 (Brandon 6:07 AM GO, HQ step C): shrank by half / a row twice = keep the saved copy + a line to chat 11
          git add .claude/inbox/chat-11.md 2>/dev/null || true   # ok: an optional path may not exist
          git add kpc-special-events.json kpc-contests.json
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main; the chat-11 inbox and hand lists are merged, not copied). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" KPC_SAVE_LINES=".claude/inbox/chat-11.md" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'Update special event stations and contests' - -- kpc-special-events.json kpc-contests.json .claude/inbox/chat-11.md
