name: KPC release post (one time)
# Brandon's GO Oct 28 2026 (via HQ): the website release statement, once, to Discord + the Facebook Page.
# Run by hand only. Records each place in data/kpc-club-posts-state.json, so running it again never posts twice.
# Delete this file after it has posted. Never fails.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-club-posts
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Post once
        continue-on-error: true
        env:
          KPC_GENERAL_WEBHOOK: ${{ secrets.KPC_GENERAL_WEBHOOK }}
          KPC_DISCORD_WEBHOOK: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 .github/scripts/kpc_release_post.py || true
      - name: Remember it went out
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kpc-club-posts-state.json
          git diff --cached --quiet && exit 0
          git commit -qm 'Release post: sent'
          for i in 1 2 3 4; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i*8)); done; exit 0
