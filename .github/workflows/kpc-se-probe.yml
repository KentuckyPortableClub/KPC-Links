name: KPC Southeast source probe (temporary, once)
# Oct 27 (HQ): tests chat 8's Southeast candidate layers from a runner, because chat sessions cannot reach state map servers.
# Reads nothing the 2-fer runs read and writes only .claude/build/research/SE/candidates-tested.json. Never fails. DELETE after use.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-se-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/kpc_se_probe.py || echo "::error title=kpc_se_probe.py::stopped with an error (exit $?), see the log above"
        id: kept_green_1
        continue-on-error: true
      - name: Save
        id: kept_green_2
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude/build/research/SE/candidates-tested.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm 'Southeast source probe results'
          { for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i*8)); done; echo "::error title=Save::not saved after every try; the next run tries again"; }
          true
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
