name: KPC US answer key
# Every state but KY: POTA parks joined to official land (USGS PAD-US) only when name + kind match; the rest goes on review lists.
# Oct 28 (HQ: key rebuild speed-up): the states are SPLIT over 3 jobs at once, balanced by last run's seconds per state
# (data/us-key/index.json 'seconds'); each job runs the same script on its own states (a state's result never depends on
# another state's); a JOIN job puts the files together and runs the all-state steps at the end (parks joined in another
# state, totals, the pin check), then the review issue and ONE save.
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  schedule:
    - cron: '37 9 1 * *'   # monthly: every state
    - cron: '17 9 * * *'   # nightly (HQ Oct 30 6:55 AM, BOT B): only the states chat 11's new answers touch; nothing waiting = green, one notice   # G9 Nov 2: was '19 9 * * *' (spread the start times; now 2 min earlier)
    - cron: '46 11 * * *'   # Nov 2 (Brandon: the 9:19 start was skipped by GitHub): a BACKUP start; the states list is cleared by a finished build, so after a normal night it finds nothing to do   # G9 Nov 2: was '47 11 * * *' (spread the start times; now 1 min earlier)
  workflow_dispatch:
    inputs:
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
      states:
        description: "States, e.g. TN IN OH; blank = the states chat 11's new answers touch (BOT A), or 'all' = all but KY"
        default: ''
      jobs:
        description: 'Jobs at once (1-3)'
        default: '3'
      debug:
        description: 'Trace these park refs through every step (e.g. US-5684); a traced run still saves'
        default: ''
      force:
        description: "yes = build even while chat 11 grades a held build (Brandon's freeze, Nov 2: by hand only)"
        default: 'no'
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-us-key
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.p.outputs.groups }}
      full: ${{ steps.p.outputs.full }}   # Nov 4 (links-04): 1 = every state is built (the join stamps the rules hash only then)
    steps:
      - uses: actions/checkout@v5
      - name: FREEZE CHECK (Brandon Nov 2 7:11 AM; Nov 4 links-04, Brandon 4:51 AM CST, relayed via Super Head Bot) - a held build on the CURRENT rules, at most 3 days old, with no person's sign-off (Brandon / KZ4CP, after the Nov 2 restart; or signed YES and not yet released) means no new build
        # Nov 2 (before the 3:17 AM run): moved BEFORE BOT A, so a frozen US key also gets no new US answers (see BOT A below)
        env:
          KPC_INDEX_REF: origin/main   # Nov 4 PM fix bundle (items 1-2): decide on the NEWEST main's stamp, not this queued run's checkout
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: python3 .github/scripts/kpc_key_freeze.py check us-key || { kpc_rc=$?; echo "::error title=kpc_key_freeze.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_key_freeze.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: BOT A, the answers writer (Fable Oct 29 11:15 PM; plan KPC_Key_And_2fer_Automation_Plan.md)
        # chat 11's YES / NO rows in KPC-Data data/waiting/questions/*.json -> data/us-key/overrides.json (join / no / alias) +
        # the ledger answers-applied.json + answers-states.txt (the states to rebuild). Saved first, so the build jobs read it.
        env:
          KPC_ANSWERS_WHILE_FROZEN: ${{ vars.KPC_ANSWERS_WHILE_FROZEN || 'no' }}
          KPC_ANSWERS_SKIP: ${{ vars.KPC_ANSWERS_SKIP || 'map-audit' }}
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data kpcdata 2>/dev/null \
            && git -C kpcdata sparse-checkout set --no-cone data/waiting/questions data/intake 2>/dev/null && git -C kpcdata checkout -q 2>/dev/null || true   # ok: optional git step; the next step reports
          # Nov 2 review: the four writers go in one file so the save can run them AGAIN on top of the newest main (save by overwrite).
          # A writer that stops is now loud (::error) instead of hidden by '|| true'.
          cat > /tmp/bota.sh <<'SH'
          # Nov 2: while the US key is FROZEN (the check above), US answers wait; nothing is lost, the ledger applies them after the release.
          # Repo variable KPC_ANSWERS_WHILE_FROZEN=yes = the old way (apply them even while frozen).
          if [ "${FROZEN:-}" = "1" ] && [ "${KPC_ANSWERS_WHILE_FROZEN:-no}" != "yes" ]; then
            echo "::notice title=BOT A::US key frozen (build ${FROZEN_BUILD:-?}): US answers not applied tonight; they wait for the release"
          else
            DATA=kpcdata python3 .github/scripts/kpc_key_answers.py || echo '::error title=BOT A::kpc_key_answers.py stopped (see its log above)'
          fi
          DATA=kpcdata python3 .github/scripts/kpc_key_layers.py || echo '::error title=BOT A::kpc_key_layers.py stopped (see its log above)'
          DATA=kpcdata python3 .github/scripts/kpc_ca_answers.py || echo '::error title=BOT A::kpc_ca_answers.py stopped (see its log above)'
          DATA=kpcdata python3 .github/scripts/kpc_world_answers.py || echo '::error title=BOT A::kpc_world_answers.py stopped (see its log above)'
          SH
          bash /tmp/bota.sh
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Oct 31: ONE missing path made the whole 'git add' fail; Oct 30-Nov 2: 'git pull --rebase' failed on unstaged files and
          # '|| true' hid it, so chat 11's answers were never saved. Now: save by overwrite (fresh main + the writers again), red on failure.
          # KPC_SAVE_MODE (repo variable) = overwrite (default) | rebase (the old way, still loud).
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" bash .github/scripts/kpc_save_overwrite.sh "Key: chat 11's answers applied (BOT A)" 'bash /tmp/bota.sh' -- data/us-key/overrides.json data/us-key/answers-applied.json data/us-key/answers-states.txt data/state-gis.json data/ca-key/answers-provinces.txt data/ca-key/overrides.json data/ca-key/answers-applied.json data/world-key/answers-countries.txt data/world-key/extra-layers.json data/world-key/overrides.json data/world-key/answers-applied.json
          rm -rf kpcdata
      - id: p
        env:
          STATES: ${{ inputs.states }}
          NJOBS: ${{ inputs.jobs }}
          SCHED: ${{ (github.event.schedule || inputs.as_schedule) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          if os.environ.get('FROZEN') == '1':
              print('groups=[]'); print(f"::notice title=US key plan::FROZEN: build {os.environ.get('FROZEN_BUILD')} waits for chat 11 / its release; nothing builds (BOT A's answers were still saved)", file=__import__('sys').stderr); raise SystemExit(0)
          # Nov 3 (Brandon YES 5:29 PM): a nightly/backup start (or the watchdog's late restart of one) does nothing when a build
          # already FINISHED today after 09:17 UTC (the nightly time). Nov 3 had 4 builds: the backup and two late restarts rebuilt
          # the same states. The monthly run and by-hand runs with states are never skipped.
          import datetime as _dt
          # Nov 4 (links-04): RULES_CHANGED=1 (the freeze check: the newest build was not a full build on the current rules) = this start
          # builds EVERY state and is never skipped as 'already built today'.
          # Key hotfix Nov 5 (Brandon's approval relayed via Super Head Bot 4:21 AM CST): WHATEVER the states input says. The boundary bot
          # queue (41984445602) dispatched 41984527710 with STATES=CT ID ME ND OH TN WV; the freeze check saw RULES CHANGED 6bb847b4f6cd ->
          # 3dc53f70256a, but the states input won (KPC_FULL_BUILD 0): 7 states on the new rules, the index kept rules=6bb847b4f6cd.
          _rules = os.environ.get('RULES_CHANGED') == '1'
          _given = ' '.join((os.environ.get('STATES') or '').split())
          if _rules and _given and _given.upper() != 'ALL':
              print(f"::warning title=US key plan::RULES CHANGED since the newest build: the states input '{_given}' is OVERRIDDEN - building ALL states on the current rules (a partial build would mix rules)", file=__import__('sys').stderr)
          elif _rules: print('::notice title=US key plan::RULES CHANGED since the newest build: building ALL states on the current rules (no force needed)', file=__import__('sys').stderr)
          # Next round C2 (Nov 5, Brandon's yes relayed via Super): EVERY message of this step goes to stderr (FROZEN, already built today,
          # no new answers, the job split), not only the two rules lines below; stdout is only the step outputs.
          # Key hotfix 3 (Nov 5): these two go to stderr = the run log. stdout is >> $GITHUB_OUTPUT, so a ::notice printed there is
          # never shown (the plan job of 41984527710 has no 'US key plan' annotation at all).
          if not _rules and os.environ.get('SCHED') in ('17 9 * * *', '46 11 * * *') and not (os.environ.get('STATES') or '').strip():
              try: _b = json.load(open('data/us-key/index.json', encoding='utf-8')).get('built') or ''
              except Exception: _b = ''
              _now = _dt.datetime.now(_dt.timezone.utc); _t0 = _now.replace(hour=9, minute=17, second=0, microsecond=0)
              try: _bt = _dt.datetime.strptime(_b, '%Y-%m-%d %H:%M UTC').replace(tzinfo=_dt.timezone.utc)
              except Exception: _bt = None
              if _bt and _now >= _t0 and _bt >= _t0:
                  print('groups=[]'); print(f"::notice title=US key plan::a build already finished today at {_b} (after the 09:17 UTC nightly time): this {os.environ.get('SCHED')} start does nothing", file=__import__('sys').stderr); raise SystemExit(0)
          ALL = 'AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY'.split()
          want = (os.environ.get('STATES') or '').upper().replace(',', ' ').split()
          if want == ['ALL'] or _rules or (not want and os.environ.get('SCHED') == '37 9 1 * *'): st = ALL      # 'all' / rules changed / the MONTHLY cron = every state
          elif want: st = [x for x in want if x != 'KY']
          else:                                                                                               # BOT B: only the states new answers touched
              try: st = [x for x in open('data/us-key/answers-states.txt').read().split() if x != 'KY']
              except Exception: st = []
              if not st:
                  print('groups=[]'); print('::notice title=US key plan::no new answers and no states given: nothing to rebuild', file=__import__('sys').stderr); raise SystemExit(0)
          n = max(1, min(3, int(os.environ.get('NJOBS') or 3), len(st)))
          try: sec = {k: (v.get('seconds') or 60) for k, v in json.load(open('data/us-key/index.json'))['states'].items()}
          except Exception: sec = {}
          g = [[] for _ in range(n)]; load = [0] * n
          for s in sorted(st, key=lambda s: -sec.get(s, 60)):   # biggest first, each to the lightest job
              i = load.index(min(load)); g[i].append(s); load[i] += sec.get(s, 60)
          print('groups=' + json.dumps([{'i': i, 'states': ' '.join(sorted(x))} for i, x in enumerate(g) if x]))
          print('full=' + ('1' if set(st) >= set(ALL) else '0'))
          print(f'::notice title=US key plan::{n} jobs: ' + ' | '.join(f'{" ".join(sorted(x))} (~{l // 60} min)' for x, l in zip(g, load)), file=__import__('sys').stderr)
          PY
  build:
    needs: plan
    if: ${{ needs.plan.outputs.groups != '[]' && needs.plan.outputs.groups != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        g: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # Nov 2 review: see the overrides BOT A pushed in the plan job (github.sha predates them)
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - name: The Recreation.gov saved copy (the one keyed pull, read only; HQ Oct 29 8:50 PM)
        id: kept_green_1
        continue-on-error: true
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .ridb 2>/dev/null \
            && git -C .ridb sparse-checkout set --no-cone data/access-leads/keyed-pull-raw.json.gz 2>/dev/null && git -C .ridb checkout -q 2>/dev/null || true   # ok: optional git step; the next step reports
          mkdir -p data/access-leads && cp -f .ridb/data/access-leads/keyed-pull-raw.json.gz data/access-leads/ 2>/dev/null || true; rm -rf .ridb   # ok: an optional file or tidy step
      - name: Build the answer key (this job's states)
        env:
          STATES: ${{ matrix.g.states }}
          DEBUG_REFS: ${{ inputs.debug }}
          MINUTES: '300'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          pip install --quiet --break-system-packages pyshp pyproj shapely || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # Oct 28: zipped-shapefile layers (Mississippi)
          python3 .github/scripts/kpc_us_key.py 2>&1 | tee us-key-${{ matrix.g.i }}.log
          # Nov 6: a state whose shape source returned zero or under half the last live key (KPC-Data) must not
          # be published as pins. Run 42230313177 timed out on every Wisconsin DNR layer and still wrote WI
          # (1,585 shapes vs 80,934 live): 18 parks went outline -> pin with bk=noshape. Refill a short state
          # from the saved outlines (boundary-cache, offline). If that is still short, put the live state file
          # back and fail after the artifact upload (the short read is not what gets saved).
          rm -f /tmp/shape-guard-fail /tmp/shape-short.txt
          rm -rf .livekey
          if GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .livekey \
              && git -C .livekey sparse-checkout set --no-cone data/us-key/index.json \
              && git -C .livekey checkout -q; then
            python3 .github/scripts/kpc_shape_guard.py --built data/us-key --live-index .livekey/data/us-key/index.json --states "$STATES" > /tmp/shape-short.txt && sc=0 || sc=$?
            if [ "$sc" = 3 ]; then
              echo "::error title=Shape guard::the live US key index was not readable"
              echo "live US key index not readable" >> /tmp/shape-guard-fail
            elif [ "$sc" = 2 ]; then
              cp /tmp/shape-short.txt /tmp/shape-short-live.txt
              mkdir -p cache/us
              recover=""
              while read -r st got live; do
                [ -n "$st" ] || continue
                echo "::error title=US key $st::shape source returned $got vs $live in the last live key (zero or under half). Refilling from the saved outlines so parks are not dropped to pins."
                if gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p "US-$st.json.gz" -D cache/us --clobber; then
                  recover="$recover $st"
                else
                  echo "::error title=US key $st::saved outlines US-$st.json.gz were not on the boundary-cache release"
                fi
              done < /tmp/shape-short-live.txt
              if [ -n "$recover" ]; then
                STATES="$recover" GEO_CACHE_MODE=only python3 .github/scripts/kpc_us_key.py 2>&1 | tee -a us-key-${{ matrix.g.i }}.log \
                  || { kpc_rc=$?; echo "::error title=Shape guard::saved-copy refill failed (exit $kpc_rc), see the log above"; echo "Shape guard - saved-copy refill failed (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
              fi
              python3 .github/scripts/kpc_shape_guard.py --built data/us-key --live-index .livekey/data/us-key/index.json --states "$STATES" > /tmp/shape-short.txt && sc=0 || sc=$?
              # The live read was short either way: the job fails after upload so it is not a silent pin drop.
              # sc 0 = the saved outlines refilled the state (that file is what gets saved).
              # anything else = still short, so put the live key's state file back (or drop the short file).
              if [ "$sc" = 0 ]; then
                while read -r st got live; do
                  [ -n "$st" ] || continue
                  echo "::error title=US key $st::live shape source was $got vs $live. The saved outlines were used. This job fails so that drop is not silent."
                  echo "$st live shape source $got vs $live; refilled from the saved outlines (not published as pins)" >> /tmp/shape-guard-fail
                done < /tmp/shape-short-live.txt
              else
                src=/tmp/shape-short.txt
                [ -s "$src" ] || src=/tmp/shape-short-live.txt
                while read -r st got live; do
                  [ -n "$st" ] || continue
                  if git -C .livekey sparse-checkout add "data/us-key/US-$st.json" && git -C .livekey checkout -q \
                      && [ -s ".livekey/data/us-key/US-$st.json" ]; then
                    cp ".livekey/data/us-key/US-$st.json" "data/us-key/US-$st.json"
                    rm -f "data/us-key/tracts/US-$st.json"   # the short read's tract file does not match the live key
                    echo "::error title=US key $st::shape source still $got vs $live after the saved-copy refill. The live key's US-$st.json is what will be saved, not the short read."
                    echo "$st shape source $got vs live $live; saved the live key file instead of the short read" >> /tmp/shape-guard-fail
                  else
                    rm -f "data/us-key/US-$st.json"   # do not upload the short read
                    echo "::error title=US key $st::shape source $got vs live $live and the live state file was not read. This short read will not be uploaded."
                    echo "$st shape source $got vs live $live; short read not uploaded" >> /tmp/shape-guard-fail
                  fi
                done < "$src"
              fi
            elif [ "$sc" != 0 ]; then
              echo "::error title=Shape guard::stopped (exit $sc)"
              echo "shape guard stopped (exit $sc)" >> /tmp/shape-guard-fail
            fi
          else
            echo "::error title=Shape guard::KPC-Data live US key index was not read, so a short shape source cannot be judged"
            echo "live US key index not read" >> /tmp/shape-guard-fail
          fi
          rm -rf .livekey
          mkdir -p part
          for st in $STATES; do [ -f data/us-key/US-$st.json ] && cp data/us-key/US-$st.json part/; done
          mkdir -p part/tracts; for st in $STATES; do [ -f data/us-key/tracts/US-$st.json ] && cp data/us-key/tracts/US-$st.json part/tracts/; done   # Nov 6: tract side files
          cp data/us-key/index.json part/index.json; cp data/us-key/layers.json part/layers.json 2>/dev/null || true   # ok: nothing to do is fine
          cp data/us-key/zip-*.json part/ 2>/dev/null || true   # ok: nothing to do is fine
          echo "$STATES" > part/states.txt; cp us-key-${{ matrix.g.i }}.log part/
          if [ -s /tmp/shape-guard-fail ]; then cp /tmp/shape-guard-fail part/shape-guard-fail; fi
      - uses: actions/upload-artifact@v4
        with:
          name: us-key-part-${{ matrix.g.i }}
          path: part/
          retention-days: 3
      - name: Shape source guard (loud fail)
        # The build step uploads the artifact first (a refilled or live-key state file, never the short read).
        # A short source that could not be refilled fails the job here so it is not a silent pin drop.
        run: |
          if [ -s part/shape-guard-fail ]; then
            echo "::error title=US key shape source::$(tr '\n' ' ' < part/shape-guard-fail)"
            cat part/shape-guard-fail
            exit 1
          fi
          echo "shape source guard: every state in this job is at least half the last live key"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
  join:
    needs: [plan, build]
    if: ${{ always() && needs.build.result != 'cancelled' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # Nov 2 review: see the overrides BOT A pushed in the plan job (github.sha predates them)
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: us-key-part-*
          path: parts
      - name: Put the parts together + the all-state steps
        run: |
          python3 - <<'PY'
          import glob, json, os, shutil
          idx = json.load(open('data/us-key/index.json')).get('states', {}) if os.path.exists('data/us-key/index.json') else {}
          try: LJ = json.load(open('data/us-key/layers.json'))
          except Exception: LJ = {}
          n = 0
          for d in sorted(glob.glob('parts/us-key-part-*')):
              sts = open(f'{d}/states.txt').read().split()
              pi = json.load(open(f'{d}/index.json')).get('states', {})
              for st in sts:
                  if os.path.exists(f'{d}/US-{st}.json'): shutil.copy(f'{d}/US-{st}.json', f'data/us-key/US-{st}.json'); n += 1
                  if os.path.exists(f'{d}/tracts/US-{st}.json'): os.makedirs('data/us-key/tracts', exist_ok=True); shutil.copy(f'{d}/tracts/US-{st}.json', f'data/us-key/tracts/US-{st}.json')   # Nov 6
                  if st in pi: idx[st] = pi[st]
              try: LJ.update(json.load(open(f'{d}/layers.json')))
              except Exception: pass
              for z in glob.glob(f'{d}/zip-*.json'): shutil.copy(z, 'data/us-key/' + os.path.basename(z))
              shutil.copy(glob.glob(f'{d}/us-key-*.log')[0], '.') if glob.glob(f'{d}/us-key-*.log') else None
          import sys; sys.path.insert(0, '.github/scripts')
          from kpc_save import save_json   # the same writer the script uses (same bytes as a serial run)
