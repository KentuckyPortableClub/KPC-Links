        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
  postcheck:
    # Key hotfix Nov 5 (Brandon's approval relayed via Super Head Bot 4:21 AM CST): a run started with the GITHUB_TOKEN (the boundary
    # bot queue, the watchdog: triggering actor github-actions[bot]) fires NO workflow_run event, so 'KPC key check (after a key
    # build)' never started after 41984527710 (all 11 post-key checks so far followed runs started by KentuckyPortableClub). A
    # workflow_dispatch is the one start the GITHUB_TOKEN may make. A person's run still starts it through workflow_run, as before.
    needs: [plan, join]
    if: ${{ always() && github.triggering_actor == 'github-actions[bot]' && needs.join.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the post-key check (a bot-started run fires no workflow_run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run kpc-key-postcheck.yml -R "$GITHUB_REPOSITORY" --ref main -f key=us && echo "::notice title=US key::post-key check started (this run was started by github-actions[bot])" || { kpc_rc=$?; echo "::warning title=US key::could not start the post-key check (exit $kpc_rc): start 'KPC key check (after a key build)' by hand with key=us"; echo "US key - could not start the post-key check (exit $kpc_rc): start 'KPC key check (after a key build)' by hand with key=us" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
  chain:
    # Next round C1 (Nov 5; Brandon's yes relayed via Super, 4:32 AM CST Nov 5): the Canada and world keys follow the US key through
    # workflow_run, which a GITHUB_TOKEN-started run (the boundary bot queue, the watchdog: triggering actor github-actions[bot])
    # never fires. Like the postcheck job above, a bot-started run DISPATCHES them, marked chained=us-key, so each is checked as a
    # chained start (kpc_key_order.py: catch-up only; a duplicate or an up-to-date key skips cleanly). A person's run is left to
    # workflow_run as before, so no key is started twice for one US run. Runs whatever the build's result was, as workflow_run does.
    needs: [plan, join]
    if: ${{ always() && github.triggering_actor == 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the Canada and world keys (a bot-started run fires no workflow_run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for k in ca world; do
            gh workflow run "kpc-$k-key.yml" -R "$GITHUB_REPOSITORY" --ref main -f chained=us-key && echo "::notice title=US key::$k key started as a chained start (this run was started by github-actions[bot])" || { kpc_rc=$?; echo "::warning title=US key::could not start the $k key (exit $kpc_rc): start it by hand if a new-rules build is waiting"; echo "US key - could not start the $k key (exit $kpc_rc): start it by hand if a new-rules build is waiting" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          done
