      - name: Lost finds check (chat 2, Nov 1; Brandon 'we are finding stuff but it never makes it in')
        id: kept_green_2
        continue-on-error: true
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .lf 2>/dev/null \
            && git -C .lf sparse-checkout set --no-cone data/intake/external-results.json 'data/waiting/questions/*.json' 2>/dev/null && git -C .lf checkout -q 2>/dev/null || true   # ok: optional git step; the next step reports
          DATA=.lf python3 .github/scripts/kpc_lost_finds.py || { kpc_rc=$?; echo "::error title=kpc_lost_finds.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_lost_finds.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          rm -rf .lf
      - name: Review issue
