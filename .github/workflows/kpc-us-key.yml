name: KPC US answer key
# Every state but KY: POTA parks joined to official land (USGS PAD-US) only when name + kind match; the rest goes on review lists.
# Oct 28 (HQ: key rebuild speed-up): the states are SPLIT over 3 jobs at once, balanced by last run's seconds per state
# (data/us-key/index.json 'seconds'); each job runs the same script on its own states (a state's result never depends on
# another state's); a JOIN job puts the files together and runs the all-state steps at the end (parks joined in another
# state, totals, the pin check), then the review issue and ONE save.
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  schedule:
    - cron: '37 9 1 * *'   # monthly: every state
    - cron: '17 9 * * *'   # nightly (HQ Oct 30 6:55 AM, BOT B): only the states chat 11's new answers touch; nothing waiting = green, one notice   # G9 Nov 2: was '19 9 * * *' (spread the start times; now 2 min earlier)
    - cron: '46 11 * * *'   # Nov 2 (Brandon: the 9:19 start was skipped by GitHub): a BACKUP start; the states list is cleared by a finished build, so after a normal night it finds nothing to do   # G9 Nov 2: was '47 11 * * *' (spread the start times; now 1 min earlier)
  workflow_dispatch:
    inputs:
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
      states:
        description: "States, e.g. TN IN OH; blank = the states chat 11's new answers touch (BOT A), or 'all' = all but KY"
        default: ''
      jobs:
        description: 'Jobs at once (1-3)'
        default: '3'
      debug:
        description: 'Trace these park refs through every step (e.g. US-5684); a traced run still saves'
        default: ''
      force:
        description: "yes = build even while chat 11 grades a held build (Brandon's freeze, Nov 2: by hand only)"
        default: 'no'
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-us-key
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.p.outputs.groups }}
    steps:
      - uses: actions/checkout@v5
      - name: FREEZE CHECK (Brandon Nov 2 7:11 AM, frozen while chat 11 grades it) - a held build without a verdict for its id, or graded and not yet released, means no new build
        # Nov 2 (before the 3:17 AM run): moved BEFORE BOT A, so a frozen US key also gets no new US answers (see BOT A below)
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: python3 .github/scripts/kpc_key_freeze.py check us-key || echo "::error title=kpc_key_freeze.py::stopped with an error (exit $?), see the log above"
      - name: BOT A, the answers writer (Fable Oct 29 11:15 PM; plan KPC_Key_And_2fer_Automation_Plan.md)
        # chat 11's YES / NO rows in KPC-Data data/waiting/questions/*.json -> data/us-key/overrides.json (join / no / alias) +
        # the ledger answers-applied.json + answers-states.txt (the states to rebuild). Saved first, so the build jobs read it.
        env:
          KPC_ANSWERS_WHILE_FROZEN: ${{ vars.KPC_ANSWERS_WHILE_FROZEN || 'no' }}
          KPC_ANSWERS_SKIP: ${{ vars.KPC_ANSWERS_SKIP || 'map-audit' }}
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data kpcdata 2>/dev/null \
            && git -C kpcdata sparse-checkout set --no-cone data/waiting/questions data/intake 2>/dev/null && git -C kpcdata checkout -q 2>/dev/null || true   # ok: optional git step; the next step reports
          # Nov 2 review: the four writers go in one file so the save can run them AGAIN on top of the newest main (save by overwrite).
          # A writer that stops is now loud (::error) instead of hidden by '|| true'.
          cat > /tmp/bota.sh <<'SH'
          # Nov 2: while the US key is FROZEN (the check above), US answers wait; nothing is lost, the ledger applies them after the release.
          # Repo variable KPC_ANSWERS_WHILE_FROZEN=yes = the old way (apply them even while frozen).
          if [ "${FROZEN:-}" = "1" ] && [ "${KPC_ANSWERS_WHILE_FROZEN:-no}" != "yes" ]; then
            echo "::notice title=BOT A::US key frozen (build ${FROZEN_BUILD:-?}): US answers not applied tonight; they wait for the release"
          else
            DATA=kpcdata python3 .github/scripts/kpc_key_answers.py || echo '::error title=BOT A::kpc_key_answers.py stopped (see its log above)'
          fi
          DATA=kpcdata python3 .github/scripts/kpc_key_layers.py || echo '::error title=BOT A::kpc_key_layers.py stopped (see its log above)'
          DATA=kpcdata python3 .github/scripts/kpc_ca_answers.py || echo '::error title=BOT A::kpc_ca_answers.py stopped (see its log above)'
          DATA=kpcdata python3 .github/scripts/kpc_world_answers.py || echo '::error title=BOT A::kpc_world_answers.py stopped (see its log above)'
          SH
          bash /tmp/bota.sh
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Oct 31: ONE missing path made the whole 'git add' fail; Oct 30-Nov 2: 'git pull --rebase' failed on unstaged files and
          # '|| true' hid it, so chat 11's answers were never saved. Now: save by overwrite (fresh main + the writers again), red on failure.
          # KPC_SAVE_MODE (repo variable) = overwrite (default) | rebase (the old way, still loud).
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" bash .github/scripts/kpc_save_overwrite.sh "Key: chat 11's answers applied (BOT A)" 'bash /tmp/bota.sh' -- data/us-key/overrides.json data/us-key/answers-applied.json data/us-key/answers-states.txt data/state-gis.json data/ca-key/answers-provinces.txt data/ca-key/overrides.json data/ca-key/answers-applied.json data/world-key/answers-countries.txt data/world-key/extra-layers.json data/world-key/overrides.json data/world-key/answers-applied.json
          rm -rf kpcdata
      - id: p
        env:
          STATES: ${{ inputs.states }}
          NJOBS: ${{ inputs.jobs }}
          SCHED: ${{ (github.event.schedule || inputs.as_schedule) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          if os.environ.get('FROZEN') == '1':
              print('groups=[]'); print(f"::notice title=US key plan::FROZEN: build {os.environ.get('FROZEN_BUILD')} waits for chat 11 / its release; nothing builds (BOT A's answers were still saved)"); raise SystemExit(0)
          ALL = 'AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY'.split()
          want = (os.environ.get('STATES') or '').upper().replace(',', ' ').split()
          if want == ['ALL'] or (not want and os.environ.get('SCHED') == '37 9 1 * *'): st = ALL      # 'all' / the MONTHLY cron = every state
          elif want: st = [x for x in want if x != 'KY']
          else:                                                                                               # BOT B: only the states new answers touched
              try: st = [x for x in open('data/us-key/answers-states.txt').read().split() if x != 'KY']
              except Exception: st = []
              if not st:
                  print('groups=[]'); print('::notice title=US key plan::no new answers and no states given: nothing to rebuild'); raise SystemExit(0)
          n = max(1, min(3, int(os.environ.get('NJOBS') or 3), len(st)))
          try: sec = {k: (v.get('seconds') or 60) for k, v in json.load(open('data/us-key/index.json'))['states'].items()}
          except Exception: sec = {}
          g = [[] for _ in range(n)]; load = [0] * n
          for s in sorted(st, key=lambda s: -sec.get(s, 60)):   # biggest first, each to the lightest job
              i = load.index(min(load)); g[i].append(s); load[i] += sec.get(s, 60)
          print('groups=' + json.dumps([{'i': i, 'states': ' '.join(sorted(x))} for i, x in enumerate(g) if x]))
          print(f'::notice title=US key plan::{n} jobs: ' + ' | '.join(f'{" ".join(sorted(x))} (~{l // 60} min)' for x, l in zip(g, load)))
          PY
  build:
    needs: plan
    if: ${{ needs.plan.outputs.groups != '[]' && needs.plan.outputs.groups != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        g: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # Nov 2 review: see the overrides BOT A pushed in the plan job (github.sha predates them)
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - name: The Recreation.gov saved copy (the one keyed pull, read only; HQ Oct 29 8:50 PM)
        id: kept_green_1
        continue-on-error: true
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .ridb 2>/dev/null \
            && git -C .ridb sparse-checkout set --no-cone data/access-leads/keyed-pull-raw.json.gz 2>/dev/null && git -C .ridb checkout -q 2>/dev/null || true   # ok: optional git step; the next step reports
          mkdir -p data/access-leads && cp -f .ridb/data/access-leads/keyed-pull-raw.json.gz data/access-leads/ 2>/dev/null || true; rm -rf .ridb   # ok: an optional file or tidy step
      - name: Build the answer key (this job's states)
        env:
          STATES: ${{ matrix.g.states }}
          DEBUG_REFS: ${{ inputs.debug }}
          MINUTES: '300'
        run: |
          pip install --quiet --break-system-packages pyshp pyproj shapely || echo "::warning title=install::an install step failed (exit $?); the next steps may not work"   # Oct 28: zipped-shapefile layers (Mississippi)
          python3 .github/scripts/kpc_us_key.py 2>&1 | tee us-key-${{ matrix.g.i }}.log
          mkdir -p part
          for st in $STATES; do [ -f data/us-key/US-$st.json ] && cp data/us-key/US-$st.json part/; done
          cp data/us-key/index.json part/index.json; cp data/us-key/layers.json part/layers.json 2>/dev/null || true   # ok: nothing to do is fine
          cp data/us-key/zip-*.json part/ 2>/dev/null || true   # ok: nothing to do is fine
          echo "$STATES" > part/states.txt; cp us-key-${{ matrix.g.i }}.log part/
      - uses: actions/upload-artifact@v4
        with:
          name: us-key-part-${{ matrix.g.i }}
          path: part/
          retention-days: 3
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
  join:
    needs: [plan, build]
    if: ${{ always() && needs.build.result != 'cancelled' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # Nov 2 review: see the overrides BOT A pushed in the plan job (github.sha predates them)
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: us-key-part-*
          path: parts
      - name: Put the parts together + the all-state steps
        run: |
          python3 - <<'PY'
          import glob, json, os, shutil
          idx = json.load(open('data/us-key/index.json')).get('states', {}) if os.path.exists('data/us-key/index.json') else {}
          try: LJ = json.load(open('data/us-key/layers.json'))
          except Exception: LJ = {}
          n = 0
          for d in sorted(glob.glob('parts/us-key-part-*')):
              sts = open(f'{d}/states.txt').read().split()
              pi = json.load(open(f'{d}/index.json')).get('states', {})
              for st in sts:
                  if os.path.exists(f'{d}/US-{st}.json'): shutil.copy(f'{d}/US-{st}.json', f'data/us-key/US-{st}.json'); n += 1
                  if st in pi: idx[st] = pi[st]
              try: LJ.update(json.load(open(f'{d}/layers.json')))
              except Exception: pass
              for z in glob.glob(f'{d}/zip-*.json'): shutil.copy(z, 'data/us-key/' + os.path.basename(z))
              shutil.copy(glob.glob(f'{d}/us-key-*.log')[0], '.') if glob.glob(f'{d}/us-key-*.log') else None
          import sys; sys.path.insert(0, '.github/scripts')
          from kpc_save import save_json   # the same writer the script uses (same bytes as a serial run)
          save_json('data/us-key/index.json', {'states': {k: idx[k] for k in idx}})
          save_json('data/us-key/layers.json', LJ)
          print(f'::notice title=US key join::{n} state files from {len(glob.glob("parts/us-key-part-*"))} jobs')
          PY
          FINISH_ONLY=1 python3 .github/scripts/kpc_us_key.py 2>&1 | tee us-key-join.log
          # Oct 28 (HQ 2:58 PM): parks whose joined outline changed -> the 2-fer small batches (KPC-Data kpc-fers-pending.yml reads it)
          python3 - <<'PY'
          import glob, json, subprocess, time
          ch = []
          for f in sorted(glob.glob('data/us-key/US-??.json')):
              try: old = json.loads(subprocess.run(['git', 'show', 'HEAD:' + f], capture_output=True, text=True).stdout or '{}').get('parks') or {}
              except Exception: old = {}
              new = json.load(open(f)).get('parks') or {}
              for r, p in new.items():
                  a = sorted(str(x[0]) for x in (old.get(r) or {}).get('m') or []); b = sorted(str(x[0]) for x in p.get('m') or [])
                  if a != b and b: ch.append(r)
          json.dump({'about': 'Parks whose joined outline changed in the last US key rebuild (for the 2-fer small batches).', 'date': time.strftime('%Y-%m-%d'), 'refs': sorted(set(ch))}, open('data/us-key/changed-parks.json', 'w'), indent=1)
          print(f'::notice title=US key::{len(set(ch))} parks with a changed outline -> the 2-fer waiting list')
          PY
          cat us-key-*.log > us-key.log 2>/dev/null || true   # ok: nothing to do is fine
      - name: Lost finds check (chat 2, Nov 1; Brandon 'we are finding stuff but it never makes it in')
        id: kept_green_2
        continue-on-error: true
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .lf 2>/dev/null \
            && git -C .lf sparse-checkout set --no-cone data/intake/external-results.json 'data/waiting/questions/*.json' 2>/dev/null && git -C .lf checkout -q 2>/dev/null || true   # ok: optional git step; the next step reports
          DATA=.lf python3 .github/scripts/kpc_lost_finds.py || echo "::error title=kpc_lost_finds.py::stopped with an error (exit $?), see the log above"
          rm -rf .lf
      - name: Review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_us_key_issue.py
      - name: BUILD STAMP (Brandon Nov 2) - this build's id in data/us-key/index.json, chat 11 grades only this id
        run: python3 .github/scripts/kpc_key_freeze.py stamp us-key | tail -1 > /tmp/build-id.txt; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || echo "::warning title=kpc_key_freeze.py::stopped with an error (exit $rc), see the log above"
      - name: BOT C line for chat 11 (HQ Oct 30) - this build vs the LIVE key, one line in its inbox
        id: kept_green_3
        continue-on-error: true
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data live 2>/dev/null \
            && git -C live sparse-checkout set --no-cone data/us-key 2>/dev/null && git -C live checkout -q 2>/dev/null || true   # ok: optional git step; the next step reports
          python3 - <<'PY' || echo "::error title=inline Python::stopped with an error (exit $?), see the log above"
          import glob, json, os, time
          def parks(d):
              o = {}
              for f in glob.glob(f'{d}/US-??.json'):
                  try:
                      for r, p in json.load(open(f))['parks'].items(): o[(f[-7:-5], r)] = p
                  except Exception: pass
              return o
          L, N = parks('live/data/us-key'), parks('data/us-key')
          if not L or not N: raise SystemExit
          ids = lambda p: {str(x[0]) for x in p.get('m') or []}
          g = sum(1 for k, p in N.items() if ids(p) and not ids(L.get(k, {})))
          l = sum(1 for k, p in N.items() if ids(L.get(k, {})) and not ids(p))
          ch = sum(1 for k, p in N.items() if ids(p) and ids(L.get(k, {})) and ids(p) != ids(L.get(k, {})))
          sts = sorted({k[0] for k, p in N.items() if ids(p) != ids(L.get(k, {}))})
          if not (g or l or ch): raise SystemExit
          bid = (open('/tmp/build-id.txt').read().strip() if os.path.exists('/tmp/build-id.txt') else '') or '?'
          line = (f"- FROM THE KEY BOT ({time.strftime('%b %d %H:%M UTC')}): US key BUILD {bid} is ready for your check (frozen until you grade it): +{g} outlined / -{l} lost / "
                  f"{ch} pieces changed vs the live key (states: {' '.join(sts[:20])}{' …' if len(sts) > 20 else ''}). The 30-park sample is in KPC-Data "
                  f"data/waiting/preview/us-key-changes.json after the next copy (01:41 / 10:41 UTC). Write ONE item in data/waiting/approved.json: what us-key, build {bid}, chat11 KEY YES / KEY NO (a verdict without this build id releases nothing).")
          open('/tmp/botc-line.txt', 'w').write(line)   # Oct 30: written to chat 11's inbox AFTER the key is saved (an inbox edit conflict lost two saves)
          print('::notice title=BOT C::' + line[:200])
          PY
          rm -rf live
      - name: Save
        if: always()
        env:
          PLAN_GROUPS: ${{ needs.plan.outputs.groups }}
        run: |
          # Oct 30 (chat 2): two runs' keys were LOST: 'git pull --rebase' hit a conflict in chat 11's inbox (other chats edit it all day),
          # all 4 tries failed and the step still ended green. Now: the key alone first (a failed rebase is aborted and retried, and a
          # save that never lands goes red = a real issue), then the BOT C line on a fresh copy of the inbox.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Oct 30: the states rebuilt tonight come off the 'rebuild tonight' list (BOT A / BOT W / new parks / hand fixes add to it)
          # Oct 30: the states rebuilt tonight come off the 'rebuild tonight' list (BOT A / BOT W / new parks / hand fixes add to it)
          cat > /tmp/done-states.py <<'PY'
          import json, os, pathlib
          done = {s for g in json.loads(os.environ.get('GROUPS') or '[]') for s in g.get('states', '').split()}
          p = pathlib.Path('data/us-key/answers-states.txt')
          if p.exists() and done: p.write_text(' '.join(sorted(set(p.read_text().split()) - done)) + '\n')
          PY
          export GROUPS="$PLAN_GROUPS"
          python3 /tmp/done-states.py || echo '::error title=US key save::could not take tonight'"'"'s states off answers-states.txt'
          # Nov 2 review: save by overwrite. The files THIS run built (state files, index, layers, zip files, review pages, status)
          # are copied on top of the newest main; the hand-edited files (overrides, the ledger) are never copied back, and the
          # states list is worked out again on the newest copy. Red on failure. KPC_SAVE_MODE=rebase = the old way (still loud).
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_TRIES=6 \
            KPC_SAVE_SKIP="data/us-key/overrides.json data/us-key/answers-applied.json data/us-key/answers-states.txt" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'US answer key' 'python3 /tmp/done-states.py' -- data/us-key data/status
          if [ -s /tmp/botc-line.txt ]; then
            saved=0; for i in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              python3 -c "p='.claude/inbox/chat-11.md'; s=open(p).read(); l=open('/tmp/botc-line.txt').read(); open(p,'w').write(s.replace('## OPEN','## OPEN\n'+l,1))"
              git commit -qam 'BOT C: key check line for chat 11' && git push -q && { saved=1; break; }
              sleep $((i*7))
            done; [ "$saved" = 1 ] || echo "::warning title=Save::the line for the inbox was not saved after every try"
          fi
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
