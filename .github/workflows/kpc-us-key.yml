        run: python3 .github/scripts/kpc_key_freeze.py stamp us-key | tail -1 > /tmp/build-id.txt; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || { kpc_rc=$?; echo "::warning title=kpc_key_freeze.py::stopped with an error (exit $rc), see the log above"; echo "kpc_key_freeze.py - stopped with an error (exit $rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: BOT C line for chat 11 (HQ Oct 30) - this build vs the LIVE key, one line in its inbox
        id: kept_green_3
        continue-on-error: true
