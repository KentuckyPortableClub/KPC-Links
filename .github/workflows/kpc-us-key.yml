          # proposals); the answer sheet (KPC-Data, read only, sparse) exempts joins a person signed off. KPC_JOIN_HOLD=mark = v1.
          # v2.1 (Quality): READ-ONLY, PUBLIC, NO TOKEN: an anonymous https clone (no credential helper, no auth header, no prompt),
          # never pushed, removed after the check; a failed read is LOUD (answer-sheet exemptions empty = more joins held, fail-safe)
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .as 2>/dev/null && git -C .as sparse-checkout set --no-cone data/answer-sheet 2>/dev/null && git -C .as checkout -q 2>/dev/null || { kpc_rc=$?; echo "::error title=Join check::KPC-Data answer sheet (public, read-only) not read (exit $kpc_rc): its exemptions are empty this build (more joins held)"; echo "Join check - KPC-Data answer sheet not read (exit $kpc_rc): its exemptions are empty this build (more joins held)" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          python3 .github/scripts/kpc_join_check.py || { kpc_rc=$?; echo "::warning title=Join check::stopped (exit $kpc_rc); the key build is not affected"; }
