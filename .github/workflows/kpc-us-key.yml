name: KPC US answer key
# Every state but KY: POTA parks joined to official land (USGS PAD-US) only when name + kind match; the rest goes on review lists.
on:
  schedule:
    - cron: '37 9 1 * *'   # monthly
  workflow_dispatch:
    inputs:
      states:
        description: 'States (blank = all but KY), e.g. TN IN OH'
        default: ''
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-us-key
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - name: Build the answer key
        env:
          STATES: ${{ inputs.states }}
          MINUTES: '300'
        run: python3 .github/scripts/kpc_us_key.py 2>&1 | tee us-key.log
      - name: Review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_us_key_issue.py
      - name: Save
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/us-key 2>/dev/null || true
          git add data/status 2>/dev/null || true   # Oct 25 storage plan: when each file last changed
          if ! git diff --cached --quiet; then
            git commit -m 'US answer key'
            for i in 1 2 3 4; do git pull --rebase --autostash && git push && break; sleep $((i*7)); done
          fi
