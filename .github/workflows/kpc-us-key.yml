          # all 4 tries failed and the step still ended green. Now: the key alone first (a failed rebase is aborted and retried, and a
          # save that never lands goes red = a real issue), then the BOT C line on a fresh copy of the inbox.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Oct 30: the states rebuilt tonight come off the 'rebuild tonight' list (BOT A / BOT W / new parks / hand fixes add to it)
          # Nov 3 (Brandon YES 5:29 PM): the list was NEVER cleared: GROUPS is a reserved bash variable (the user's group ids), so
          # 'export GROUPS=...' did nothing and python read nothing. Now KPC_DONE_GROUPS. And only a FINISHED build clears it: this run's
          # stamp (US-<run id>) must be in data/us-key/index.json; parts named 'failed' in the stamp stay on the list.
          python3 - <<'PY' || { kpc_rc=$?; echo "::warning title=Rebuild list::the 'rebuild tonight' list was not cleared (exit $kpc_rc); the next finished build clears it"; echo "Rebuild list - the 'rebuild tonight' list was not cleared (exit $kpc_rc); the next finished build clears it" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # next round C4: was '|| true'
          import json, os
          try: d = json.load(open('data/us-key/index.json', encoding='utf-8'))
          except Exception: d = {}
          if str(d.get('build') or '') == f"US-{os.environ.get('GITHUB_RUN_ID')}":
              open('/tmp/kpc-us-build-finished', 'w').write(' '.join(d.get('failed') or []))
              print(f"::notice title=US key save::build {d.get('build')} finished: its states come off answers-states.txt")
          else:
              print(f"::warning title=US key save::no finished build stamp for this run (index says {d.get('build')!r}): answers-states.txt is kept")
          PY
          cat > /tmp/done-states.py <<'PY'
          import json, os, pathlib
          ok = pathlib.Path('/tmp/kpc-us-build-finished')
          failed = set(ok.read_text().split()) if ok.exists() else set()
          done = {s for g in json.loads(os.environ.get('KPC_DONE_GROUPS') or '[]') for s in g.get('states', '').split()} - failed
          p = pathlib.Path('data/us-key/answers-states.txt')
          if ok.exists() and p.exists() and done: p.write_text(' '.join(sorted(set(p.read_text().split()) - done)) + '\n')
          PY
          export KPC_DONE_GROUPS="$PLAN_GROUPS"
          python3 /tmp/done-states.py || echo '::error title=US key save::could not take tonight'"'"'s states off answers-states.txt'
          # Nov 2 review: save by overwrite. The files THIS run built (state files, index, layers, zip files, review pages, status)
          # are copied on top of the newest main; the hand-edited files (overrides, the ledger) are never copied back, and the
          # states list is worked out again on the newest copy. Red on failure. KPC_SAVE_MODE=rebase = the old way (still loud).
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_TRIES=6 \
            KPC_SAVE_SKIP="data/us-key/overrides.json data/us-key/answers-applied.json data/us-key/answers-states.txt" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'US answer key' 'python3 /tmp/done-states.py' -- data/us-key data/status
          if [ -s /tmp/botc-line.txt ]; then
            saved=0; for i in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              python3 -c "p='.claude/inbox/chat-11.md'; s=open(p).read(); l=open('/tmp/botc-line.txt').read(); open(p,'w').write(s.replace('## OPEN','## OPEN\n'+l,1))"
              git commit -qam 'BOT C: key check line for chat 11' && git push -q && { saved=1; break; }
              sleep $((i*7))
            done; [ "$saved" = 1 ] || { kpc_rc=$?; echo "::warning title=Save::the line for the inbox was not saved after every try"; echo "Save - the line for the inbox was not saved after every try" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          fi
