name: zz POTA activity by program (temporary)
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: |
          cat > r.py <<'P'
          import json, urllib.request, time, collections
          def get(u):
              for i in range(3):
                  try:
                      return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'KPC'}), timeout=60))
                  except Exception as e: time.sleep(3)
              return None
          locs = get('https://api.pota.app/locations') or []
          print('::notice title=keys::' + json.dumps(locs[0])[:300])
          P = collections.defaultdict(lambda: [0, 0, 0, 0])  # parks, activated parks, activations, qsos
          shown = False
          for L in locs:
              d = L.get('descriptor') or L.get('locationDesc') or ''
              pre = d.split('-')[0]
              rows = get('https://api.pota.app/location/parks/' + d) or []
              if rows and not shown: print('::notice title=parkkeys::' + json.dumps(rows[0])[:400]); shown = True
              for p in rows:
                  a = p.get('activations') or 0; P[pre][0] += 1; P[pre][1] += 1 if a else 0; P[pre][2] += a; P[pre][3] += p.get('qsos') or 0
              time.sleep(0.15)
          top = sorted(P.items(), key=lambda kv: -kv[1][2])
          out = [[k] + v for k, v in top]
          json.dump(out, open('rank.json', 'w'))
          for i in range(0, 60, 12):
              print('::notice title=rank %d::' % i + ' | '.join(f'{k}: {v[2]:,} acts, {v[0]:,} parks ({v[1]:,} activated)' for k, v in top[i:i+12]))
          P
          python3 r.py
