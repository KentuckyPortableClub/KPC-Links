name: KPC POTA Discord Spotter
# Posts to Discord (and the Facebook Page) when a KPC operator is on the air.
#  - One alert when an operator first shows up at a park.
#  - One more alert only if they change band or mode (re-spots on the same band are ignored).
#  - Looks back 60 minutes, so a late check doesn't miss anyone.
# Oct 28 2026 (HQ, Fable's limits plan item 5): ONE job an hour that checks 12 times, 5 minutes apart (was 288 separate
# runs a day). Same posts. Sent alerts are written to the state file after every check, so nothing is posted twice, and the
# file is saved once at the end of the hour, only if it changed. Never fails (a failed run emails Brandon).
on:
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-pota-spots
  cancel-in-progress: false
jobs:
  spot:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Check POTA 12 times, 5 minutes apart, and notify Discord
        continue-on-error: true
        timeout-minutes: 57
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          stop=$(( $(date +%s) + 54 * 60 ))          # finish before the next hour's job starts
          for i in $(seq 1 12); do
            python3 .github/scripts/kpc_pota_spotter.py || echo "check $i: skipped (POTA or Discord hiccup)"
            [ "$i" -lt 12 ] || break
            [ $(( $(date +%s) + 300 )) -lt "$stop" ] || break
            sleep 300
          done
      - name: Save sent spot IDs (once, only if changed)
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/kpc-pota-spot-state.json
          git diff --cached --quiet && exit 0
          git commit -qm 'Update KPC POTA spot notification state'
          for i in 1 2 3 4; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i*10)); done; exit 0
