name: KPC POTA Discord Spotter
# Posts to Discord (and the Facebook Page) when a KPC operator is on the air.
#  - One alert when an operator first shows up at a park.
#  - One more alert only if they change band or mode (re-spots on the same band are ignored).
#  - Looks back 60 minutes, so a late check doesn't miss anyone.
# Oct 28 2026 (HQ, Fable's limits plan item 5): ONE job an hour that checks 12 times, 5 minutes apart (was 288 separate
# runs a day). Same posts. Sent alerts are written to the state file after every check, so nothing is posted twice, and the
# file is saved once at the end of the hour, only if it changed. Never fails (a failed run emails Brandon).
on:
  schedule:
    - cron: '19 * * * *'   # Nov 1: moved off the busy top of the hour (GitHub dropped runs for hours)   # G9 Nov 2: was '17 * * * *' (spread the start times; now 2 min later)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-pota-spots
  cancel-in-progress: false
jobs:
  spot:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Check POTA 12 times, 5 minutes apart, and notify Discord
        id: kept_green_1
        continue-on-error: true
        timeout-minutes: 57
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          stop=$(( $(date +%s) + 54 * 60 ))          # finish before the next hour's job starts
          ok=0; bad=0
          for i in $(seq 1 12); do
            if python3 .github/scripts/kpc_pota_spotter.py; then ok=$((ok+1)); else bad=$((bad+1)); echo "::warning title=POTA spotter::check $i failed (POTA or Discord hiccup); the next check tries again"; fi
            [ "$i" -lt 12 ] || break
            [ $(( $(date +%s) + 300 )) -lt "$stop" ] || break
            sleep 300
          done
          # PR3 (Nov 2): one hiccup is normal, but EVERY check of the hour failing means spots are not reaching Discord
          # (a dead webhook secret, POTA's feed changed, a bug). Say it as an ::error so the key-bot sweep shows it red.
          # Still green (no failure email).
          if [ "$ok" = 0 ]; then echo "::error title=POTA spotter::all $bad checks this hour failed: no spots reached Discord. See the log above"; fi
      - name: Save sent spot IDs (once, only if changed)
        if: always()
        id: kept_green_2
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Nov 11 (bots review, package E): the shared helper (this run's file copied on top of the newest main, five tries) instead of
          # 'pull --rebase' four times. A lost push race here meant the next hour's job started without the sent-spot list and posted the
          # same operators again (the look-back is 60 minutes). Nothing changed = nothing committed, as before. The state file is not
          # bookkeeping for the quiet gate (it is outside data/status), so a save is never skipped.
          git add .github/kpc-pota-spot-state.json
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'Update KPC POTA spot notification state' - -- .github/kpc-pota-spot-state.json
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
