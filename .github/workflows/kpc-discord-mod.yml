name: KPC Discord mod
# BY HAND ONLY - no timer, so this never runs unless somebody asks for it here.
#   who  = list everybody who has posted lately, with the id to paste below (POSTS to the staff room)
#   check= the same look at roles and permissions, but posts NOTHING anywhere (for Claude's own checks)
#   do   = mute / unmute / kick / ban one person. Kick and ban also need the confirm box ticked.
# Day to day none of this is needed: say 'help' in the staff room and the bot answers there instead.
# The automatic side (delete obvious spam + a one-hour mute, nothing else) rides on the Discord relay job.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'who = list people and their ids; do = act on one person'
        type: choice
        options: [who, do, commands, check]
        default: who
      user_id:
        description: 'For "do": the person''s Discord id (get it from mode "who")'
        default: ''
      action:
        description: 'For "do": what to do'
        type: choice
        options: [mute, unmute, kick, ban]
        default: mute
      minutes:
        description: 'For mute: how many minutes (max 40320 = 28 days)'
        default: '60'
      why:
        description: 'Reason, for our own record and Discord''s audit log'
        default: ''
      confirm:
        description: 'Tick this to really kick or ban. Mute and unmute do not need it.'
        type: boolean
        default: false
      dry_run:
        description: 'Practice run: say what would happen, change nothing'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kpc-discord-mod
  cancel-in-progress: false
jobs:
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Do it
        id: kept_green_1
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KPC_ADMIN_WEBHOOK: ${{ secrets.KPC_ADMIN_WEBHOOK }}
          KPC_DISCORD_WEBHOOK: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          MODE: ${{ inputs.mode }}
          USER_ID: ${{ inputs.user_id }}
          ACTION: ${{ inputs.action }}
          MINUTES: ${{ inputs.minutes }}
          WHY: ${{ inputs.why }}
          CONFIRM: ${{ inputs.confirm && 'yes' || 'no' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          echo "::notice title=Mod::started, mode=$MODE action=$ACTION"
          python3 .github/scripts/kpc_discord_mod.py || { kpc_rc=$?; echo "::error title=kpc_discord_mod.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_discord_mod.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
