name: KPC new references
# Every day: new POTA parks, KFF references and SOTA summits in the US (kpc_new_refs.py).
# They show for 7 days on Park Notes (Kentucky) and Park Notes: Other States.
# Kentucky ones are also posted to Discord, Facebook and Club News, starting Oct 21 2026, 5 PM Central.
# Oct 23: it also keeps the Finder's search lists (locations.json / locations-ky.json) current, and a Kentucky park
# POTA RETIRES is taken off every site list the same morning (kpc_retired_sweep.py) + a Discord note + issue comment.
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  schedule:
    - cron: '39 12 * * *'   # G9 Nov 2: was '41 12 * * *' (spread the start times; now 2 min earlier)
  workflow_dispatch:
    inputs:
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (show what is new, do not write or post)'
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
  actions: write   # Oct 23: reprint the guide PDFs the day a Kentucky park is retired
concurrency:
  group: kpc-new-refs
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - name: Look for new references
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          KPC_PARKS_WEBHOOK: ${{ secrets.KPC_PARKS_WEBHOOK }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ ((github.event_name == 'workflow_dispatch' && !inputs.as_schedule) && inputs.dry_run) && '1' || '' }}
        run: python3 .github/scripts/kpc_new_refs.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/kpc_new_fable_rows.py || echo "::error title=kpc_new_fable_rows.py::stopped with an error (exit $?), see the log above"
          # Oct 30 (HQ 7:40 AM NEW-PARK PIPELINE): a new US / CA park goes on that night's key rebuild list (BOT B / the nightly Canada run)
          python3 - <<'PY' || echo "::error title=inline Python::stopped with an error (exit $?), see the log above"
          import json, datetime, pathlib
          today = datetime.date.today().isoformat(); us, ca = set(), set()
          for x in (json.load(open('kpc-new-refs.json')).get('items') or []):
              if x.get('prog') != 'pota' or x.get('found') != today: continue
              r = str(x.get('ref', ''))
              for s in x.get('st') or []:
                  (us if r.startswith('US-') else ca if r.startswith('CA-') else set()).add(str(s).upper().replace('CA-', '').replace('US-', '')[:2])
          for f, new in (('data/us-key/answers-states.txt', us - {'KY'}), ('data/ca-key/answers-provinces.txt', ca)):
              if new:
                  p = pathlib.Path(f); old = set(p.read_text().split()) if p.exists() else set(); p.write_text(' '.join(sorted(old | new)) + '\n')
                  print(f'::notice title=New parks::{f}: + {" ".join(sorted(new))} (rebuilt tonight)')
          PY
          for f in data/us-key/answers-states.txt data/ca-key/answers-provinces.txt; do [ -e "$f" ] && git add "$f"; done; true   # Oct 30 (HQ 7:40 AM (b)): a new US / CA park with no outline gets its Fable-book row
          git add .claude/build/research/fable 2>/dev/null || true   # ok: an optional path may not exist
          git add data/new-refs kpc-new-refs.json kpc-announcements.json locations.json locations-ky.json
          git add data/retired-refs.json 2>/dev/null || true   # ok: an optional path may not exist
          git add data/status 2>/dev/null || true   # ok: an optional file or tidy step (Oct 25 storage plan: when each file last changed)
          git add -A kpc-ky-data.json kpc-guide-*-data.json wwff-unmapped.json ky-*.geojson app/packs KPC_Kentucky_*.kml KPC_Kentucky_*.gpx kpc-top25.json data/ky-retired.json || true   # ok: an optional path may not exist
          # Nov 2 review (G7): save with the shared helper (shared with another workflow (kpc-announcements.json, kpc-ky-data.json, kpc-top25.json, locations-ky.json, locations.json): merged the old way, but loud). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE=rebase KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh 'New references' - -- data/us-key/answers-states.txt data/ca-key/answers-provinces.txt .claude/build/research/fable data/new-refs kpc-new-refs.json kpc-announcements.json locations.json locations-ky.json data/retired-refs.json data/status kpc-ky-data.json wwff-unmapped.json app/packs kpc-top25.json data/ky-retired.json $(ls kpc-guide-*-data.json ky-*.geojson KPC_Kentucky_*.kml KPC_Kentucky_*.gpx 2>/dev/null)
      - name: Reprint the guide PDFs when a Kentucky park was retired
        if: always()
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/kpc-reprint ]; then gh api -X POST repos/${{ github.repository }}/actions/workflows/kpc-guide-pdf.yml/dispatches -f ref=main || echo "::error title=start the next run::could not start the next run (exit $?); the chain stops here"; fi
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
