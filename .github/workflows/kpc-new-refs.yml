name: KPC new references
# Every day: new POTA parks, KFF references and SOTA summits in the US (kpc_new_refs.py).
# They show for 7 days on Park Notes (Kentucky) and Park Notes: Other States.
# Kentucky ones are also posted to Discord, Facebook and Club News, starting Oct 21 2026, 5 PM Central.
on:
  schedule:
    - cron: '41 12 * * *'
    - cron: '5 22 21 10 *'   # go-live evening, 5:05 PM Central
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show what is new, do not write or post)'
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-new-refs
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Look for new references
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          KPC_PARKS_WEBHOOK: ${{ secrets.KPC_PARKS_WEBHOOK }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: python3 .github/scripts/kpc_new_refs.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/new-refs kpc-new-refs.json kpc-announcements.json
          if ! git diff --cached --quiet; then
            git commit -m 'New references'
            for i in 1 2 3 4; do git pull --rebase --autostash && git push && break; sleep $((i*7)); done
          fi
