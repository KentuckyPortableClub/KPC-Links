name: KPC 2-fer and hours publish (off until GO)
# Nov 2 review (G10). Puts REVIEWED Kentucky 2-fers on the map layer (ky-overlaps.geojson), the GPX and the 2-fer guide PDF,
# and fills empty hours / fee fields on the park pages (kpc-ky-hours.json) from the hours bot's official lines.
# Four repo variables, each off | preview | on, ALL OFF until Brandon says GO:
#   KPC_FERS_LAYER, KPC_FERS_GPX, KPC_FERS_PDF, KPC_HOURS_PUBLISH
# preview = the new files are attached to the run as a download (nothing on the site changes); on = the live files are saved.
# Started by hand only (Actions > this workflow > Run workflow). It reads KPC-Data; it never writes there. No internet look-ups.
on:
  # Nov 7 (round 4, item 6; OPTIONAL, inert while the four switches are off): when HQ writes new reviewed spots to kpc-fers-reviewed.json
  # (a push to main by a person; a bot's GITHUB_TOKEN push starts nothing), the 2-fer layer / GPX / guide PDF follow by themselves, each
  # by its own switch. The hours part is NOT started by this (it does not read the reviewed list). No cron.
  push:
    branches: [main]
    paths: ['kpc-fers-reviewed.json']
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only one part (layer, gpx, pdf, hours); empty = every part whose switch is not off'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-fers-publish
  cancel-in-progress: false
jobs:
  publish:
    # round 4 review: on a push of the reviewed list the job does not even start while the three 2-fer switches are off (a true no-op)
    if: ${{ github.event_name != 'push' || (vars.KPC_FERS_LAYER || 'off') != 'off' || (vars.KPC_FERS_GPX || 'off') != 'off' || (vars.KPC_FERS_PDF || 'off') != 'off' }}
    runs-on: ubuntu-latest
    env:
      KPC_FERS_LAYER: ${{ vars.KPC_FERS_LAYER || 'off' }}
      KPC_FERS_GPX: ${{ vars.KPC_FERS_GPX || 'off' }}
      KPC_FERS_PDF: ${{ vars.KPC_FERS_PDF || 'off' }}
      KPC_HOURS_PUBLISH: ${{ vars.KPC_HOURS_PUBLISH || 'off' }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the 2-fer and hours files from KPC-Data (read only)
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data kpc-data \
            && git -C kpc-data sparse-checkout set --no-cone data/fers/US-KY.json data/hours/US-KY.json \
            && git -C kpc-data checkout -q \
            || { echo "::error title=KPC-Data::could not read KPC-Data (exit $?); nothing was published"; exit 1; }
      - name: Tools for the guide PDF (only when its switch is not off)
        if: env.KPC_FERS_PDF != 'off'
        run: |
          sudo apt-get install -y -q fonts-crosextra-carlito fonts-crosextra-caladea >/dev/null || { echo "::error title=PDF fonts::the PDF fonts could not be installed (exit $?)"; exit 1; }
          pip install -q reportlab || { echo "::error title=reportlab::reportlab could not be installed (exit $?)"; exit 1; }
      - name: Build (layer, PDF, GPX, hours; each by its own switch)
        env:
          ONLY: ${{ inputs.only }}
        run: |
          rc=0
          for part in layer pdf gpx hours; do   # pdf before gpx: both read the same hand list
            [ -n "$ONLY" ] && [ "$ONLY" != "$part" ] && continue
            [ "${{ github.event_name }}" = push ] && [ "$part" = hours ] && continue   # round 4: a reviewed-list push never starts the hours part
            python3 .github/scripts/kpc_fers_publish.py "$part" --data kpc-data || { echo "::error title=$part::refused or stopped (exit $?); its file was not changed"; rc=1; }
          done
          exit $rc
      - name: Attach the previews to this run
        if: always() && hashFiles('preview/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kpc-publish-preview
          path: preview/
      - name: Save the live files (only parts switched on)
        run: |
          rm -rf preview kpc-data   # previews are never saved to the site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          F="ky-overlaps.geojson KPC_KY_POTA_2fers_3fers.gpx KPC_Kentucky_POTA_2fers_3fers_Guide.pdf kpc-ky-hours.json .claude/build/fers/fers.json"
          if git diff --quiet -- $F; then echo "::notice title=Publish::no live file changed"; exit 0; fi
          git add -- $F
          # hand-edited files: rebase mode, so a newer hand edit on main is never overwritten (a clash stops loudly)
          KPC_SAVE_MODE=rebase KPC_SAVE_RED=yes \
            bash .github/scripts/kpc_save_overwrite.sh 'Publish reviewed 2-fers / hours (G10)' - -- $F
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
