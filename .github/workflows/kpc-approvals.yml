name: KPC Approvals email
# Every day at 4 PM Kentucky time: one email AND one Discord post listing every form post waiting for YES/NO in its sheet.
# Two times are listed because of daylight saving; the script only sends when it is 4 PM in Kentucky.
on:
  schedule:
    - cron: '2 21 * * *'
    - cron: '2 22 * * *'
  workflow_dispatch:
    inputs:
      send_now:
        description: 'Send the email now, even if it is not 4 PM'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: kpc-approvals
  cancel-in-progress: false
jobs:
  approvals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every sheet and email the list
        env:
          FORCE: ${{ inputs.send_now }}
          KPC_CHECKS: data/kpc-checks-approvals.json
          RELAY_MAIL_URL: ${{ secrets.RELAY_MAIL_URL }}
          RELAY_MAIL_KEY: ${{ secrets.RELAY_MAIL_KEY }}
          APPROVAL_EMAIL: ${{ secrets.APPROVAL_EMAIL }}
          NOTES_SHEET_CSV: ${{ secrets.NOTES_SHEET_CSV }}
          COMMUNITY_SHEET_CSV: ${{ secrets.COMMUNITY_SHEET_CSV }}
          CAMPGROUND_SHEET_CSV: ${{ secrets.CAMPGROUND_SHEET_CSV }}
          KPC_REPORTS_CSV: ${{ secrets.KPC_REPORTS_CSV }}
          KPC_ACTIVATIONS_CSV: ${{ secrets.KPC_ACTIVATIONS_CSV }}
          KPC_GUESTBOOK_CSV: ${{ secrets.KPC_GUESTBOOK_CSV }}
          KPC_DISCORD_WEBHOOK: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          KPC_ADMIN_WEBHOOK: ${{ secrets.KPC_ADMIN_WEBHOOK }}
          KPC_CWBOARD_CSV: ${{ secrets.KPC_CWBOARD_CSV }}
        run: python3 .github/scripts/kpc_approvals.py
      - name: Save the license-lookup cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -e data/kpc-checks-approvals.json ]; then git add data/kpc-checks-approvals.json; fi
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'Approvals: license lookup cache' - -- data/kpc-checks-approvals.json
