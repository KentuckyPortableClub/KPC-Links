name: KPC refine saved Canada outlines (by hand, temporary)
# Oct 29 2026 (chat 2; Brandon 7:07 AM 'yes send it'): re-read every saved Canada outline (data/canada-bounds) at ~5 m from its
# own official records; resumable; deleted once every file carries detail_m. Never fails.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only this many files (0 = all left)'
        default: '40'
permissions:
  contents: write
concurrency:
  group: kpc-canada-bounds
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v5
      - name: Refine
        continue-on-error: true
        env:
          LIMIT: ${{ inputs.limit }}
          MINUTES: '160'
        run: |
          pip install --quiet --break-system-packages shapely || pip install --quiet shapely || true
          python3 .github/scripts/kpc_ca_refine_bounds.py || true
      - name: Save
        continue-on-error: true
        run: bash .github/scripts/kpc_push_data.sh . 'Canada outlines refined to ~5 m (read only from the official maps)' data/canada-bounds || true
