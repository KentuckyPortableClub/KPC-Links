name: KPC temp probe (delete after use)
# One-off: how do the Forest Service and Kentucky Fish & Wildlife publish park closures? Writes findings to the
# 'probe' branch (not main). Never fails, never emails.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-probe-tmp
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Look around
        continue-on-error: true
        run: |
          mkdir -p probe-out
          python3 - <<'PY' || true
          import json, pathlib, re, urllib.request
          OUT = pathlib.Path('probe-out'); OUT.mkdir(exist_ok=True)
          UA = {'User-Agent': 'KPC club bot (kentuckyportableclub.github.io)'}
          L = []
          def say(s): L.append(str(s)); print(s, flush=True)
          def grab(u, name, cap=900000):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=90) as r:
                      b = r.read().decode('utf-8', 'replace')
                  say(f'{u} -> HTTP {r.status}, {len(b)} bytes')
                  (OUT / name).write_text(b[:cap], encoding='utf-8'); return b
              except Exception as e:
                  say(f'{u} -> FAILED {str(e)[:110]}'); return None

          say('== FOREST SERVICE: Daniel Boone + Land Between the Lakes ==')
          for u, n in [('https://www.fs.usda.gov/alerts/dbnf/alerts-notices', 'fs-dbnf-alerts.html'),
                       ('https://www.fs.usda.gov/alerts/lbl/alerts-notices', 'fs-lbl-alerts.html'),
                       ('https://www.fs.usda.gov/jsonapi/node/alert?filter[field-forest]=dbnf&page[limit]=50', 'fs-jsonapi.json'),
                       ('https://www.fs.usda.gov/jsonapi', 'fs-jsonapi-root.json')]:
              b = grab(u, n)
              if b and n.endswith('.html'):
                  # Drupal views usually render the rows in the page; see what an alert row looks like
                  rows = re.findall(r'(?is)<article[^>]*>(.{0,900}?)</article>', b)[:3]
                  if not rows:
                      rows = re.findall(r'(?is)<div class="views-row">(.{0,900}?)</div>\s*</div>', b)[:3]
                  say(f'   rows found: {len(rows)}')
                  for r_ in rows[:2]:
                      say('   ROW: ' + re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', r_))[:260])

          say('')
          say('== KENTUCKY FISH & WILDLIFE ==')
          for u, n in [('https://fw.ky.gov/Pages/default.aspx', 'ky-fw-home.html'),
                       ('https://fw.ky.gov/Hunt/Pages/Wildlife-Management-Areas.aspx', 'ky-fw-wma.html'),
                       ('https://fw.ky.gov/Pages/Closures.aspx', 'ky-fw-closures.html'),
                       ('https://fw.ky.gov/Hunt/Pages/WMA-Closures.aspx', 'ky-fw-wmaclose.html'),
                       ('https://app.fw.ky.gov/wmafinder/', 'ky-fw-finder.html')]:
              b = grab(u, n)
              if b:
                  hits = sorted({re.sub(r'\s+', ' ', x)[:70] for x in
                                 re.findall(r'(?i)[^<>]{0,60}(?:closed|closure|alert|notice|advisory)[^<>]{0,60}', b)})[:5]
                  say('   words: ' + ' | '.join(hits))
          (OUT / 'report4.txt').write_text('\n'.join(L) + '\n', encoding='utf-8')
          print('::notice title=Probe4::' + (' // '.join(L[:3]))[:800])
          PY
      - name: Save to the probe branch
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan probe2
          git rm -rq --cached . || true
          find . -maxdepth 1 ! -name . ! -name .git ! -name probe-out -exec rm -rf {} + || true
          git add -f probe-out
          git commit -qm 'Probe findings 4' || true
          git push -f origin probe2 || true
