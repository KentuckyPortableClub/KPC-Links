name: KPC temp probe (delete after use)
# One-off: finds out (1) what the saved Facebook Page token is allowed to do, (2) how Kentucky State Parks
# and the National Park Service publish park alerts, so the closure watcher can be written against the real pages.
# Writes its findings to the 'probe' branch (NOT main, so the site is not rebuilt). Never fails, never emails.
# NOTHING PRIVATE IS WRITTEN: permission names and yes/no only, never comment text, names or the token itself.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-probe-tmp
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Look around
        continue-on-error: true
        run: |
          mkdir -p probe-out
          python3 - <<'PY' || true
          import json, pathlib, re, urllib.error, urllib.request
          OUT = pathlib.Path('probe-out'); OUT.mkdir(exist_ok=True)
          UA = {'User-Agent': 'KPC club bot (kentuckyportableclub.github.io)'}
          L = []
          def say(s): L.append(str(s)); print(s, flush=True)
          def get(u, t=60):
              with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=t) as r:
                  return r.status, r.read().decode('utf-8', 'replace')
          def try_get(u, name, cap=300000):
              try:
                  st, body = get(u); say(f'{u} -> HTTP {st}, {len(body)} bytes')
                  (OUT / name).write_text(body[:cap], encoding='utf-8'); return body
              except Exception as e:
                  say(f'{u} -> FAILED {str(e)[:110]}'); return None

          say('== KY PARKS: find the park pages ==')
          sm = try_get('https://parks.ky.gov/sitemap.xml', 'ky-sitemap.xml', 900000)
          urls = []
          if sm:
              urls = re.findall(r'<loc>\s*([^<\s]+)\s*</loc>', sm)
              say(f'sitemap entries: {len(urls)}')
              say('first few: ' + ' | '.join(urls[:5]))
              if urls and urls[0].endswith('.xml') and len(urls) < 60:
                  for sub in urls[:12]:
                      b = try_get(sub, 'ky-sub-' + re.sub(r'[^a-z0-9]+', '-', sub.lower())[-40:] + '.xml', 900000)
                      if b: urls += re.findall(r'<loc>\s*([^<\s]+)\s*</loc>', b)
                  say(f'after sub-sitemaps: {len(urls)} urls')
          parky = [u for u in urls if re.search(r'(?i)state-(park|resort)|/parks?/', u)][:400]
          say(f'park-looking urls: {len(parky)}')
          (OUT / 'ky-park-urls.txt').write_text('\n'.join(sorted(set(parky))) + '\n', encoding='utf-8')
          for u in sorted(set(parky))[:3]:
              try_get(u, 'ky-park-' + re.sub(r'[^a-z0-9]+', '-', u.split('ky.gov')[-1].lower()).strip('-')[:50] + '.html')
          say('')
          say('== KY: Sitefinity API guesses ==')
          for u in ['https://parks.ky.gov/restapi/search/suggestions?q=taylorsville',
                    'https://parks.ky.gov/api/default/parks',
                    'https://parks.ky.gov/api/default/alerts',
                    'https://parks.ky.gov/robots.txt']:
              try_get(u, 'ky-api-' + re.sub(r'[^a-z0-9]+', '-', u.split('ky.gov/')[-1].lower())[:40] + '.txt', 120000)
          (OUT / 'report2.txt').write_text('\n'.join(L) + '\n', encoding='utf-8')
          print('::notice title=Probe2::' + ' // '.join(L[-6:])[:900])
          PY
      - name: Save to the probe branch
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan probe
          git rm -rq --cached . || true
          find . -maxdepth 1 ! -name . ! -name .git ! -name probe-out -exec rm -rf {} + || true
          git add -f probe-out
          git commit -qm 'Probe findings' || true
          git push -f origin probe || true
