name: zz probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -D /tmp/h -o /tmp/b https://pota.app/; echo "::notice title=headers::$(tr -d '\r' < /tmp/h | grep -i 'content-security\|x-frame\|server' | tr '\n' ' ')"
          echo "::notice title=meta csp::$(grep -io '<meta[^>]*content-security[^>]*>' /tmp/b | head -2)"
