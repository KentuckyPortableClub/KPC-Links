name: zz probe
on: push
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          npm i world-atlas@2 topojson-client@3 >/dev/null
          node -e '
          const t=require("world-atlas/countries-50m.json"),tc=require("topojson-client");
          const f=tc.feature(t,t.objects.countries).features.filter(x=>["124","840","484","304"].includes(String(x.id)));
          const X=lo=>(lo+170)*4, Y=la=>(75-la)*4*1.25;
          const out={};
          for(const g of f){const polys=g.geometry.type==="Polygon"?[g.geometry.coordinates]:g.geometry.coordinates;let d="";
            for(const p of polys){const r=p[0].filter(([lo,la])=>lo<-50&&lo>-170&&la>14);if(r.length<8)continue;
              let s="",last=null;for(const [lo,la] of r){const x=Math.round(X(lo)),y=Math.round(Y(la));const k=x+","+y;if(k===last)continue;last=k;s+=(s?"L":"M")+x+" "+y}
              if((s.match(/L/g)||[]).length>=4)d+=s+"Z"}
            out[g.id]=d}
          require("fs").writeFileSync("na.json",JSON.stringify(out));console.log(Object.entries(out).map(([k,v])=>k+":"+v.length).join(" "))'
          git config user.name x; git config user.email x@x; git add na.json; git commit -qm na; git push
