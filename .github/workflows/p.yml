name: zz probe
on: push
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p pa && cd pa
          curl -sL https://pota.app/ -o index.html
          for f in $(grep -o 'src="[^"]*\.js"\|href="[^"]*\.js"' index.html | sed 's/.*="//;s/"//' | sort -u); do u=$f; case $u in http*) ;; /*) u=https://pota.app$u;; *) u=https://pota.app/$u;; esac; curl -sL "$u" -o "$(basename $f)"; done
          grep -oh '"[a-zA-Z0-9_./-]*\.js"' *.js | tr -d '"' | sort -u | head -400 > chunks.txt
          for c in $(cat chunks.txt); do b=$(basename $c); [ -f "$b" ] || curl -sfL "https://pota.app/js/$b" -o "$b" || curl -sfL "https://pota.app/$c" -o "$b" || true; done
          { echo "== stats/hunted"; grep -oh '.\{700\}stats/hunted.\{900\}' *.js | head -4
            echo "== huntedParkRefs"; grep -oh '.\{300\}huntedParkRefs.\{500\}' *.js | head -4
            echo "== Authorization"; grep -oh '.\{300\}Authorization.\{300\}' *.js | head -6
            echo "== idToken"; grep -oh '.\{200\}idToken.\{200\}' *.js | head -6
            echo "== apiBase"; grep -oh 'https://api[a-z0-9.-]*pota[a-z.]*[^"`]\{0,30\}' *.js | sort | uniq -c | head
          } > ../hunted.txt
          cd ..; git config user.name x; git config user.email x@x; git add hunted.txt; git commit -qm ep; git push
