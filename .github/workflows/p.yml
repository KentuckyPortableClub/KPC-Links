name: zz probe
on: push
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p pa && cd pa
          curl -sL https://pota.app/ -o index.html
          for f in $(grep -o 'src="[^"]*\.js"\|href="[^"]*\.js"' index.html | sed 's/.*="//;s/"//' | sort -u); do u=$f; case $u in http*) ;; /*) u=https://pota.app$u;; *) u=https://pota.app/$u;; esac; curl -sL "$u" -o "$(basename $f)"; done
          grep -oh '"[a-zA-Z0-9_./-]*\.js"' *.js | tr -d '"' | sort -u | head -400 > chunks.txt
          for c in $(cat chunks.txt); do b=$(basename $c); [ -f "$b" ] || curl -sfL "https://pota.app/js/$b" -o "$b" || curl -sfL "https://pota.app/$c" -o "$b" || true; done
          { for k in 'award/progress' 'achievements/progress' 'achievements/geographic' 'achievements/earned' 'hunted_activated_list' 'awards/progress' ; do echo "== $k"; grep -oh ".\{600\}$k.\{1500\}" *.js | head -3; done
            echo "== award names"; grep -oh '"[A-Za-z ]*[Oo]perator to [Oo]perator[^"]*"\|[a-zA-Z]*[Ee]agle[a-zA-Z]*\|"[A-Z][A-Za-z ]\{3,30\}Award[^"]\{0,30\}"' *.js | sort | uniq -c | sort -rn | head -80
            echo "== award keys"; grep -oh '.\{200\}repeatOffenderHunterDesc.\{2500\}' *.js | head -2
          } > ../awards.txt
          cd ..; git config user.name x; git config user.email x@x; git add awards.txt; git commit -qm ep; git push
