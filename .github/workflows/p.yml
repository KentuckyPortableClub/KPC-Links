name: zz probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://api.pota.app/programs -o /tmp/p; python3 -c "
          import json;d=json.load(open('/tmp/p'));print('::notice title=programs::'+str(len(d))+' '+json.dumps(d[:3])[:600])"
          curl -s -D /tmp/h -o /dev/null -H 'Origin: https://x.github.io' https://api.pota.app/programs; grep -i access-control /tmp/h | sed 's/^/::notice title=cors::/'
          curl -s https://api2.sota.org.uk/api/associations -o /tmp/s; python3 -c "
          import json;d=json.load(open('/tmp/s'));print('::notice title=sota::'+str(len(d))+' '+json.dumps(d[:2])[:700])"
          curl -s -D /tmp/h2 -o /dev/null -H 'Origin: https://x.github.io' https://api2.sota.org.uk/api/associations; grep -i access-control /tmp/h2 | sed 's/^/::notice title=sotacors::/'
          curl -s https://api.pota.app/spot/activator -o /tmp/a; python3 -c "
          import json;d=json.load(open('/tmp/a'));print('::notice title=spot::'+json.dumps(d[0])[:600])"
