name: zz probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://spothole.app/api/v1/spots?limit=1000&max_age=3600" "https://spothole.app/api/v1/spots?limit=2000&max_age=3600" "https://spothole.app/api/v1/spots"; do
          curl -s -D /tmp/h -o /tmp/b -w "%{http_code} %{size_download} %{time_total}" -H 'Origin: https://kentuckyportableclub.github.io' "$u" > /tmp/c; echo "::notice title=$u::$(cat /tmp/c) $(grep -i 'access-control\|content-type' /tmp/h | tr -d '\r' | tr '\n' ' ') $(head -c 300 /tmp/b)"; done
          python3 -c "
          import json,time;d=json.load(open('/tmp/b'));d=d if isinstance(d,list) else d.get('spots',d);print('::notice title=times::',type(d).__name__,len(d),[ (x.get('time'),x.get('source'),x.get('sig')) for x in d[:5]], time.time())"
