name: KPC saved shapes (world + Canada)
# The world and Canada half of 'KPC saved shapes': downloads each country's official outlines ONCE, finer than the
# live runs ever have (~220 m instead of ~1.1 km, and 250 points a ring instead of 60; Canada ~220 m instead of
# ~2.2 km), and keeps them as files on the 'boundary-cache' release - never in the repo.
# Brandon Oct 22: 'keep 19 busy' -> 12 at a time, leaving room for the relay, park alerts and app builds that share
# the club's 20 GitHub slots. Each country is its own government server, so the width hurts nobody, and no job here
# pushes to the repo, so the jobs cannot collide with each other or with the other bots. Never fails.
on:
  schedule:
    - cron: '43 9 4 * *'          # the 4th of each month (the US one runs on the 3rd)   # G9 Nov 2: was '47 9 4 * *' (spread the start times; now 4 min earlier)
  workflow_dispatch:
    inputs:
      countries:
        description: 'Only these (blank = every country + CA). CA = all of Canada.'
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-world-cache
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - name: Make sure the release exists
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view boundary-cache -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create boundary-cache -R "$GITHUB_REPOSITORY" --prerelease --title 'Saved park outlines' \
            --notes 'Official land outlines saved for the boundary answer keys. Not a release of anything.' || { kpc_rc=$?; echo "::warning title=Release::the saved-shapes release could not be made (exit $kpc_rc)"; echo "Release - the saved-shapes release could not be made (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - uses: actions/checkout@v5   # Nov 7 (world fix part A): only to read data/world-key/sheet-countries.json for the list
        with:
          sparse-checkout: data/world-key
      - name: The list
        id: l
        env:
          WANT: ${{ inputs.countries }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          # Nov 7 (world fix part A): + CO ZA CL and Brandon's sheet countries (AX DO ...), the same list the world key builds, so a
          # single-host country has a saved copy for the source fallback (a failed source no longer HOLDs it). CA stays last.
          try: SHEETC = sorted((json.load(open('data/world-key/sheet-countries.json', encoding='utf-8')).get('countries') or {}).keys())
          except Exception: SHEETC = []  # noqa: BLE001
          ALL = list(dict.fromkeys('AU DE GB JP PL ES FR CH AT NL PT SE CZ SI NO RO IT BE DK FI HU SK HR IE LT LV EE LU CO ZA CL'.split() + SHEETC + ['CA']))
          want = (os.environ.get('WANT') or '').upper().replace(',', ' ').split() or ALL
          print('list=' + json.dumps(want))
          PY
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
  fetch:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        cc: ${{ fromJSON(needs.prepare.outputs.list) }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - name: Download and save ${{ matrix.cc }}
        id: kept_green_2
        continue-on-error: true
        env:
          GEO_CACHE_MODE: refresh
          GEO_DETAIL: '0.002'
          GEO_THIN: '250'
          CC: ${{ matrix.cc }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Owner rule, 2026-11-10: start from the release copy and keep it in .against, so the upload sends only a copy that holds at
          # least as many records, per source (save-check)
          if [ "$CC" = "CA" ]; then n=CA-ALL.json.gz; d=cache/ca; else n="W-$CC.json.gz"; d=cache/world; fi
          mkdir -p "$d" .against
          gh release view boundary-cache -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > .against/ASSETS.txt || { rm -f .against/ASSETS.txt; echo "::warning title=Saved shapes $CC::the release asset list could not be read: nothing is uploaded this run"; }
          if grep -qx "$n" .against/ASSETS.txt 2>/dev/null; then
            gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p "$n" -D .against --clobber && cp ".against/$n" "$d/" || { kpc_rc=$?; echo "::warning title=Saved shapes $CC::the release copy could not be downloaded (exit $kpc_rc): not uploaded this run"; echo "Saved shapes $CC - release copy not downloaded (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          fi
          touch .against/T0
          pip install --quiet --break-system-packages pykakasi pyshp || pip install --quiet pykakasi pyshp || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          # Nov 12 (KPC owner, 2026-11-12): owner hand-W-$CC.<layer>.geojson.gz files (repo checkout, and any on the
          # boundary-cache release) are keep-bigger merged into the saved copy AFTER T0, so a blocked live refresh that
          # does not wsave still leaves a fuller copy for save-check / upload. The world key is not edited (no rules-hash move).
          if [ "$CC" != "CA" ]; then
            mkdir -p "$RUNNER_TEMP/world-hand" "$RUNNER_TEMP/world-hand-release"
            if ls "data/outlines/hand/hand-W-${CC}."*.geojson.gz >/dev/null 2>&1; then
              cp "data/outlines/hand/hand-W-${CC}."*.geojson.gz "$RUNNER_TEMP/world-hand/"
            fi
            # Quality #179 M7: download release hand files to a staging dir. Prefer the repo copy of the
            # same name; never let --clobber replace it, and never place a file whose area is not W-$CC.
            if [ -f .against/ASSETS.txt ] && grep -E -q "^hand-W-$CC\." .against/ASSETS.txt; then
              gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p "hand-W-$CC.*.geojson.gz" -D "$RUNNER_TEMP/world-hand-release" --clobber || { kpc_rc=$?; echo "::warning title=Saved shapes $CC::release hand files could not be downloaded (exit $kpc_rc): repo hand files, if any, are still applied"; echo "Saved shapes $CC - release hand files not downloaded (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
              for f in "$RUNNER_TEMP/world-hand-release"/"hand-W-${CC}."*.geojson.gz; do
                [ -f "$f" ] || continue
                bn=$(basename "$f")
                case "$bn" in
                  hand-W-"$CC".*)
                    if [ -e "$RUNNER_TEMP/world-hand/$bn" ]; then
                      echo "::notice title=Saved shapes $CC::kept the repo copy of $bn (release file not clobbered)"
                    else
                      cp "$f" "$RUNNER_TEMP/world-hand/"
                    fi
                    ;;
                  *)
                    echo "::warning title=Saved shapes $CC::ignored $bn: not a W-$CC hand file"
                    ;;
                esac
              done
            fi
            if ls "$RUNNER_TEMP/world-hand"/"hand-W-${CC}."*.geojson.gz >/dev/null 2>&1; then
              echo '[]' > "$RUNNER_TEMP/world-hand-parks.json"
              python3 .github/scripts/kpc_master_cli.py fill --cache "$d" --states '' --areas "W-$CC" --hand "$RUNNER_TEMP/world-hand" --root data/outlines --parks "$RUNNER_TEMP/world-hand-parks.json" --work "$RUNNER_TEMP/world-hand-work" --offline --no-key || { kpc_rc=$?; echo "::warning title=Saved shapes $CC::owner hand files were not merged (exit $kpc_rc)"; echo "Saved shapes $CC - owner hand files were not merged (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
            fi
          fi
          if [ "$CC" = "CA" ]; then
            python3 .github/scripts/kpc_ca_key.py || echo "::notice title=Saved shapes CA::stopped with an error"
          else
            COUNTRIES=$CC python3 .github/scripts/kpc_world_key.py || echo "::notice title=Saved shapes $CC::stopped with an error"
          fi
      - name: Put it on the release
        id: kept_green_3
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(find cache/world/W-${{ matrix.cc }}.json.gz cache/ca/CA-ALL.json.gz -newer .against/T0 2>/dev/null | head -1)
          [ -n "$f" ] || { echo "::notice title=Saved shapes ${{ matrix.cc }}::nothing new saved"; exit 0; }
          # owner rule, 2026-11-10: only a copy that passes the gate baseline and holds at least the release copy's records
          python3 .github/scripts/kpc_master_cli.py save-check --against .against --assets .against/ASSETS.txt --first-ok "$f" || { kpc_rc=$?; echo "::error title=Saved shapes ${{ matrix.cc }}::save-check refused $(basename "$f") (named above): not uploaded"; echo "Saved shapes ${{ matrix.cc }} - save-check refused $(basename "$f")" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit 0; }
          gh release upload boundary-cache "$f" -R "$GITHUB_REPOSITORY" --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          echo "::notice title=Saved shapes ${{ matrix.cc }}::uploaded $(basename "$f") ($(du -h "$f" | cut -f1))"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
