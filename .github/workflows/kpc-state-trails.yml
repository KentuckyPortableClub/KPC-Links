name: KPC state trails (POTA trail parks)
# Monthly: lines for State Trails, National Recreation Trails and rail-trail state parks that are POTA parks.
on:
  schedule:
    - cron: '29 7 4 * *'
  workflow_dispatch:
    inputs:
      states:
        description: 'States (blank = TN IN OH WV VA MO IL NC GA AL MI PA). Oct 18: official agency layers come before OpenStreetMap'
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-state-trails
  cancel-in-progress: false
jobs:
  trails:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Build trail lines
        env:
          STATES: ${{ inputs.states }}
        run: python3 .github/scripts/kpc_state_trails.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/trails
          if ! git diff --cached --quiet; then
            git commit -m 'State trails: POTA trail parks'
            # Oct 18: two runs back to back conflicted on index-state.json (exit 128): keep THIS run's files and retry
            for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && break; git rebase --abort 2>/dev/null || true; sleep 10; done
          fi
