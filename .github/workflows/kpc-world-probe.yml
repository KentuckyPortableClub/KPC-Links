name: KPC world sources probe
# One-off / manual: which official protected-area map services answer for the next POTA countries (JP DE GB PL AU).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:   # PR2 (Nov 2): one run of this bot at a time; a second start waits instead of piling up
  group: kpc-world-probe
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/kpc_world_probe.py || echo "::error title=kpc_world_probe.py::stopped with an error (exit $?), see the log above"
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/world-probe.json
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'World sources probe' - -- data/world-probe.json
