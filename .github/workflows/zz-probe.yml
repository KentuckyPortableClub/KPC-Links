name: zz probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/zz_probe.py || true
      - run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B zz-probe && git add -f probe.json && git commit -qm probe && git push -f origin zz-probe || true
