name: shot
on: {push: {branches: [claude-shot]}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 osm.py
      - run: |
          git config user.name bot; git config user.email bot@x
          git add osm.json; git commit -m data; git push
