name: shot
on: {push: {branches: [claude-shot]}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          for m in KY-Frankfort-WZ2523 KY-Owenton-KZZ48 IN-Indianapolis-KEC74 WV-Charleston-WXJ84 WV-Beckley-WXM71 OH-Chillicothe-KJY68 OH-Columbus-KIG86 TN-Memphis-WXK49 MO-StLouis-KDO89 IL-Champaign-WXJ76; do
            echo "== $m" >> st.txt
            curl -s -D - -o /tmp/a.bin --max-time 6 "https://wxradio.org/$m" | head -15 >> st.txt || true
            echo "bytes $(stat -c %s /tmp/a.bin 2>/dev/null)" >> st.txt
          done
          cat st.txt
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@x
          git add -f st.txt || true; git commit -m out; git pull --rebase; git push
