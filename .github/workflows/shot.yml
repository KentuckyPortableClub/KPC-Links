name: shot
on: {push: {branches: [claude-shot]}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - continue-on-error: true
        timeout-minutes: 10
        run: |
                    npm i playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          (python3 -m http.server 8000 &) ; sleep 2; node lakes.js
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@x
          git add -f lake-*.png || true; git commit -m out || true; git pull --rebase; git push
