name: shot
on: {push: {branches: [claude-shot]}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - continue-on-error: true
        run: python3 sh.py > sh.txt 2>&1
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@x
          for f in sh.txt *.pdf maprep.json gis-*.png; do [ -e "$f" ] && git add -f "$f"; done; git commit -m out || true; git pull --rebase; git push
