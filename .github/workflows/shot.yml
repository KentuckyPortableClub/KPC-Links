name: shot
on: {push: {branches: [claude-shot]}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - continue-on-error: true
        run: python3 ses.py > ses.txt 2>&1
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@x
          git add -f ses.txt ses-res-*.html ses-detail.html || true; git commit -m out || true; git pull --rebase; git push
