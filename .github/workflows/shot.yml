name: shot
on: {push: {branches: [claude-shot]}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - continue-on-error: true
        timeout-minutes: 10
        run: |
                    python3 fut.py 2>&1 | tee fut.txt
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@x
          git add -f fut.json fut.txt || true; git commit -m out || true; git pull --rebase; git push
