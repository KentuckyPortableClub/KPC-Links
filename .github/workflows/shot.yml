name: shot
on: {push: {branches: [claude-shot]}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          npm i playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          (python3 -m http.server 8000 &) ; sleep 2; node nwr.js
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@x
          git add -f lucy-*.png || true; git commit -m out; git pull --rebase; git push
