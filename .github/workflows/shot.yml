name: shot
on: {push: {branches: [claude-shot]}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: python3 osm3.py
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@x
          git add -f osm3.json || true; git commit -m out || true; git pull --rebase; git push
