name: shot
on: {push: {branches: [claude-shot]}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 live.py
        continue-on-error: true
      - continue-on-error: true
        run: |
          npm i playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          (python3 -m http.server 8000 &) ; sleep 2; node shot.js
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@x
          git add -f *.png live.txt shotlog.txt || true; git commit -m out; git pull --rebase; git push
