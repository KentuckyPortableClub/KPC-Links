name: shot
on: {push: {branches: [claude-shot]}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 espn.py
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@x
          git add -f espn.json || true; git commit -m out; git pull --rebase; git push
