name: KPC national trails (US Trip Planner)
# Monthly: official route lines of every National Scenic / Historic Trail that is a POTA park -> data/trails/
on:
  schedule:
    - cron: '13 7 3 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-us-trails
  cancel-in-progress: false
jobs:
  trails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download and simplify the trail lines
        env:
          OUT: /tmp/trails-log.txt
        run: python3 .github/scripts/kpc_us_trails.py
      - name: Show the results
        if: always()
        run: if [ -e /tmp/trails-log.txt ]; then while read -r l; do echo "::notice title=trails::$l"; done < <(tail -n 9 /tmp/trails-log.txt); fi
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/trails
          if ! git diff --cached --quiet; then git commit -m 'National trails: monthly refresh'; git pull --rebase --autostash || true; git push; fi
