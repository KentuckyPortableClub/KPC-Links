name: KPC probe 2 (temporary)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 .github/scripts/kpc_probe2.py || true
          git config user.name kpc-bot; git config user.email kpc-bot@users.noreply.github.com
          git add .claude/build/ap/probe2.txt || true
          git commit -m "probe 2 output" || true
          git pull --rebase || true; git push || true
        continue-on-error: true
