name: KPC 2-fer bot (hidden)
# Oct 26 2026 (Brandon via HQ: 'GO on the all-states 2-fer bot'; Brandon 5:37 AM: 'do the world'). Finds spots where
# POTA parks share 100 yards of official ground. HIDDEN: writes data/fers/ only; nothing links to it. Three passes, run
# one after another by hand (1 = saved outlines, 2 = fresh downloads, 3 = finest shapes + pins). Two jobs per pass:
# North America (US + Canada) and the rest of the world. Never fails (a failed run emails Brandon). Chat 2 starts it.
on:
  workflow_dispatch:
    inputs:
      pass:
        description: 'Pass: 1 (saved outlines), 2 (fresh downloads), 3 (finest shapes), 4 (access pins only), all (1+2+3 in one run)'
        default: '1'
      minutes:
        description: 'Minutes per job (default 320)'
        default: '320'
      states:
        description: 'Only these (e.g. "US-OH CA-ON W-GB"; blank = all)'
        default: ''
      region:
        description: 'both, na (US + Canada), world, or ky (Kentucky only, from its official files)'
        default: 'both'
permissions:
  contents: write
concurrency:
  group: kpc-fers
  cancel-in-progress: false
jobs:
  fers:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(inputs.region == 'na' && '["na"]' || inputs.region == 'world' && '["world"]' || inputs.region == 'ky' && '["ky"]' || '["na","world"]') }}
    steps:
      - uses: actions/checkout@v5
      - name: Tools + saved outlines
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q numpy opencv-python-headless || true
          mkdir -p cache/us cache/ca cache/world
          if [ "${{ matrix.region }}" = world ]; then
            gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p 'W-*.json.gz' -D cache/world --clobber || true
          else
            gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p 'US-*.json.gz' -D cache/us --clobber || true
            gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p 'CA-ALL.json.gz' -D cache/ca --clobber || true
          fi
      - name: Look for shared ground
        continue-on-error: true
        timeout-minutes: 335
        env:
          PASS: ${{ inputs.pass }}
          MINUTES: ${{ inputs.minutes }}
          STATES: ${{ inputs.states }}
          REGION: ${{ matrix.region }}
        run: |
          # Oct 27 (SAVE USAGE): pass 'all' = passes 1, 2 and 3 back to back in ONE run (no waiting between dispatches)
          if [ "$PASS" = all ]; then for p in 1 2 3; do PASS=$p python3 .github/scripts/kpc_fers.py || true; done; else python3 .github/scripts/kpc_fers.py || true; fi
      - name: Observations log (new possible overlaps)
        if: ${{ matrix.region != 'world' }}
        continue-on-error: true
        env:
          OBS_RUN: 2-fer bot pass ${{ inputs.pass }} (${{ matrix.region }})
        run: python3 .github/scripts/kpc_map_observations.py || true
      - name: Save
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fers 2>/dev/null || true
          [ "${{ matrix.region }}" != world ] && git add data/map-observations.json 2>/dev/null || true   # not data/status: the two jobs would clash on it
          git diff --cached --quiet && exit 0
          git commit -qm "2-fer bot pass ${{ inputs.pass }} (${{ matrix.region }}, hidden data)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i * 9)); done
          true
