name: zz PAD-US export test (temporary)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://edits.nationalmap.gov/arcgis/rest/services/PAD-US/PAD_US/MapServer
          mkdir out
          curl -s "$B?f=pjson" -o out/info.json; python3 -c "import json;j=json.load(open('out/info.json'));print('::notice title=info::'+json.dumps({k:j.get(k) for k in ['capabilities','supportedImageFormatTypes','maxImageWidth','minScale','maxScale']})+' layers '+json.dumps([(l['id'],l['name'],l.get('minScale'),l.get('maxScale')) for l in j.get('layers',[])]))"
          curl -s "$B/legend?f=pjson" -o out/legend.json
          for z in a b; do :; done
          curl -s -w "%{http_code} %{content_type}\n" -o out/ky.png "$B/export?bbox=-9425000,4570000,-9390000,4605000&bboxSR=3857&imageSR=3857&size=512,512&format=png32&transparent=true&f=image" | sed 's/^/::notice title=export::/'
          curl -s -w "%{http_code} %{content_type}\n" -o out/wide.png "$B/export?bbox=-9800000,4300000,-9200000,4800000&bboxSR=3857&imageSR=3857&size=512,512&format=png32&transparent=true&f=image" | sed 's/^/::notice title=wide::/'
          curl -s -w "%{http_code} %{content_type}\n" -o out/l0.png "$B/export?bbox=-9425000,4570000,-9390000,4605000&bboxSR=3857&imageSR=3857&size=512,512&format=png32&transparent=true&layers=show:0&f=image" | sed 's/^/::notice title=layer0::/'
          ls -la out
      - uses: actions/upload-artifact@v4
        with: {name: padus, path: out}
