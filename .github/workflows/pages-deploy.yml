name: Deploy Pages (Actions)
# HQ (Oct 28 4:48 AM): a notes/inbox-only push shouldn't rebuild the whole site. This workflow only runs when
# something outside .claude/** changes. Brandon switched Settings -> Pages -> Source to "GitHub Actions"
# Oct 28 ~5:05 AM; this is now the real deploy (CLAUDE.md's old `gh run list -w 372361621` pipeline is
# retired - update that note to this workflow's run list instead). Confirmed live Oct 28 5:06 AM
# (deployment API: state success, sha matched HEAD) and confirmed a .claude/**-only push does NOT
# trigger a run (chat 10's notes-only commit landed with no new workflow_dispatch/push run).
on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
