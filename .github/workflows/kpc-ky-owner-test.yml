name: TEMP Kentucky 2-fer owner test (chat 2, delete after one run)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Test
        continue-on-error: true
        timeout-minutes: 80
        run: |
          pip install -q shapely pyproj || true
          python3 .github/scripts/kpc_ky_owner_test.py || true
      - name: Save
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude/build/research/ky-owner-test.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "Kentucky 2-fer owner test result (temp, chat 2)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i * 9)); done
          true
