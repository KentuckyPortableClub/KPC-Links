name: KPC Reports
# Reads the KPC Reports Google Form sheet (park conditions, website problems, photos, events).
# Park conditions -> kpc-conditions.json (shown 30 days). Photos -> photos/members + kpc-member-photos.json.
# Events -> kpc-events-submitted.json + kpc-events-auto.json. Website problems -> one GitHub issue labelled
# "kpc-site-problems" (never on the site). Comments marked "show it" -> kpc-comments.json (Community page). Club members and kpc-preapproved.json call signs post right away;
# others after YES in the sheet's Approved column. Runs every 2 hours, or any time with "Run workflow".
on:
  schedule:
    - cron: '29 3,9,15,21 * * *'   # every 6 h (Brandon GO Oct 28: was every 2 h)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-reports
  cancel-in-progress: false
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install image tools
        run: pip install --quiet pillow
      - name: Copy reports
        env:
          KPC_REPORTS_CSV: ${{ secrets.KPC_REPORTS_CSV }}
          GH_TOKEN: ${{ github.token }}
          KPC_CHECKS: data/kpc-checks-reports.json
        run: python3 .github/scripts/kpc_reports.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kpc-conditions.json kpc-member-photos.json kpc-events-submitted.json kpc-events-auto.json kpc-comments.json
          if [ -e data/kpc-checks-reports.json ]; then git add data/kpc-checks-reports.json; fi
          git add -A photos/members 2>/dev/null || true
          # Nov 2 review (G7): save with the shared helper (shared with another workflow (kpc-conditions.json, kpc-events-auto.json, kpc-events-submitted.json): merged the old way, but loud). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE=rebase KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh 'Update KPC reports (conditions, member photos, events, comments)' - -- kpc-conditions.json kpc-member-photos.json kpc-events-submitted.json kpc-events-auto.json kpc-comments.json data/kpc-checks-reports.json photos/members
