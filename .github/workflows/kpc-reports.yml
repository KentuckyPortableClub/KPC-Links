name: KPC Reports
# Reads the KPC Reports Google Form sheet (park conditions, website problems, photos, events).
# Park conditions -> kpc-conditions.json (shown 30 days). Photos -> photos/members + kpc-member-photos.json.
# Events -> kpc-events-submitted.json + kpc-events-auto.json. Website problems -> one GitHub issue labelled
# "kpc-site-problems" (never on the site). Comments marked "show it" -> kpc-comments.json (Community page). Club members and kpc-preapproved.json call signs post right away;
# others after YES in the sheet's Approved column. Runs every 2 hours, or any time with "Run workflow".
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-reports
  cancel-in-progress: false
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install image tools
        run: pip install --quiet pillow
      - name: Copy reports
        env:
          KPC_REPORTS_CSV: ${{ secrets.KPC_REPORTS_CSV }}
          GH_TOKEN: ${{ github.token }}
          KPC_CHECKS: data/kpc-checks-reports.json
        run: python3 .github/scripts/kpc_reports.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kpc-conditions.json kpc-member-photos.json kpc-events-submitted.json kpc-events-auto.json kpc-comments.json
          if [ -e data/kpc-checks-reports.json ]; then git add data/kpc-checks-reports.json; fi
          git add -A photos/members 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update KPC reports (conditions, member photos, events, comments)'
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
            echo 'Push skipped; will save on the next run.'
          fi
