name: KPC world POTA pins
# Monthly (5th) + by hand: every POTA park outside the US and Canada as map tiles (data/pota/t) for the KPC US Trip Planner.
on:
  schedule:
    - cron: '17 6 5 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-world-pota
  cancel-in-progress: false
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/kpc_world_pota.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/pota
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'World POTA pins'
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; echo "push try $i failed"; sleep $((i*15)); done
          # Oct 22: a busy repo is not a fault worth an email; the next run saves it
          echo "::notice title=World POTA save::the repo was busy and every push lost the race; the next run will save it"
          exit 0
