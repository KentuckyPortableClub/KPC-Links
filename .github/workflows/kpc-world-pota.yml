name: KPC world POTA pins
# Every night (Oct 23; was monthly) + by hand: every POTA park outside the US and Canada as map tiles (data/pota/t) for the KPC US Trip Planner.
# Nov 16 (handoff item 7): also the one POTA park-list job (kpc_pota_parklists.py) that every park-list reader uses.
on:
  schedule:
    - cron: '17 6 * * *'   # Oct 23: every night (1:17 AM Central); a retired park's pin goes that night
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-world-pota
  cancel-in-progress: false
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      # Nov 16 (handoff item 7, v4): the ONE park-list job. POTA's all-parks export once a day, compared with yesterday's copy; a
      # location's own list only when it changed and a job needs a field the export lacks (world: weekly). Saved to data/pota/saved
      # with its receipt (the readers never call POTA). Same schedule as before.
      - name: The park-list job (kpc_pota_parklists.py)
        run: python3 .github/scripts/kpc_pota_parklists.py
      - run: python3 .github/scripts/kpc_world_pota.py   # reads the saved copy only
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/pota data/retired-refs.json 2>/dev/null || git add -A data/pota
          git add data/pota-pin-changes.json 2>/dev/null || true   # ok: only exists once a POTA pin has changed (Nov 11, kpc_pin_guard.py)
          git add data/status 2>/dev/null || true   # ok: an optional file (the pin log's status stamp)
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'World POTA pins'
          { for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; echo "push try $i failed"; sleep $((i*15)); done; echo "::error title=Save::not saved after every try; the next run tries again"; }
          # Oct 22: a busy repo is not a fault worth an email; the next run saves it
          echo "::notice title=World POTA save::the repo was busy and every push lost the race; the next run will save it"
          exit 0
