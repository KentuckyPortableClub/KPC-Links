name: KPC KY answer key
# The Kentucky park <-> outline answer key (data/ky-answer-key.json) + its review issue (label ky-answer-key).
on:
  schedule:
    - cron: '11 8 * * 1'
  push:
    branches: [main]
    paths: ['ky-*.geojson', 'kpc-ky-data.json', 'kpc-bounds.js', '.github/scripts/kpc_ky_key*']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-ky-key
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the moved data from KPC-Data (the trail lines, Oct 31)
        id: kept_green_1
        continue-on-error: true
        run: bash .github/scripts/kpc_overlay.sh || echo "::error title=kpc_overlay.sh::stopped with an error (exit $?), see the log above"
      - name: Build the answer key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(node .github/scripts/kpc_ky_key.js)
          echo "$out" | head -1 | sed 's/^/::notice title=KY answer key::/'
          python3 .github/scripts/kpc_ky_key_issue.py "$(echo "$out" | tail -1)"
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ky-answer-key.json
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'KY answer key' - -- data/ky-answer-key.json
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
