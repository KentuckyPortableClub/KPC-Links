name: KPC KY answer key
# The Kentucky park <-> outline answer key (data/ky-answer-key.json) + its review issue (label ky-answer-key).
on:
  schedule:
    - cron: '11 8 * * 1'
  push:
    branches: [main]
    paths: ['ky-*.geojson', 'kpc-ky-data.json', 'kpc-bounds.js', '.github/scripts/kpc_ky_key*']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-ky-key
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the answer key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(node .github/scripts/kpc_ky_key.js)
          echo "$out" | head -1 | sed 's/^/::notice title=KY answer key::/'
          python3 .github/scripts/kpc_ky_key_issue.py "$(echo "$out" | tail -1)"
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ky-answer-key.json
          if ! git diff --cached --quiet; then
            git commit -m 'KY answer key'
            for i in 1 2 3 4; do git pull --rebase --autostash && git push && break; sleep $((i*7)); done
          fi
