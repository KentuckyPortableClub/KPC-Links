name: KPC bot chain (one time)
# Brandon Oct 18 2026: 'once one thing is done move to the next'. When the US answer key run finishes, start the next bot jobs one after
# another: park lists for the next busy POTA countries, then another try at the US trails with no map line. Only acts until Oct 20 2026.
on:
  workflow_run:
    workflows: ['KPC US answer key']
    types: [completed]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: kpc-chain
  cancel-in-progress: false
jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_dispatch' }}
    steps:
      - name: Next jobs, one after another
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261020 ]; then echo "chain is over"; exit 0; fi
          go() {  # $1 workflow file, rest = -f inputs; start it, wait for it to finish
            gh workflow run "$1" -R "$R" --ref main "${@:2}" || return 0
            sleep 25
            id=$(gh run list -R "$R" -w "$1" -L 1 --json databaseId -q '.[0].databaseId')
            while [ "$(gh run view "$id" -R "$R" --json status -q .status)" != "completed" ]; do sleep 60; done
            echo "::notice title=chain::$1 done ($(gh run view "$id" -R "$R" --json conclusion -q .conclusion))"
          }
          go kpc-state-links.yml -f states=NONE -f programs="PL ES FR CH AT"
          go kpc-state-trails.yml -f states="VA UT OR HI FL TN NM ID"
