name: KPC shared look-up bot (any chat)
# Oct 29 2026 (chat 10; HQ 12:00 PM, Brandon 11:59 AM GO): any chat pushes a small request file to .claude/lookup/requests/
# (<chat>-<id>.json; how-to in .claude/inbox/README.md) and this answers it on a runner (open internet + a real headless browser).
# EACH request is its own job (matrix, up to 4 at once), so a big request never blocks a small one. No timers. Never goes red
# (EMAIL rule). Answers: .claude/lookup/answers/ + one line in the asking chat's inbox. Script: .github/scripts/kpc_lookup.py.
on:
  push:
    branches: [main]
    paths: ['.claude/lookup/requests/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      reqs: ${{ steps.t.outputs.reqs }}
    steps:
      - uses: actions/checkout@v5
      - id: t
        continue-on-error: true
        run: echo "reqs=$(python3 .github/scripts/kpc_lookup.py todo)" >> "$GITHUB_OUTPUT"
  answer:
    needs: list
    if: ${{ needs.list.outputs.reqs != '' && needs.list.outputs.reqs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        req: ${{ fromJSON(needs.list.outputs.reqs) }}
    concurrency:
      group: kpc-lookup-${{ matrix.req }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Manners (KPC-Data, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Data
          path: kpcdata
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Browser
        continue-on-error: true
        run: (sudo apt-get install -y -q poppler-utils >/dev/null 2>&1 || true); pip install -q playwright pypdf && python3 -m playwright install --with-deps chromium >/dev/null 2>&1 || true
      - name: Answer
        continue-on-error: true
        env:
          MANNERS_DIR: kpcdata/.github/scripts
        run: |
          git pull -q --rebase || true
          if [ -f ".claude/lookup/answers/$(basename '${{ matrix.req }}')" ]; then echo "::notice title=Look-up bot::already answered"; exit 0; fi
          python3 .github/scripts/kpc_lookup.py run "${{ matrix.req }}" || true
      - name: Save the answer + the inbox line
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash || true
            python3 .github/scripts/kpc_lookup.py post "${{ matrix.req }}" || true
            git add .claude/lookup/answers/ .claude/inbox/ 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -qm "look-up bot: answered $(basename '${{ matrix.req }}')" && git push -q && exit 0
            git reset -q --soft HEAD~1 || true; git restore -q --staged .claude/inbox/ 2>/dev/null || true; git checkout -q -- .claude/inbox/ 2>/dev/null || true
            sleep $((i*7))
          done
          true
