name: KPC Events Finder
# Keeps the events calendar current. Every Monday morning this:
#  - works out the recurring dates (POTA Support Your Parks, ARRL Field Day, Winter Field Day)
#  - looks for Kentucky hamfests in the ARRL hamfest database
#  - looks for Kentucky SOTA events (like the yearly SOTA Kentucky Campout) on the SOTA Reflector
# and saves them to kpc-events-auto.json, which events.html merges with the hand-made list.
# Run it any time from the Actions tab with "Run workflow".
#  - then posts the next five weeks of events to the KPC Discord and Facebook Page (Mondays, or when you tick the boxes)
on:
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:
    inputs:
      post_discord:
        description: 'Also post the upcoming events to Discord'
        type: boolean
        default: false
      post_facebook:
        description: 'Also post the upcoming events to the KPC Facebook Page'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-events
  cancel-in-progress: false
jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Find events
        run: python3 .github/scripts/kpc_events.py
      - name: Save the event list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/kpc_light_guard.py kpc-events-auto.json || true   # Oct 30 (Brandon 6:07 AM GO, HQ step C): shrank by half / a row twice = keep the saved copy + a line to chat 11
          git add .claude/inbox/chat-11.md 2>/dev/null || true
          git add kpc-events-auto.json
          # Nov 2 review (G7): save with the shared helper (shared with another workflow (kpc-events-auto.json): merged the old way, but loud). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE=rebase KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh 'Update auto-found events' - -- kpc-events-auto.json .claude/inbox/chat-11.md
      - name: Post upcoming events to Discord
        if: github.event_name == 'schedule' || inputs.post_discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          GENERAL_WEBHOOK_URL: ${{ secrets.KPC_GENERAL_WEBHOOK }}
        run: |
          # G7: post from the newest main; if it cannot be fetched, do not post (a stale state file could post twice)
          git fetch -q origin main && git reset -q --hard origin/main || { echo '::error title=Posting::could not fetch the newest main, so nothing was posted this time'; exit 0; }
          node .github/scripts/kpc_discord_events.js
      - name: Post upcoming events to the Facebook Page
        if: github.event_name == 'schedule' || inputs.post_facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node .github/scripts/kpc_facebook.js events
