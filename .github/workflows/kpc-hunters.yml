name: KPC Hunters
# WHEN ARE THE HUNTERS OUT? (Oct 23 2026, Brandon: 'Yeah sounds good and it will go to discord park info and Facebook also?')
# Every 15 min: count hunter spots on US parks from POTA's spot list (kpc_hunters.py collect). The open hour lives in the
# Actions cache; finished hours go to data/hunters/buckets.json, kpc-hunters.json (Happening Now card) and
# app/hunters.json (the app's 'Hunters are out' alert). Oct 27 (HQ limits plan): the finished hours (buckets.json) also
# live in the cache between runs, and the repo gets ONE commit every ~3 hours (each push rebuilds the site).
# Fridays 8:33 AM Central: one post to Discord (park news) + the Facebook Page, once 14 days are counted.
# Never fails: a POTA hiccup or a busy repo is skipped quietly (no email).
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  schedule:
    - cron: '*/15 * * * *'
    - cron: '33 13 * * 5'
  workflow_dispatch:
    inputs:
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
      post:
        description: 'Also send the weekly post now'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-hunters
  cancel-in-progress: false
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 150
      - name: Bring back the open hour
        id: kept_green_1
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hunters/work.json
            data/hunters/buckets.json
          key: hunters-work-${{ github.run_id }}
          restore-keys: hunters-work-
      - name: Count
        run: python3 .github/scripts/kpc_hunters.py collect build || echo "::error title=kpc_hunters.py::stopped with an error (exit $?), see the log above"
      - name: Keep the open hour
        if: always()
        id: kept_green_2
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/hunters/work.json
            data/hunters/buckets.json
          key: hunters-work-${{ github.run_id }}
      - name: Weekly post
        if: (github.event.schedule || inputs.as_schedule) == '33 13 * * 5' || ((github.event_name == 'workflow_dispatch' && !inputs.as_schedule) && inputs.post)
        id: kept_green_3
        continue-on-error: true
        env:
          KPC_PARKS_WEBHOOK: ${{ secrets.KPC_PARKS_WEBHOOK }}
          DISCORD_WEBHOOK_URL: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 .github/scripts/kpc_hunters.py post || echo "::error title=kpc_hunters.py::stopped with an error (exit $?), see the log above"
      - name: Save
        id: kept_green_4
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # at most one commit every ~3 hours (HQ Oct 27); the cache carries the counts in between
          last=$(git log -1 --format=%ct -- kpc-hunters.json 2>/dev/null || echo 0); last=${last:-0}
          if [ $(( $(date +%s) - last )) -lt 10500 ] && [ "${{ (inputs.as_schedule && 'schedule') || github.event_name }}" != "workflow_dispatch" ]; then echo "saved $(( ($(date +%s) - last) / 60 )) min ago; next save after ~3 h"; exit 0; fi
          git add data/hunters/buckets.json kpc-hunters.json app/hunters.json 2>/dev/null || git add data/hunters/buckets.json kpc-hunters.json 2>/dev/null || true   # ok: an optional path may not exist
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'Hunter counts'
          { for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done; echo "::error title=Save::not saved after every try; the next run tries again"; }
          echo "::notice title=Hunters save::repo busy, the next run will save it"; exit 0
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
