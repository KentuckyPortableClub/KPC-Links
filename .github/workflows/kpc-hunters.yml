name: KPC Hunters
# WHEN ARE THE HUNTERS OUT? (Oct 23 2026, Brandon: 'Yeah sounds good and it will go to discord park info and Facebook also?')
# Every 15 min: count hunter spots on US parks from POTA's spot list (kpc_hunters.py collect). The open hour lives in the
# Actions cache; finished hours go to data/hunters/buckets.json, kpc-hunters.json (Happening Now card) and
# app/hunters.json (the app's 'Hunters are out' alert). Oct 27 (HQ limits plan): the finished hours (buckets.json) also
# live in the cache between runs, and the repo gets ONE commit a day (Nov 3; was every ~3 hours).
# Fridays 8:33 AM Central: one post to Discord (park news) + the Facebook Page, once 14 days are counted.
# Never fails: a POTA hiccup or a busy repo is skipped quietly (no email).
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  schedule:
    # PR2 (Nov 2, fewer runs): ONE job an hour that counts 4 times, 15 minutes apart (like the POTA spotter), instead of 96
    # separate runs a day. Same counts (spots are counted once by their spot id). GitHub was dropping most */15 runs anyway
    # (Nov 2: 3 of 96 scheduled runs happened). Was: '*/15 * * * *'.
    - cron: '7 * * * *'
    - cron: '33 13 * * 5'
  workflow_dispatch:
    inputs:
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
      post:
        description: 'Also send the weekly post now'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-hunters
  cancel-in-progress: false
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 58   # PR2: was 10; the hourly job counts 4 times, 15 min apart
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 150
      - name: Bring back the open hour
        id: kept_green_1
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hunters/work.json
            data/hunters/buckets.json
          key: hunters-work-${{ github.run_id }}
          restore-keys: hunters-work-
      - name: Count
        env:
          WHICH_SCHEDULE: ${{ github.event.schedule || inputs.as_schedule }}
        run: |
          # PR2: the hourly run counts 4 times (0, 15, 30, 45 min); the Friday post run and a by-hand run count once, as before
          N=1; [ "$WHICH_SCHEDULE" = '7 * * * *' ] && N=4
          for i in $(seq 1 $N); do
            python3 .github/scripts/kpc_hunters.py collect build || { kpc_rc=$?; echo "::error title=kpc_hunters.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_hunters.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
            [ "$i" -lt "$N" ] && sleep 870
          done
          true
      # Nov 11 (bots review, package E): the weekly post comes BEFORE the cache save, so the 'already posted this week' mark
      # that kpc_hunters.py writes into the work file is kept for the next run (a second Friday run no longer posts again).
      - name: Weekly post
        if: (github.event.schedule || inputs.as_schedule) == '33 13 * * 5' || ((github.event_name == 'workflow_dispatch' && !inputs.as_schedule) && inputs.post)
        id: kept_green_3
        continue-on-error: true
        env:
          KPC_PARKS_WEBHOOK: ${{ secrets.KPC_PARKS_WEBHOOK }}
          DISCORD_WEBHOOK_URL: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # by-hand run with 'post' ticked = post again on purpose; the Friday run (cron or the watchdog's restart) posts once a week
          KPC_HUNTERS_FORCE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.as_schedule && inputs.post) && '1' || '' }}
        run: python3 .github/scripts/kpc_hunters.py post || { kpc_rc=$?; echo "::error title=kpc_hunters.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_hunters.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Keep the open hour
        if: always()
        id: kept_green_2
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/hunters/work.json
            data/hunters/buckets.json
          key: hunters-work-${{ github.run_id }}
      - name: Save
        id: kept_green_4
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Nov 3 (Brandon YES 5:29 PM): ONE commit a DAY (was one every ~3 h, HQ Oct 27). Counting still happens every 15 min; the
          # Actions cache carries the counts in between (the card shows busy HOURS over 14 days, so a day-old file loses nothing).
          # 82800 s = 23 h, so the hourly job saves once a day; a by-hand run still saves at once.
          # the last save's time comes from GitHub (the 150-commit checkout may not reach back a whole day on a busy main)
          lt=$(gh api "repos/${{ github.repository }}/commits?path=kpc-hunters.json&per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null || true)   # ok: an optional lookup (empty: the next line falls back to git log)
          last=$( [ -n "$lt" ] && date -d "$lt" +%s 2>/dev/null || git log -1 --format=%ct -- kpc-hunters.json 2>/dev/null || echo 0); last=${last:-0}
          if [ $(( $(date +%s) - last )) -lt 82800 ] && [ "${{ (inputs.as_schedule && 'schedule') || github.event_name }}" != "workflow_dispatch" ]; then echo "saved $(( ($(date +%s) - last) / 60 )) min ago; next save after ~23 h"; exit 0; fi
          git add data/hunters/buckets.json kpc-hunters.json app/hunters.json 2>/dev/null || git add data/hunters/buckets.json kpc-hunters.json 2>/dev/null || true   # ok: an optional path may not exist
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'Hunter counts'
          { for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done; echo "::error title=Save::not saved after every try; the next run tries again"; }
          echo "::notice title=Hunters save::repo busy, the next run will save it"; exit 0
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
