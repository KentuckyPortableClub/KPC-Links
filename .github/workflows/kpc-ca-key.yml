name: KPC Canada answer key
# Canada: CA- POTA parks joined to CPCAD land only when name + kind match; the rest goes on review lists (issue label ca-answer-key).
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  schedule:
    - cron: '43 10 2 * *'   # monthly
    - cron: '49 9 * * *'    # nightly, ONLY when BOT W wired a new province layer (data/ca-key/answers-provinces.txt)
  # Nov 4 (links-06; per Brandon via Super Head Bot (relayed), 5:48 AM CST Nov 4: "Full world rebuild yes after us and Canada..stand by for more"):
  # NO new cron. After a rules change this key waits for the key(s) before it (kpc_key_order.py); it is picked up here when one of
  # them finishes. A chained start builds ONLY a new-rules catch-up; otherwise it skips cleanly (one notice).
  workflow_run:
    workflows: ['KPC US answer key']
    types: [completed]
  workflow_dispatch:
    inputs:
      chained:
        description: "Set by the key before this one only (us-key / ca-key): a chained start after a bot-started run (blank = a normal by-hand run)"
        required: false
        default: ''
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
      saved:
        description: 'Build from the saved outlines (no full re-read of every map; newer layers are topped up)'
        type: boolean
        default: false
      force:
        description: "yes = build even while chat 11 grades a held build (Brandon's freeze, Nov 2: by hand only)"
        default: 'no'
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-ca-key
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      skip: ${{ steps.skipped.outputs.skip }}   # next round C1: 1 = this start built nothing (frozen / waits / chained and up to date)
    steps:
      - uses: actions/checkout@v5
      - name: FREEZE CHECK (Brandon Nov 2 7:11 AM; Nov 4 links-04) - a held build on the CURRENT rules, at most 3 days old, with no person's sign-off (Brandon / KZ4CP, after the Nov 2 restart; or signed YES and not yet released) means no new build
        env:
          KPC_INDEX_REF: origin/main   # Nov 4 PM fix bundle (items 1-2): decide on the NEWEST main's stamp, not this queued run's checkout
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 .github/scripts/kpc_key_freeze.py check ca-key || { kpc_rc=$?; echo "::error title=kpc_key_freeze.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_key_freeze.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          if grep -q '^FROZEN=1' "$GITHUB_ENV" 2>/dev/null; then echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: BUILD ORDER (links-06; per Brandon via Super Head Bot (relayed), 5:48 AM CST Nov 4) - after a rules change US, then Canada, then the world; a key whose turn has not come skips cleanly and is started again by workflow_run
        env:
          KPC_INDEX_REF: origin/main   # Nov 4 PM fix bundle (items 1-2): decide on the NEWEST main's stamp, not this queued run's checkout
          KPC_CHAINED: ${{ inputs.chained }}   # next round C1: set only when the key before this one dispatched it
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${SKIP:-}" != 1 ]; then python3 .github/scripts/kpc_key_order.py check ca-key || { echo "SKIP=1" >> "$GITHUB_ENV"; echo "::notice title=Key build order::the order check stopped (exit $?): this start waits"; }; fi
      - name: Tonight's list (chat 2 Oct 30, Brandon 9:48 'Yes'; the nightly run only builds when BOT W wired a new layer)
        env:
          SCHED: ${{ (github.event.schedule || inputs.as_schedule) }}
        run: |
          # Nov 4 (links-04): RULES_CHANGED=1 (the newest Canada build was not a full build on the current rules) = build tonight anyway
          if [ "${RULES_CHANGED:-}" = 1 ] && [ "${SKIP:-}" != 1 ]; then echo "::notice title=Canada key tonight::RULES CHANGED since the newest build: the whole key is built on the current rules (no force needed)"
          elif [ "$SCHED" = "49 9 * * *" ]; then
            L=$(cat data/ca-key/answers-provinces.txt 2>/dev/null | tr -s ' \n' ' ' | sed 's/^ *//;s/ *$//')
            if [ -z "$L" ]; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "::notice title=Canada key tonight::no new approved layer: nothing to rebuild tonight"; else echo "NIGHT_LIST=$L" >> "$GITHUB_ENV"; echo "::notice title=Canada key tonight::new approved layers for: $L"; fi
          fi
      - name: Read the moved data from KPC-Data (Step B, read only)
        if: ${{ env.SKIP != '1' }}
        run: bash .github/scripts/kpc_overlay.sh
      - name: Build the Canada answer key
        if: ${{ env.SKIP != '1' }}
        env:
          GEO_CACHE_MODE: ${{ (inputs.saved || (github.event.schedule || inputs.as_schedule) == '49 9 * * *') && 'use' || 'refresh' }}      # Oct 22: keep the outlines it read, so the next step can save the missing park files
          GH_TOKEN: ${{ github.token }}
        id: kept_green_1
        continue-on-error: true      # Oct 25: a map server that misbehaves must not fail the run (a failed run emails Brandon)
        run: |
          pip install --quiet --break-system-packages pyshp pyproj || pip install --quiet pyshp pyproj || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          # Oct 27 (gap hunt): 'saved' = start from the saved copy on the boundary-cache release (a full re-read can time out)
          if [ "$GEO_CACHE_MODE" = use ]; then mkdir -p cache/ca; gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p 'CA-ALL.json.gz' -D cache/ca --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi
          # Nov 2 (chat 2): chat 11's Canada hard-look YES records (KPC-Data questions/hardlook.json) -> data/ca-key/hardlook-joins.json
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .hl 2>/dev/null && git -C .hl sparse-checkout set --no-cone data/waiting/questions/hardlook.json 2>/dev/null && git -C .hl checkout -q 2>/dev/null && DATA=.hl python3 .github/scripts/kpc_ca_hardlook.py || { kpc_rc=$?; echo "::error title=kpc_ca_hardlook.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_ca_hardlook.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; rm -rf .hl
          python3 .github/scripts/kpc_ca_key.py > ca-key.log 2>&1 || { touch /tmp/ca-key-stopped; echo "::notice title=Canada key::stopped early; the old files are kept"; tail -n 6 ca-key.log | sed 's/^/::notice title=Canada key error::/'; }
          # Oct 28 (tune pass): the script's own notices went only into ca-key.log, so a provincial map that FAILED or a
          # 'saved copy used' fallback never showed. GitHub shows 10 notices a step: the last 9 of them (the gate is last).
          grep '^::notice' ca-key.log | grep -v 'title=CPCAD layer::' | tail -n 9 | cut -c1-900 || true   # ok: a pipeline (its exit status is the last command; follow-up: pipefail)
      - name: Keep the saved copy current (a full read that finished)
        if: ${{ env.SKIP != '1' && !inputs.saved && (github.event.schedule || inputs.as_schedule) != '49 9 * * *' }}
        id: kept_green_2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Oct 27: the release copy was from Oct 22, so a 'saved' build lost 169 joins (undone). Upload after every good full read.
          if [ -f cache/ca/CA-ALL.json.gz ] && ! grep -q 'stopped early\|GATE FAIL' ca-key.log 2>/dev/null; then gh release upload boundary-cache cache/ca/CA-ALL.json.gz -R "$GITHUB_REPOSITORY" --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi
      - name: Save outline files for joined parks that have none (never overwrites)
        if: ${{ env.SKIP != '1' }}
        id: kept_green_3
        continue-on-error: true
        run: python3 .github/scripts/kpc_ca_fill_bounds.py || { kpc_rc=$?; echo "::error title=kpc_ca_fill_bounds.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_ca_fill_bounds.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Why-not tags for parks with no outline (R-GC8)
        if: ${{ env.SKIP != '1' }}
        id: kept_green_4
        continue-on-error: true
        run: python3 .github/scripts/kpc_ca_whynot.py || { kpc_rc=$?; echo "::error title=kpc_ca_whynot.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_ca_whynot.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Review issue
        if: ${{ env.SKIP != '1' }}
        id: kept_green_5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_ca_key_issue.py
      - name: BUILD STAMP (Brandon Nov 2) - this build's id, Brandon / KZ4CP sign off only this id (Nov 4 links-04 - plus the rules hash when the whole key built)
        if: ${{ env.SKIP != '1' && inputs.outline_test != 'yes' }}
        run: |
          # Canada always builds the whole key: it is FULL unless the build stopped early or the gate failed
          if [ ! -f /tmp/ca-key-stopped ] && ! grep -q 'GATE FAIL' ca-key.log 2>/dev/null; then export KPC_FULL_BUILD=1; fi
          python3 .github/scripts/kpc_key_freeze.py stamp ca-key || { kpc_rc=$?; echo "::error title=kpc_key_freeze.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_key_freeze.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Save
        if: ${{ always() && env.SKIP != '1' }}
        # Oct 28 (tune pass): the one safe save (fresh copy of main + only the changed files, deletions too); red ONLY when the save failed.
        # Only this bot's own status file (the others belong to other bots; kpc_state_links.json is KPC-Data's)
        env:
          STRICT: '1'
        run: |
          if [ -n "$NIGHT_LIST" ]; then : > data/ca-key/answers-provinces.txt; fi   # tonight's list done
          bash .github/scripts/kpc_push_data.sh . 'Canada answer key' data/ca-key data/status/kpc_ca_key.json data/canada-bounds
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
      - name: Did this start skip? (next round C1, for the chain job)
        id: skipped
        if: always()
        run: echo "skip=${SKIP:-0}" >> "$GITHUB_OUTPUT"
  chain:
    # Next round C1 (Nov 5; Brandon's yes relayed via Super, 4:32 AM CST Nov 5): a bot-started Canada run (e.g. dispatched by the US
    # key's chain job) fires no workflow_run, so the world key, which WAITS for Canada after a rules change, would never be picked up.
    # Only when this start really built (not skipped): dispatch the world key as chained=ca-key (kpc_key_order.py; a duplicate skips).
    needs: [run]
    if: ${{ always() && github.triggering_actor == 'github-actions[bot]' && needs.run.outputs.skip != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the world key (a bot-started run fires no workflow_run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run kpc-world-key.yml -R "$GITHUB_REPOSITORY" --ref main -f chained=ca-key && echo "::notice title=Canada key::world key started as a chained start (this run was started by github-actions[bot])" || { kpc_rc=$?; echo "::warning title=Canada key::could not start the world key (exit $kpc_rc): start it by hand if a new-rules build is waiting"; echo "Canada key - could not start the world key (exit $kpc_rc): start it by hand if a new-rules build is waiting" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
  postcheck:
    # Next round v2 C13 (Brandon's 10 answers, item 2: 'Yes, go with your picks', relayed via Super 8:55 AM CST Nov 5): as the US key
    # does since the Nov 5 hotfix, a Canada run started with the GITHUB_TOKEN (the US / Canada key's chain job, the watchdog: triggering
    # actor github-actions[bot]) fires NO workflow_run, so 'KPC key check (after a key build)' would not start after it. Such a run
    # DISPATCHES the check with key=ca. A person's run still starts it through workflow_run, as before (no check runs twice).
    needs: [run]
    if: ${{ always() && github.triggering_actor == 'github-actions[bot]' && needs.run.result == 'success' && needs.run.outputs.skip != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the post-key check (a bot-started run fires no workflow_run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run kpc-key-postcheck.yml -R "$GITHUB_REPOSITORY" --ref main -f key=ca && echo "::notice title=Canada key::post-key check started (this run was started by github-actions[bot])" || { kpc_rc=$?; echo "::warning title=Canada key::could not start the post-key check (exit $kpc_rc): start 'KPC key check (after a key build)' by hand with key=ca"; echo "Canada key - could not start the post-key check (exit $kpc_rc): start 'KPC key check (after a key build)' by hand with key=ca" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
