name: KPC Canada answer key
# Canada: CA- POTA parks joined to CPCAD land only when name + kind match; the rest goes on review lists (issue label ca-answer-key).
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  schedule:
    - cron: '43 10 2 * *'   # monthly
    - cron: '49 9 * * *'    # nightly, ONLY when BOT W wired a new province layer (data/ca-key/answers-provinces.txt)
  # Nov 4 (links-06; per Brandon via Super Head Bot (relayed), 5:48 AM CST Nov 4: "Full world rebuild yes after us and Canada..stand by for more"):
  # owner rule, 2026-11-10: no workflow_run trigger. The US key's chain job dispatches this key once per US run (chained=us-key).
  # After a rules change this key waits for the key before it (kpc_key_order.py). A chained start builds ONLY a new-rules
  # catch-up; otherwise it skips cleanly (one notice).
  workflow_dispatch:
    inputs:
      chained:
        description: "Set by the key before this one only (us-key / ca-key): a chained start after a bot-started run (blank = a normal by-hand run)"
        required: false
        default: ''
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
      saved:
        description: 'Build from the saved outlines (no full re-read of every map; newer layers are topped up)'
        type: boolean
        default: false
      force:
        description: "yes = build even while chat 11 grades a held build (Brandon's freeze, Nov 2: by hand only)"
        default: 'no'
      full_rebuild:
        description: "yes = build Canada even when no province's inputs moved (per-area hashes; default is reuse)"
        default: ''
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-ca-key
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      skip: ${{ steps.skipped.outputs.skip }}   # next round C1: 1 = this start built nothing (frozen / waits / chained and up to date)
    steps:
      - uses: actions/checkout@v5
      - name: FREEZE CHECK (Brandon Nov 2 7:11 AM; Nov 4 links-04) - a held build on the CURRENT rules, at most 3 days old, with no person's sign-off (Brandon / KZ4CP, after the Nov 2 restart; or signed YES and not yet released) means no new build
        env:
          KPC_INDEX_REF: origin/main   # Nov 4 PM fix bundle (items 1-2): decide on the NEWEST main's stamp, not this queued run's checkout
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 .github/scripts/kpc_key_freeze.py check ca-key || { kpc_rc=$?; echo "::error title=kpc_key_freeze.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_key_freeze.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          if grep -q '^FROZEN=1' "$GITHUB_ENV" 2>/dev/null; then echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: BUILD ORDER (links-06; per Brandon via Super Head Bot (relayed), 5:48 AM CST Nov 4) - after a rules change US, then Canada, then the world; a key whose turn has not come skips cleanly and is started again by workflow_run
        env:
          KPC_INDEX_REF: origin/main   # Nov 4 PM fix bundle (items 1-2): decide on the NEWEST main's stamp, not this queued run's checkout
          KPC_CHAINED: ${{ inputs.chained }}   # next round C1: set only when the key before this one dispatched it
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${SKIP:-}" != 1 ]; then python3 .github/scripts/kpc_key_order.py check ca-key || { echo "SKIP=1" >> "$GITHUB_ENV"; echo "::notice title=Key build order::the order check stopped (exit $?): this start waits"; }; fi
      - name: Tonight's list (chat 2 Oct 30, Brandon 9:48 'Yes'; the nightly run only builds when BOT W wired a new layer)
        env:
          SCHED: ${{ (github.event.schedule || inputs.as_schedule) }}
        run: |
          # Nov 4 (links-04): RULES_CHANGED=1 (the newest Canada build was not a full build on the current rules) = build tonight anyway
          if [ "${RULES_CHANGED:-}" = 1 ] && [ "${SKIP:-}" != 1 ]; then echo "::notice title=Canada key tonight::RULES CHANGED since the newest build: the whole key is built on the current rules (no force needed)"
          elif [ "$SCHED" = "49 9 * * *" ]; then
            L=$(cat data/ca-key/answers-provinces.txt 2>/dev/null | tr -s ' \n' ' ' | sed 's/^ *//;s/ *$//')
            if [ -z "$L" ]; then [ "${SKIP:-}" = 1 ] || echo "NIGHT_EMPTY=1" >> "$GITHUB_ENV"; echo "SKIP=1" >> "$GITHUB_ENV"; echo "::notice title=Canada key tonight::no new approved layer: nothing to rebuild tonight"; else echo "NIGHT_LIST=$L" >> "$GITHUB_ENV"; echo "::notice title=Canada key tonight::new approved layers for: $L"; fi
          fi
      - name: Area hashes (Nov 12, KPC owner, 2026-11-12; per-province input hashes, handoff part B) - shadow by default
        # Canada builds as ONE job, so the unit that is built is the whole country; the hash, the table and the grading are per province.
        # shadow (default) = the table only; add = a quiet nightly builds when a province's inputs moved; reuse = a planned build is left out
        # when NO province's inputs moved (main's files stay). Never over a freeze or a build-order wait. full_rebuild=yes = no reuse.
        if: ${{ env.SKIP != '1' || env.NIGHT_EMPTY == '1' }}
        env:
          AREA_MODE: ${{ vars.KPC_AREA_HASH || 'add' }}   # Nov 12 (Quality #178): Canada stays on add until a later PR turns reuse on; trail parts are recorded now. The repo variable still wins if set
          FULL_REBUILD: ${{ inputs.full_rebuild || ((github.event.schedule || inputs.as_schedule) == '43 10 2 * *' && 'yes') || '' }}
        run: |
          rm -rf .pi; GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .pi 2>/dev/null \
            && git -C .pi sparse-checkout set --no-cone data/parkinfo data/intake/official-pins-nov12.json data/trails 2>/dev/null && git -C .pi checkout -q 2>/dev/null || { rm -rf .pi; echo "::warning title=Area hashes::KPC-Data pins not read: the pins part is left out this run"; }
          ALLP=$(python3 -c "import json; print(' '.join(sorted(json.load(open('data/ca-key/index.json')).get('provinces') or {})))")
          WANT=$([ "${SKIP:-}" = 1 ] || echo "$ALLP")
          OUT=$(python3 .github/scripts/kpc_area_hash.py plan ca --list "$WANT" --mode "$AREA_MODE" --full "$FULL_REBUILD" $([ -d .pi ] && echo --data .pi) --out "$RUNNER_TEMP/area-plan.json") || OUT="$WANT"
          rm -rf .pi
          MODE=$(printf '%s' "$AREA_MODE" | tr '[:upper:]' '[:lower:]')
          if [ "$MODE" = add ] || [ "$MODE" = reuse ]; then
            if [ "${NIGHT_EMPTY:-}" = 1 ] && [ -n "$OUT" ]; then echo "SKIP=0" >> "$GITHUB_ENV"; echo "::notice title=Canada key tonight::a province's inputs moved since its last build ($OUT): Canada is built"; fi
            if [ "${SKIP:-}" != 1 ] && [ -z "$OUT" ]; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "::notice title=Canada key tonight::no province's inputs moved: nothing is rebuilt (main's files are reused)"; fi
          fi
      - name: Read the moved data from KPC-Data (Step B, read only)
        if: ${{ env.SKIP != '1' }}
        run: bash .github/scripts/kpc_overlay.sh
      - name: Master outlines - read master first (is the checked master whole; which layer, if any, needs a live read)
        # Nov 10: checks data/outlines/ and prints the refresh plan; reads no agency layer unless the repo variable KPC_MASTER_PROBE=1.
        if: ${{ env.SKIP != '1' }}
        id: kept_green_master
        continue-on-error: true
        env:
          KPC_MASTER_PROBE: ${{ vars.KPC_MASTER_PROBE || '0' }}
        run: |
          python3 .github/scripts/kpc_master_cli.py check || { kpc_rc=$?; echo "::error title=Master check::the master outlines failed their check (exit $kpc_rc)"; echo "Master check - failed (exit $kpc_rc)" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          python3 .github/scripts/kpc_master_cli.py plan --prefix CA- $([ "$KPC_MASTER_PROBE" = 1 ] || echo --no-probe) > /dev/null
      - name: Build the Canada answer key
        if: ${{ env.SKIP != '1' }}
        env:
          GEO_CACHE_MODE: ${{ (github.event.schedule || inputs.as_schedule) == '43 10 2 * *' && !inputs.saved && 'refresh' || 'use' }}   # Nov 9 evening (Brandon t909u 'saved outlines first'): every run starts from the saved copy; only the MONTHLY run re-reads Canada live (his 'once a month')      # Oct 22: keep the outlines it read, so the next step can save the missing park files
          KPC_KEY_ONLY_PARKS: ${{ !((github.event.schedule || inputs.as_schedule) == '43 10 2 * *' && !inputs.saved) && env.RULES_ONLY_PARKS || '' }}   # Nov 9 evening (KZ4CP 5:41 PM CST): a park-scoped rule change re-matches only those parks (never on the monthly live re-read)
          GH_TOKEN: ${{ github.token }}
          KPC_CA_HAND: cache/ca-hand
          KPC_OFFICIAL_PINS: .op/data/intake/official-pins-nov12.json   # Nov 12 (KPC owner, 2026-11-12): official pin fills (kpc_pin_fill.py), read only from KPC-Data
        id: kept_green_1
        continue-on-error: true      # Oct 25: a map server that misbehaves must not fail the run (a failed run emails Brandon)
        run: |
          pip install --quiet --break-system-packages pyshp pyproj || pip install --quiet pyshp pyproj || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          # Oct 27 (gap hunt): 'saved' = start from the saved copy on the boundary-cache release (a full re-read can time out)
          # Nov 9 (Brandon t939u "4 saved copies"): the monthly refresh downloads the saved copy too, so layers on saved-copy-only hosts keep their records
          if [ "$GEO_CACHE_MODE" = use ] || [ "$GEO_CACHE_MODE" = refresh ]; then mkdir -p cache/ca; gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p 'CA-ALL.json.gz' -D cache/ca --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi
          # owner rule, 2026-11-10: the release copy as downloaded (+ the asset list) is what save-check compares the upload against
          mkdir -p .against; [ -f cache/ca/CA-ALL.json.gz ] && cp cache/ca/CA-ALL.json.gz .against/
          gh release view boundary-cache -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > .against/ASSETS.txt || rm -f .against/ASSETS.txt
          # Nov 10: checked hand files for Canada layers a bot may not read (Parks Canada): merged by the key (KPC_CA_HAND), keep-bigger, fail closed
          # A failed listing or download is a loud warning naming the asset; no matching asset is a plain notice (nothing waiting is normal)
          mkdir -p cache/ca-hand
          kpc_rc=0; kpc_hand=$(gh release view boundary-cache -R "$GITHUB_REPOSITORY" --json assets -q '[.assets[].name | select(test("^hand-CA[.].*[.]geojson[.]gz$"))] | length') || kpc_rc=$?
          if [ "$kpc_rc" != 0 ]; then echo "::warning title=download hand-CA.*.geojson.gz::could not list the boundary-cache release for hand-CA.*.geojson.gz (exit $kpc_rc); Canada hand files are NOT merged tonight"; echo "download hand-CA.*.geojson.gz - could not list the release (exit $kpc_rc); Canada hand files not merged" >> "$RUNNER_TEMP/kpc-hidden.txt"
          elif [ "${kpc_hand:-0}" = 0 ]; then echo "::notice title=hand-CA.*.geojson.gz::no Canada hand files waiting on boundary-cache"
          else gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p 'hand-CA.*.geojson.gz' -D cache/ca-hand --clobber || { kpc_rc=$?; echo "::warning title=download hand-CA.*.geojson.gz::$kpc_hand hand-CA.*.geojson.gz asset(s) are on boundary-cache but the download failed (exit $kpc_rc); Canada hand files are NOT merged tonight"; echo "download hand-CA.*.geojson.gz - download failed (exit $kpc_rc); Canada hand files not merged" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi
          # Nov 2 (chat 2): chat 11's Canada hard-look YES records (KPC-Data questions/hardlook.json) -> data/ca-key/hardlook-joins.json
          # Nov 6: hardlook.json is .gz in KPC-Data. kpc_ca_hardlook.py stays as it is (it is part of the Canada rules hash).
          # --materialize writes the preferred bytes (.gz wins) to the plain path that script already opens, and exits 1 if neither file is there.
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .hl 2>/dev/null && git -C .hl sparse-checkout set --no-cone data/waiting/questions/hardlook.json data/waiting/questions/hardlook.json.gz 2>/dev/null && git -C .hl checkout -q 2>/dev/null && python3 .github/scripts/kpc_json_any.py --materialize .hl/data/waiting/questions/hardlook.json && DATA=.hl python3 .github/scripts/kpc_ca_hardlook.py || { kpc_rc=$?; echo "::error title=kpc_ca_hardlook.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_ca_hardlook.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; rm -rf .hl
          # Nov 12 (KPC owner, 2026-11-12): official pin fills (KPC-Data data/intake/official-pins-nov12.json, read only, sparse) for parks POTA has no usable
          # pin for. Not read = NO fill this run (kpc_pin_fill.py fails closed and says so); the Canada build goes on either way.
          rm -rf .op; git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .op 2>/dev/null && git -C .op sparse-checkout set --no-cone data/intake/official-pins-nov12.json 2>/dev/null && git -C .op checkout -q 2>/dev/null || { kpc_rc=$?; echo "::warning title=Official pin fills::KPC-Data could not be read (exit $kpc_rc): no official pin fill this run; the Canada build goes on"; echo "official pin fills - KPC-Data could not be read (exit $kpc_rc); no fill applied" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          # Nov 10 (master outlines, read master first): a saved copy shorter than its baseline is moved aside and Canada is NOT built tonight (the old
          # key files are kept, same as 'stopped early'); the Master gate verdict step goes red so a short read never becomes the key.
          # owner rule, 2026-11-10: CA-ALL has no baseline yet (no offline total exists): --first-ok lets it pass with a notice; a SHORT copy is still held
          rm -f "$RUNNER_TEMP/master-short.txt"; python3 .github/scripts/kpc_master_cli.py gate --first-ok --cache cache/ca --report "$RUNNER_TEMP/master-short.txt" && mg=0 || mg=$?
          [ "$mg" = 0 ] || [ "$mg" = 7 ] || { echo "::error title=Master gate::stopped (exit $mg)"; echo "$mg" > "$RUNNER_TEMP/master-short.txt"; }
          if [ -s "$RUNNER_TEMP/master-short.txt" ]; then touch /tmp/ca-key-stopped; : > ca-key.log; echo "::notice title=Canada key::held: the saved copy is short (see the Master gate)"; else
          python3 .github/scripts/kpc_ca_key.py > ca-key.log 2>&1 || { touch /tmp/ca-key-stopped; echo "::notice title=Canada key::stopped early; the old files are kept"; tail -n 6 ca-key.log | sed 's/^/::notice title=Canada key error::/'; }
          fi
          # Oct 28 (tune pass): the script's own notices went only into ca-key.log, so a provincial map that FAILED or a
          # 'saved copy used' fallback never showed. GitHub shows 10 notices a step: the last 9 of them (the gate is last).
          grep '^::notice' ca-key.log | grep -v 'title=CPCAD layer::' | tail -n 9 | cut -c1-900 || true   # ok: a pipeline (its exit status is the last command; follow-up: pipefail)
          grep '^::warning title=Official pin fills' ca-key.log | cut -c1-900 || true   # ok: shows the pin-fill warnings from the log (none = nothing to show); also in the run summary
          rm -rf .op
      - name: Keep the saved copy current (a full read that finished)
        if: ${{ env.SKIP != '1' && !inputs.saved && (github.event.schedule || inputs.as_schedule) != '49 9 * * *' }}
        id: kept_green_2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KPC_ARCHIVE_TOKEN: ${{ secrets.KPC_ARCHIVE_TOKEN }}   # Nov 9 evening: KPC-Archive = the store (outlines as release assets + a small git index); the KPC-Links release stays as the mirror the readers use
        run: |
          # Oct 27: the release copy was from Oct 22, so a 'saved' build lost 169 joins (undone). Upload after every good full read.
          # owner rule, 2026-11-10: 'stopped early' is never in ca-key.log (the workflow prints it); the build leaves /tmp/ca-key-stopped
          ok=0; if [ -f cache/ca/CA-ALL.json.gz ] && [ ! -f /tmp/ca-key-stopped ] && ! grep -q 'GATE FAIL' ca-key.log 2>/dev/null; then ok=1; fi
          # owner rule, 2026-11-10: the first good full read records CA-ALL's baseline (only when it has none; never above the release copy); saved with the key
          if [ "$ok" = 1 ]; then python3 .github/scripts/kpc_master_cli.py baseline --against .against --how "first good full Canada build (run $GITHUB_RUN_ID)" cache/ca/CA-ALL.json.gz || { ok=0; echo "::error title=Canada saved outlines::the first baseline could not be recorded: not uploaded"; echo "Canada saved outlines - baseline not recorded" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi
          if [ "$ok" = 1 ]; then python3 .github/scripts/kpc_master_cli.py save-check --against .against --assets .against/ASSETS.txt --first-ok cache/ca/CA-ALL.json.gz || { ok=0; echo "::error title=Canada saved outlines::save-check refused CA-ALL.json.gz (see above): not uploaded"; echo "Canada saved outlines - save-check refused CA-ALL.json.gz" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi
          if [ "$ok" = 1 ]; then bash .github/scripts/kpc_archive.sh put saved-outlines "Canada key saved outlines (run $GITHUB_RUN_ID)" cache/ca/CA-ALL.json.gz || { kpc_rc=$?; echo "::warning title=KPC-Archive::not saved to KPC-Archive this run (exit $kpc_rc, see above); the release copy is current"; echo "KPC-Archive - not saved this run (exit $kpc_rc); the release copy is current" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi
          if [ "$ok" = 1 ]; then gh release upload boundary-cache cache/ca/CA-ALL.json.gz -R "$GITHUB_REPOSITORY" --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi
      - name: Save outline files for joined parks that have none (never overwrites)
        if: ${{ env.SKIP != '1' }}
        id: kept_green_3
        continue-on-error: true
        run: python3 .github/scripts/kpc_ca_fill_bounds.py || { kpc_rc=$?; echo "::error title=kpc_ca_fill_bounds.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_ca_fill_bounds.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Why-not tags for parks with no outline (R-GC8)
        if: ${{ env.SKIP != '1' }}
        id: kept_green_4
        continue-on-error: true
        run: python3 .github/scripts/kpc_ca_whynot.py || { kpc_rc=$?; echo "::error title=kpc_ca_whynot.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_ca_whynot.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Review issue
        if: ${{ env.SKIP != '1' }}
        id: kept_green_5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_ca_key_issue.py
      - name: Join check (Nov 6 improvements 4, v2) - HOLD joins whose nearest outline part is over 15 km from the pin (not person-approved, not a trail) before the stamp; mark acres outside 0.5x-2x 'suspect'
        if: ${{ env.SKIP != '1' }}
        id: kept_green_joincheck
        continue-on-error: true
        env:
          KEY: ca
          ANSWER_SHEET: .as/data/answer-sheet
        run: |
          # v2 (Quality L04 NO, 5:28 PM CST Nov 5): held joins -> data/ca-key/review/held-joins.csv + held-joins-ledger.csv (pile-enter
          # proposals); the answer sheet (KPC-Data, read only, sparse) exempts joins a person signed off. KPC_JOIN_HOLD=mark = v1.
          # v2.1 (Quality): READ-ONLY, PUBLIC, NO TOKEN: an anonymous https clone (no credential helper, no auth header, no prompt),
          # never pushed, removed after the check; a failed read is LOUD (answer-sheet exemptions empty = more joins held, fail-safe)
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Data .as 2>/dev/null && git -C .as sparse-checkout set --no-cone data/answer-sheet 2>/dev/null && git -C .as checkout -q 2>/dev/null || { kpc_rc=$?; echo "::error title=Join check::KPC-Data answer sheet (public, read-only) not read (exit $kpc_rc): its exemptions are empty this build (more joins held)"; echo "Join check - KPC-Data answer sheet not read (exit $kpc_rc): its exemptions are empty this build (more joins held)" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          python3 .github/scripts/kpc_join_check.py || { kpc_rc=$?; echo "::warning title=Join check::stopped (exit $kpc_rc); the key build is not affected"; }
          rm -rf .as
      - name: Review files - every province not rebuilt this run keeps its rows from main (Nov 12, KPC owner, 2026-11-12)
        id: keep_rows   # Quality #161 must-fix: Save is gated on this step
        # the join check writes the review files whole from the province files git shows changed; an unchanged province keeps main's rows
        if: ${{ env.SKIP != '1' }}
        run: |
          # if the merge itself fails, main's review files are put back whole: a later save can never carry the partial rewrite
          if ! python3 .github/scripts/kpc_area_join.py keep-rows --unchanged --key-dir data/ca-key --review data/ca-key/review; then
            if ! git checkout -- data/ca-key/review; then
              echo "::error title=Review files::the review rows could not be merged and main's review files could not be put back: nothing is saved"
              exit 1
            fi
            echo "::error title=Review files::the review rows could not be merged: main's review files were put back whole and nothing is saved"
            exit 1   # Save is gated on this step (steps.keep_rows.outcome != 'failure')
          fi
      - name: A Canada build that stopped keeps main's key (Nov 12, KPC owner, 2026-11-12) - no stamp, data/ca-key not saved
        # Canada builds as ONE job from ONE saved copy (CA-ALL) and writes its province files only at the end, so a province cannot fail
        # alone today: a short copy, a stopped build or a GATE FAIL keeps EVERY province from main. Before, the stamp still gave the
        # unchanged files a new build id and the join check's whole-file rewrite emptied the review rows; now data/ca-key is put back.
        if: ${{ env.SKIP != '1' }}
        run: |
          if [ -f /tmp/ca-key-stopped ] || grep -q 'GATE FAIL' ca-key.log 2>/dev/null; then
            git checkout -q HEAD -- data/ca-key && git clean -fdq data/ca-key
            echo "CA_KEPT=1" >> "$GITHUB_ENV"
            echo "::error title=Canada key::the build stopped or was held: every province keeps its previous key from main (not stamped, not saved)"
          fi
      - name: BUILD STAMP (Brandon Nov 2) - this build's id, Brandon / KZ4CP sign off only this id (Nov 4 links-04 - plus the rules hash when the whole key built)
        if: ${{ env.SKIP != '1' && env.CA_KEPT != '1' }}
        id: ca_stamp   # Nov 12 (KPC owner, 2026-11-12; Quality #162): Save needs this step green (an unstamped key is not saved), as US and world
        env:
          AREA_MODE: ${{ vars.KPC_AREA_HASH || 'add' }}   # Nov 12 (Quality #178): Canada stays on add until a later PR turns reuse on; KPC_AREA_HASH=shadow writes nothing; =reuse would leave unchanged provinces out
        run: |
          # Canada always builds the whole key: it is FULL unless the build stopped early or the gate failed
          if [ ! -f /tmp/ca-key-stopped ] && ! grep -q 'GATE FAIL' ca-key.log 2>/dev/null; then export KPC_FULL_BUILD=1; fi
          python3 .github/scripts/kpc_key_freeze.py stamp ca-key || { kpc_rc=$?; echo "::error title=kpc_key_freeze.py::stopped with an error (exit $kpc_rc): nothing is saved"; echo "kpc_key_freeze.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit 1; }
          # Nov 12 (part B): every province was rebuilt (one job): each row records its area hash, parts, out_sha, built_sha
          # Nov 12 (KPC owner, 2026-11-12; Quality #163): SHADOW WRITES NOTHING: unless KPC_AREA_HASH is add / reuse, the stamp rows go to
          # $RUNNER_TEMP/area-stamp-shadow/ (uploaded as an artifact) and the job summary; index.json is left byte for byte
          python3 .github/scripts/kpc_area_hash.py stamp-rows ca --mode "$AREA_MODE" --shadow-out "$RUNNER_TEMP/area-stamp-shadow/ca.json" --index data/ca-key/index.json --saved "$(python3 -c "import json; print(' '.join(sorted(json.load(open('data/ca-key/index.json')).get('provinces') or {})))")" \
            --plan "$RUNNER_TEMP/area-plan.json" --built-sha "$(git rev-parse HEAD)" || { kpc_rc=$?; echo "::warning title=Area hashes::the rows were not given their area hash: planned again next run (exit $kpc_rc)"; echo "Area hashes - the rows were not given their area hash: planned again next run (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Whole-key sanity check (Nov 12, part B; read only, reported)
        if: ${{ env.SKIP != '1' && env.CA_KEPT != '1' }}
        id: kept_green_sanity
        continue-on-error: true
        run: python3 .github/scripts/kpc_area_hash.py sanity ca
      - name: Area hashes, shadow record (Nov 12, KPC owner, 2026-11-12) - what the stamp WOULD record, as an artifact (never committed)
        id: kept_green_area_shadow   # Quality #163 must-fix: an upload that fails is reported by 'Report hidden failures', never blocks the key
        continue-on-error: true
        if: ${{ !cancelled() && env.SKIP != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: area-stamp-shadow-ca
          path: ${{ runner.temp }}/area-stamp-shadow/
          if-no-files-found: ignore
          retention-days: 30
      - name: Save
        if: ${{ !cancelled() && env.SKIP != '1' && steps.keep_rows.outcome != 'failure' && steps.ca_stamp.outcome != 'failure' }}   # Nov 12 (KPC owner, 2026-11-11): a cancel mid-build saves nothing (was always()); Nov 12 (2026-11-12): nor a failed stamp
        # Oct 28 (tune pass): the one safe save (fresh copy of main + only the changed files, deletions too); red ONLY when the save failed.
        # Only this bot's own status file (the others belong to other bots; kpc_state_links.json is KPC-Data's)
        env:
          STRICT: '1'
        run: |
          if [ -n "$NIGHT_LIST" ] && [ ! -s "$RUNNER_TEMP/master-short.txt" ] && [ "${CA_KEPT:-0}" != 1 ]; then : > data/ca-key/answers-provinces.txt; fi   # tonight's list done (Nov 10: kept when the master gate held the build)
          # Nov 12 (KPC owner, 2026-11-12; Quality #162): a Canada key kept from main (CA_KEPT) saves no outlines and no layer list from the
          # stopped / held build either: only the key folder (main's bytes again) and this bot's status file
          if [ "${CA_KEPT:-0}" = 1 ]; then
            bash .github/scripts/kpc_push_data.sh . 'Canada answer key' data/ca-key data/status/kpc_ca_key.json
          else
            bash .github/scripts/kpc_push_data.sh . 'Canada answer key' data/ca-key data/status/kpc_ca_key.json data/canada-bounds data/outlines/layers.json
          fi
      - name: Run summary (Nov 12, KPC owner, 2026-11-12) - one table, every province - area | built? | verdict | saved or kept from main | hash stamped | why
        if: ${{ !cancelled() && env.SKIP != '1' }}
        run: |
          python3 .github/scripts/kpc_area_join.py record-whole --index data/ca-key/index.json --rows-key provinces --kept "${CA_KEPT:-0}" \
            --why "$([ -s "$RUNNER_TEMP/master-short.txt" ] && echo 'held-gate: the CA-ALL saved copy is short (refresh it, then rerun the Canada key)' || echo 'failed: the Canada build stopped or its gate failed (see the build step)')" --out /tmp/ca-join.json
          python3 .github/scripts/kpc_area_join.py summary --record /tmp/ca-join.json --index data/ca-key/index.json --title 'Canada key (one job: every province saved or every province kept)'
      - name: Master gate verdict (Nov 10, fail closed) - a short saved copy was moved aside and its area not built; say so and go red
        if: ${{ always() }}
        run: |
          if [ -s "$RUNNER_TEMP/master-short.txt" ]; then
            echo "::error title=Master gate::short saved copy, area NOT built this run (the old key file is kept): $(tr '\n' ' ' < "$RUNNER_TEMP/master-short.txt")"
            exit 1
          fi
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
      - name: Did this start skip? (next round C1, for the chain job)
        id: skipped
        if: always()
        run: echo "skip=${SKIP:-0}" >> "$GITHUB_OUTPUT"
  chain:
    # owner rule, 2026-11-10: the ONE start of the world key (dispatch only, once per Canada run, built or skipped: a skipped
    # Canada start still lets the world key check its own turn; kpc_key_order.py makes a duplicate skip). Not for a cancelled run.
    needs: [run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the world key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run kpc-world-key.yml -R "$GITHUB_REPOSITORY" --ref main -f chained=ca-key && echo "::notice title=Canada key::world key started as a chained start" || { kpc_rc=$?; echo "::warning title=Canada key::could not start the world key (exit $kpc_rc): start it by hand if a new-rules build is waiting"; echo "Canada key - could not start the world key (exit $kpc_rc): start it by hand if a new-rules build is waiting" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
  postcheck:
    # owner rule, 2026-11-10: dispatch is the ONLY path to the post-key check. Not for a cancelled run or a start that built nothing.
    needs: [run]
    if: ${{ !cancelled() && needs.run.result != 'cancelled' && needs.run.outputs.skip != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the post-key check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run kpc-key-postcheck.yml -R "$GITHUB_REPOSITORY" --ref main -f key=ca && echo "::notice title=Canada key::post-key check started" || { kpc_rc=$?; echo "::warning title=Canada key::could not start the post-key check (exit $kpc_rc): start 'KPC key check (after a key build)' by hand with key=ca"; echo "Canada key - could not start the post-key check (exit $kpc_rc): start 'KPC key check (after a key build)' by hand with key=ca" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
