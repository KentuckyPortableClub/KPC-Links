name: KPC Canada answer key
# Canada: CA- POTA parks joined to CPCAD land only when name + kind match; the rest goes on review lists (issue label ca-answer-key).
on:
  schedule:
    - cron: '43 10 2 * *'   # monthly
  workflow_dispatch:
    inputs:
      saved:
        description: 'Build from the saved outlines (no full re-read of every map; newer layers are topped up)'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-ca-key
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Build the Canada answer key
        env:
          GEO_CACHE_MODE: ${{ inputs.saved && 'use' || 'refresh' }}      # Oct 22: keep the outlines it read, so the next step can save the missing park files
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true      # Oct 25: a map server that misbehaves must not fail the run (a failed run emails Brandon)
        run: |
          pip install --quiet --break-system-packages pyshp pyproj || pip install --quiet pyshp pyproj || true
          # Oct 27 (gap hunt): 'saved' = start from the saved copy on the boundary-cache release (a full re-read can time out)
          if [ "$GEO_CACHE_MODE" = use ]; then mkdir -p cache/ca; gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p 'CA-ALL.json.gz' -D cache/ca --clobber || true; fi
          python3 .github/scripts/kpc_ca_key.py > ca-key.log 2>&1 || { echo "::notice title=Canada key::stopped early; the old files are kept"; tail -n 6 ca-key.log | sed 's/^/::notice title=Canada key error::/'; }
          tail -n 3 ca-key.log
      - name: Keep the saved copy current (a full read that finished)
        if: ${{ !inputs.saved }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Oct 27: the release copy was from Oct 22, so a 'saved' build lost 169 joins (undone). Upload after every good full read.
          if [ -f cache/ca/CA-ALL.json.gz ] && ! grep -q 'stopped early' ca-key.log 2>/dev/null; then gh release upload boundary-cache cache/ca/CA-ALL.json.gz -R "$GITHUB_REPOSITORY" --clobber || true; fi
      - name: Save outline files for joined parks that have none (never overwrites)
        continue-on-error: true
        run: python3 .github/scripts/kpc_ca_fill_bounds.py || true
      - name: Review issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_ca_key_issue.py
      - name: Save
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ca-key 2>/dev/null || true
          git add data/status 2>/dev/null || true   # Oct 25 storage plan: when each file last changed
          git add data/canada-bounds 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Canada answer key'
            for i in 1 2 3 4; do git pull --rebase --autostash && git push && break; sleep $((i*7)); done
          fi
