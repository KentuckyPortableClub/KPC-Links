name: zz probe
on: push
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 probe.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add out.txt; git commit -m "out [skip ci]"; git push
