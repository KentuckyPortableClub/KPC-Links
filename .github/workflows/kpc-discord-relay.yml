name: KPC Discord relay
# Shares posts from the private Discord channel to the website, Facebook Page, other Discord server(s), Groups.io,
# the email-updates list, the Events calendar and park warnings. Edits/deletes follow. How posts are read (tags):
# see the top of .github/scripts/kpc_discord_relay.py. Started every 15 min here, and within ~1 minute of a new post
# by the watcher in the KPC Mailer Apps Script (kpcwebhost@gmail.com), which calls workflow_dispatch with dry_run=false.
# PR3 (Nov 2): a started run first takes a few-second look and ends there when nothing is new (kpc_relay_peek.py); the full
# work still runs at least every ~15 min. It is also the outside heartbeat that restarts KPC-Data's watchdog (see the end).
on:
  schedule:
    - cron: '5,20,35,50 * * * *'   # G9 Nov 2: was '7,22,37,52 * * * *' (spread the start times; now 2 min earlier)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show what would be posted, change nothing)'
        type: boolean
        default: true
      full:
        description: 'PR3: always do the full run (skip the quick "anything new?" look)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write   # Nov 2: the watchdog heartbeat below
concurrency:
  group: kpc-discord-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # PR3 (Nov 2): the Apps Script starts this relay every few minutes; most starts find nothing new. On those STARTED runs
      # a few-second look decides: a new Discord message, a waiting email, a due post, or 14+ min since the last full run =
      # the full run; else the run ends here (the heartbeat below still runs). Scheduled runs and practice runs always go full.
      - name: Anything new? (started runs only, PR3)
        id: peek
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KPC_RELAY_CHANNEL: ${{ secrets.KPC_RELAY_CHANNEL }}
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full && '1' || '' }}
        run: python3 .github/scripts/kpc_relay_peek.py
      - name: Install image tools
        if: steps.peek.outputs.skip != '1'
        run: pip install --quiet pillow
      - name: Share new posts
        if: steps.peek.outputs.skip != '1'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KPC_RELAY_CHANNEL: ${{ secrets.KPC_RELAY_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          RELAY_SMTP_USER: ${{ secrets.RELAY_SMTP_USER }}
          RELAY_SMTP_PASS: ${{ secrets.RELAY_SMTP_PASS }}
          GROUPSIO_TO: ${{ secrets.GROUPSIO_TO }}
          GROUPSIO_SUBJECT: ${{ vars.GROUPSIO_SUBJECT }}
          SUBSCRIBE_SHEET_CSV: ${{ secrets.SUBSCRIBE_SHEET_CSV }}
          RELAY_MAIL_URL: ${{ secrets.RELAY_MAIL_URL }}
          RELAY_MAIL_KEY: ${{ secrets.RELAY_MAIL_KEY }}
          RELAY_DISCORD_WEBHOOKS: ${{ secrets.RELAY_DISCORD_WEBHOOKS }}
          KPC_CAMPOUT_WEBHOOK: ${{ secrets.KPC_CAMPOUT_WEBHOOK }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: python3 .github/scripts/kpc_discord_relay.py
      # Both of these ride along here rather than on a timer of their own: it is the only job that already runs
      # every 15 minutes, so answers are quick and no new scheduled workflow lands in anybody's email.
      - name: Answer what we can in the club rooms
        if: steps.peek.outputs.skip != '1'
        id: kept_green_1
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: python3 .github/scripts/kpc_discord_ask.py || echo "::error title=kpc_discord_ask.py::stopped with an error (exit $?), see the log above"
      - name: Keep an eye on the rooms
        if: steps.peek.outputs.skip != '1'
        id: kept_green_2
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KPC_ADMIN_WEBHOOK: ${{ secrets.KPC_ADMIN_WEBHOOK }}
          KPC_DISCORD_WEBHOOK: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          MODE: watch
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: python3 .github/scripts/kpc_discord_mod.py || echo "::error title=kpc_discord_mod.py::stopped with an error (exit $?), see the log above"
      - name: Do anything asked for in the staff room
        if: steps.peek.outputs.skip != '1'
        id: kept_green_3
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KPC_ADMIN_WEBHOOK: ${{ secrets.KPC_ADMIN_WEBHOOK }}
          KPC_DISCORD_WEBHOOK: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          MODE: commands
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: python3 .github/scripts/kpc_discord_mod.py || echo "::error title=kpc_discord_mod.py::stopped with an error (exit $?), see the log above"
      - name: Save
        if: steps.peek.outputs.skip != '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Oct 25: a state file whose only change is a time stamp is put back, so a quiet run commits nothing
          python3 .github/scripts/kpc_save_filter.py kpc-relay-state.json kpc-conditions.json data/discord-ask-state.json data/discord-mod-state.json || echo "::error title=kpc_save_filter.py::stopped with an error (exit $?), see the log above"
          for f in kpc-announcements.json kpc-relay-state.json kpc-conditions.json kpc-events-submitted.json kpc-events-auto.json data/discord-ask-state.json data/discord-mod-state.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          git add -A photos/announce 2>/dev/null || true   # ok: an optional path may not exist
          # Nov 2 review (G7): save with the shared helper (shared with another workflow (kpc-announcements.json, kpc-conditions.json, kpc-events-auto.json, kpc-events-submitted.json): merged the old way, but loud). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE=rebase KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" KPC_SAVE_TRIES=6 \
            bash .github/scripts/kpc_save_overwrite.sh 'Club post from Discord' - -- kpc-announcements.json kpc-relay-state.json kpc-conditions.json kpc-events-submitted.json kpc-events-auto.json data/discord-ask-state.json data/discord-mod-state.json photos/announce
      - name: WATCHDOG HEARTBEAT (Nov 2, HQ 11:30 AM; GitHub's own schedule skipped the watchdog all morning, this relay fires every 15 min)
        if: always()
        id: kept_green_hb
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/kpc-watchdog.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // "1970-01-01T00:00:00Z"')
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          if [ "$age" -gt 9000 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/kpc-watchdog.yml/dispatches" -f ref=main && echo "::notice title=Watchdog heartbeat::the watchdog had not run for $((age / 60)) min: started it once (from the relay)"
          else echo "watchdog ran $((age / 60)) min ago: nothing to do"; fi
          true   # ok: a missed heartbeat is retried 15 min later by the next relay run
      # PR3 (Nov 2): KPC-Data's own timers stopped firing at 7:26 AM CT Nov 2, and every KPC-Data backup (its watchdog, the
      # engine / map-audit chains) lives inside KPC-Data, so nothing from outside could start it again. This relay runs many
      # times an hour from KPC-Links, so it is the outside heartbeat: when KPC-Data's watchdog is 2 h 15 min old it starts it
      # (the watchdog then restarts every KPC-Data timer GitHub skipped and checks the website copy), and when the website copy
      # bot is 40+ min old while 'site' differs from main, it starts that too. Needs the secret KPC_DATA_ACTIONS_TOKEN (a
      # fine-grained token: ONLY KPC-Data, 'Actions: Read and write'); without it this step only says so. Never red.
      - name: KPC-DATA HEARTBEAT (PR3; cross-repo backup starter)
        if: always()
        id: kept_green_hb2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.KPC_DATA_ACTIONS_TOKEN }}
          D: KentuckyPortableClub/KPC-Data
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice title=KPC-Data heartbeat::off: add the secret KPC_DATA_ACTIONS_TOKEN (KPC-Data only, Actions read/write) to switch it on"; exit 0; fi
          age() { last=$(gh api "repos/$D/actions/workflows/$1/runs?per_page=1" --jq '.workflow_runs[0].created_at // "1970-01-01T00:00:00Z"') || return 1; echo $(( $(date -u +%s) - $(date -u -d "$last" +%s) )); }
          a=$(age kpc-watchdog.yml) || { echo "::warning title=KPC-Data heartbeat::could not read KPC-Data's runs (token?)"; exit 0; }
          if [ "$a" -gt 8100 ]; then
            gh api -X POST "repos/$D/actions/workflows/kpc-watchdog.yml/dispatches" -f ref=main >/dev/null && echo "::notice title=KPC-Data heartbeat::KPC-Data's watchdog had not run for $((a / 60)) min: started it" || echo "::error title=KPC-Data heartbeat::could not start KPC-Data's watchdog (token?)"
          else echo "KPC-Data watchdog ran $((a / 60)) min ago"; fi
          M=$(gh api repos/$D/git/ref/heads/main --jq .object.sha 2>/dev/null); S=$(gh api repos/$D/git/ref/heads/site --jq .object.sha 2>/dev/null)
          p=$(age kpc-pages-sync.yml) || p=0
          if [ -n "$M" ] && [ "$M" != "$S" ] && [ "$p" -gt 2400 ]; then
            gh api -X POST "repos/$D/actions/workflows/kpc-pages-sync.yml/dispatches" -f ref=main >/dev/null && echo "::notice title=KPC-Data heartbeat::website copy bot $((p / 60)) min old and site != main: started it" || echo "::error title=KPC-Data heartbeat::could not start kpc-pages-sync (token?)"
          fi
          true   # ok: the next relay run tries again
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
