name: KPC Discord relay
# Shares posts from the private Discord channel to the website, Facebook Page, other Discord server(s), Groups.io,
# the email-updates list, the Events calendar and park warnings. Edits/deletes follow. How posts are read (tags):
# see the top of .github/scripts/kpc_discord_relay.py. Started every 15 min here, and within ~1 minute of a new post
# by the watcher in the KPC Mailer Apps Script (kpcwebhost@gmail.com), which calls workflow_dispatch with dry_run=false.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show what would be posted, change nothing)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: kpc-discord-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install image tools
        run: pip install --quiet pillow
      - name: Share new posts
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KPC_RELAY_CHANNEL: ${{ secrets.KPC_RELAY_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          RELAY_SMTP_USER: ${{ secrets.RELAY_SMTP_USER }}
          RELAY_SMTP_PASS: ${{ secrets.RELAY_SMTP_PASS }}
          GROUPSIO_TO: ${{ secrets.GROUPSIO_TO }}
          GROUPSIO_SUBJECT: ${{ vars.GROUPSIO_SUBJECT }}
          SUBSCRIBE_SHEET_CSV: ${{ secrets.SUBSCRIBE_SHEET_CSV }}
          RELAY_MAIL_URL: ${{ secrets.RELAY_MAIL_URL }}
          RELAY_MAIL_KEY: ${{ secrets.RELAY_MAIL_KEY }}
          RELAY_DISCORD_WEBHOOKS: ${{ secrets.RELAY_DISCORD_WEBHOOKS }}
          KPC_CAMPOUT_WEBHOOK: ${{ secrets.KPC_CAMPOUT_WEBHOOK }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: python3 .github/scripts/kpc_discord_relay.py
      # Both of these ride along here rather than on a timer of their own: it is the only job that already runs
      # every 15 minutes, so answers are quick and no new scheduled workflow lands in anybody's email.
      - name: Answer what we can in the club rooms
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: python3 .github/scripts/kpc_discord_ask.py || true
      - name: Keep an eye on the rooms
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KPC_ADMIN_WEBHOOK: ${{ secrets.KPC_ADMIN_WEBHOOK }}
          KPC_DISCORD_WEBHOOK: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          MODE: watch
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: python3 .github/scripts/kpc_discord_mod.py || true
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in kpc-announcements.json kpc-relay-state.json kpc-conditions.json kpc-events-submitted.json kpc-events-auto.json data/discord-ask-state.json data/discord-mod-state.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          git add -A photos/announce 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Club post from Discord'
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
            echo 'Push failed; the next run will try again.'
            exit 1
          fi
