name: KPC Boards (activations, guestbook, CW leaderboard)
# Copies the Activation Board, Guestbook and CW Challenge Leaderboard Google Form answers to the website.
# Every 20 minutes (so "on the air now" posts show up quickly), or any time from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: '14,44 * * * *'   # PR2 (Nov 2): every 30 min (was every 20, '14,34,54 * * * *')   # G9 Nov 2: was '7,27,47 * * * *' (spread the start times; now 7 min later)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-boards
  cancel-in-progress: false
jobs:
  boards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Activation Board
        env:
          KPC_ACTIVATIONS_CSV: ${{ secrets.KPC_ACTIVATIONS_CSV }}
        run: python3 .github/scripts/kpc_activations.py || echo '::warning title=Activation Board::the sync stopped with an error'
      - name: Guestbook
        env:
          KPC_GUESTBOOK_CSV: ${{ secrets.KPC_GUESTBOOK_CSV }}
        run: python3 .github/scripts/kpc_guestbook.py || echo '::warning title=Guestbook::the sync stopped with an error'
      - name: CW Leaderboard
        env:
          KPC_CWBOARD_CSV: ${{ secrets.KPC_CWBOARD_CSV }}
        run: python3 .github/scripts/kpc_cwboard.py || echo '::warning title=CW Leaderboard::the sync stopped with an error'
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in kpc-activations.json kpc-guestbook.json kpc-cw-board.json data/kpc-form-checks.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'Update activation board / guestbook / CW leaderboard' - -- kpc-activations.json kpc-guestbook.json kpc-cw-board.json data/kpc-form-checks.json
