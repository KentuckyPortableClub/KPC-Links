name: KPC key measure
# THE FAST RULE TEST. Rebuilds every state's answer key from the SAVED outlines (no network at all) and says
# what changed against the keys in the repo: joins gained, joins lost, pins outside. Run it after changing a
# matching rule, BEFORE letting the rule loose. Fable's review: 'measure-before-enable is the best practice in
# the brief — formalise it'. Commits nothing unless asked. Never fails.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which keys: us, world or ca'
        type: choice
        options: [us, world, ca]
        default: us
      states:
        description: 'Only these states / countries (blank = every one that has saved outlines)'
        default: ''
      commit:
        description: 'Keep the rebuilt keys (commit them)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-us-key          # shares the answer-key lock: the two must never write keys at once
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - name: Fetch the saved outlines
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cache/us cache/world cache/ca
          case "${{ inputs.scope }}" in
            world) gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p 'W-*.json.gz' -D cache/world --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; } ;;
            ca)    gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p 'CA-ALL.json.gz' -D cache/ca --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; } ;;
            *)     gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p 'US-*.json.gz' -D cache/us --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; } ;;
          esac
          echo "::notice title=Measure::$(ls cache/us cache/world cache/ca 2>/dev/null | grep -c gz) saved file(s) available for ${{ inputs.scope }}"
      - name: Keep the keys as they are now, to compare against
        run: |
          case "${{ inputs.scope }}" in world) d=data/world-key ;; ca) d=data/ca-key ;; *) d=data/us-key ;; esac
          echo "KEYDIR=$d" >> "$GITHUB_ENV"
          rm -rf /tmp/before && cp -r "$d" /tmp/before
      - name: Rebuild from the saved outlines only
        id: kept_green_2
        continue-on-error: true
        env:
          STATES: ${{ inputs.states }}
          GEO_CACHE_MODE: only
        run: |
          pip install --quiet --break-system-packages pykakasi pyshp pyproj || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          case "${{ inputs.scope }}" in
            world)
              ALL="${STATES:-$(ls cache/world | sed -n 's/^W-\(..\)\.json\.gz$/\1/p' | tr '\n' ' ')}"
              for c in $ALL; do COUNTRIES=$c python3 .github/scripts/kpc_world_key.py || { kpc_rc=$?; echo "::error title=kpc_world_key.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_world_key.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; done ;;
            ca) python3 .github/scripts/kpc_ca_key.py || { kpc_rc=$?; echo "::error title=kpc_ca_key.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_ca_key.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; } ;;
            *)  python3 .github/scripts/kpc_us_key.py || { kpc_rc=$?; echo "::error title=kpc_us_key.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_us_key.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; } ;;
          esac
      - name: What changed
        id: kept_green_3
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, pathlib
          import os
          b, a = pathlib.Path('/tmp/before'), pathlib.Path(os.environ['KEYDIR'])
          rows, T = [], {'gained': 0, 'lost': 0, 'out_before': 0, 'out_after': 0}
          for f in sorted(a.glob('*.json')):
              try: new = json.loads(f.read_text()); old = json.loads((b / f.name).read_text())
              except Exception: continue
              if 'parks' not in new or 'parks' not in old: continue        # index, caches of lookups and the like
              if new.get('updated') == old.get('updated') and new.get('counts') == old.get('counts'): continue
              jn = {r for r, v in new['parks'].items() if v.get('m')}; jo = {r for r, v in old['parks'].items() if v.get('m')}
              g, l = len(jn - jo), len(jo - jn)
              ob, oa = (old.get('counts') or {}).get('pin_outside', 0) or 0, (new.get('counts') or {}).get('pin_outside', 0) or 0
              T['gained'] += g; T['lost'] += l; T['out_before'] += ob; T['out_after'] += oa
              rows.append(f"| {new.get('st') or new.get('cc') or f.stem} | {len(jo)} → {len(jn)} | +{g} / −{l} | {ob} → {oa} |")
              lost = sorted(jo - jn)[:5]
              if lost: rows.append(f"| | lost: {', '.join(lost)} | | |")
          L = [f"## Answer keys rebuilt from the saved outlines ({os.environ['KEYDIR']})", '',
               f"**Joins gained {T['gained']}, lost {T['lost']}.** Pins outside their land: {T['out_before']} → {T['out_after']}.", '',
               '| State | joined before → after | change | pins outside |', '|---|---|---|---|'] + rows
          s = '\n'.join(L)
          open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a').write(s + '\n')
          print(f"::notice title=Measure::joins +{T['gained']} / -{T['lost']}; pins outside {T['out_before']} -> {T['out_after']} (full table in the run summary)")
          PY
      - name: FREEZE CHECK (Nov 2 review, Mapping #7) - the rebuilt key is not kept while chat 11 grades a held build
        if: ${{ inputs.commit }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ inputs.scope }}" in world) k=world-key ;; ca) k=ca-key ;; *) k=us-key ;; esac
          echo "KEYKIND=$k" >> "$GITHUB_ENV"
          python3 .github/scripts/kpc_key_freeze.py check "$k" || { kpc_rc=$?; echo "::error title=kpc_key_freeze.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_key_freeze.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Not kept (frozen)
        if: ${{ inputs.commit && env.FROZEN == '1' }}
        run: |
          echo "::warning title=Measure::the key is frozen (build ${FROZEN_BUILD}), so the comparison above is shown and nothing was saved"
      - name: Stamp the rebuilt key (Nov 2 review, Mapping #7) - a kept rebuild is a new build with its own id
        if: ${{ inputs.commit && env.FROZEN != '1' }}
        run: python3 .github/scripts/kpc_key_freeze.py stamp "$KEYKIND" || { kpc_rc=$?; echo "::error title=kpc_key_freeze.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_key_freeze.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Keep them (only if asked)
        if: ${{ inputs.commit && env.FROZEN != '1' }}
        id: kept_green_4
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$KEYDIR"
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" KPC_SAVE_SKIP="data/us-key/overrides.json data/us-key/answers-applied.json data/us-key/answers-states.txt data/ca-key/overrides.json data/ca-key/answers-applied.json data/ca-key/answers-provinces.txt data/world-key/overrides.json data/world-key/answers-applied.json data/world-key/extra-layers.json" \
            bash .github/scripts/kpc_save_overwrite.sh --copy "Answer keys (${{ inputs.scope }}): rebuilt from the saved outlines" - -- "$KEYDIR"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
