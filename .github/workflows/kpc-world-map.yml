name: KPC world map file (one-off, chat 3)
# Oct 31: builds kpc-world-map.json (Natural Earth) for the Overlap Finder's world + Canada maps. Never fails. DELETE after use.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q shapely && python3 .github/scripts/kpc_world_map.py || true
        continue-on-error: true
      - name: Save
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [ -s kpc-world-map.json ] || exit 0
          git add kpc-world-map.json && git commit -qm 'World + Canada map file for the Overlap Finder (Natural Earth)' || exit 0
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i*8)); done
          true
