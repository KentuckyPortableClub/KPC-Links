name: KPC key trace (temporary, chat 2)
# One debug run: the US key for a few states with DEBUG_REFS traced step by step. Saves NOTHING (freeze). Never fails. Deleted after.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Read the moved data from KPC-Data
        run: bash .github/scripts/kpc_overlay.sh || true
      - name: Trace
        env:
          MINUTES: '100'
          DEBUG_REFS: 'US-12271 US-12255 US-4555 US-3862 US-10681 US-8692'
        run: |
          pip install --quiet --break-system-packages pyshp pyproj shapely || true
          for st in WA NC DE FL; do STATES=$st python3 .github/scripts/kpc_us_key.py > key-$st.log 2>&1 || true; done
          python3 - <<'PY' || true
          import glob, re
          for f in sorted(glob.glob('key-*.log')):
              L = open(f, errors='replace').read().splitlines()
              keep = [re.sub(r'^::notice title=', '', l) for l in L if 'TRACE' in l or re.search(r'sg[a-z]{3}: \d+|not read|layer not found|did not answer', l)]
              msg = ' || '.join(keep)
              for i in range(0, min(len(msg), 24000), 6000):
                  print(f"::notice title={f} part {i // 6000 + 1}::" + msg[i:i + 6000].replace('\n', ' '))
          PY
