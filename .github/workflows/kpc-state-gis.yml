name: State GIS layer scan
# One-time / occasional: finds each state's own park / wildlife / forest boundary layers for the Map Rep Tool Box
# and saves what it found to data/state-gis-found.json (Claude curates that into data/state-gis.json). Never fails.
on:
  workflow_dispatch:
    inputs:
      states:
        description: 'State codes to scan (blank = all)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-state-gis
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Scan
        run: python3 .github/scripts/kpc_state_gis.py ${{ inputs.states }} || true
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state-gis-found.json data/state-gis-proposed.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'State GIS layer scan'
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
          fi
          exit 0
