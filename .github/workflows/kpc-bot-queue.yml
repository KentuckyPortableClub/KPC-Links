name: KPC boundary bot queue
# Oct 20 (Brandon: 'set the bots up on a schedule to finish and start another run'): every hour, when no boundary bot is
# running, start the next job in data/bot-queue.json and take it off the list. Never fails (no emails); stops after 'until'.
# Oct 28 tune: (1) the queue file is SAVED FIRST and the job is started only after the save went through, so a failed push
# can never start the same job twice; (2) a job whose start fails goes to the back for a day instead of blocking the line;
# (3) 'busy' also counts the boundary check (it shares the US answer-key lock) and waiting/pending runs, and a failed
# status read counts as busy (never start blind).
on:
  schedule:
    - cron: '22 */2 * * *'   # PR2 (Nov 2): every 2 h (was hourly, '22 * * * *'); boundary jobs take hours, so the next one rarely waits long   # G9 Nov 2: was '23 * * * *' (spread the start times; now 1 min earlier)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-bot-queue
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Pick the next job
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/kpc_bot_queue.py pick || { kpc_rc=$?; echo "::error title=kpc_bot_queue.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_bot_queue.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Save the queue before starting anything
        id: save
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bot-queue.json
          if git diff --cached --quiet; then echo "saved=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m 'Bot queue: started next job'
          for i in 1 2 3 4; do
            if git pull -q --rebase --autostash && git push -q; then echo "saved=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            git rebase --abort 2>/dev/null || true   # ok: there may be no rebase to stop
            sleep $((i*7))
          done
          echo "::notice title=Bot queue::queue could not be saved; nothing started this hour"
      - name: Start it
        if: steps.save.outputs.saved == '1'
        id: kept_green_2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/kpc_bot_queue.py start || { kpc_rc=$?; echo "::error title=kpc_bot_queue.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_bot_queue.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          git add data/bot-queue.json
          if ! git diff --cached --quiet; then
            git commit -q -m 'Bot queue: start failed, job moved to the back'
            { saved=0; for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && { saved=1; break; }; sleep $((i*7)); done; [ "$saved" = 1 ] || { kpc_rc=$?; echo "::error title=Save::not saved after every try; the next run tries again"; echo "Save - not saved after every try; the next run tries again" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; }
          fi
          exit 0
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
