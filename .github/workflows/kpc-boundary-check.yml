name: KPC boundary check
# Works through the states a few at a time, rebuilding each answer key with the check that asks whether a
# joined park's pin really falls inside the land it was joined to, then writes the findings into ONE issue
# (edited, never commented, so nobody is emailed). Nightly, so the answers pile up without anyone sitting here.
# Never fails. Run it by hand with a list of states to do those instead.
on:
  schedule:
    - cron: '37 7 * * *'          # 1:37 AM CST (2:37 AM in daylight time)
  workflow_dispatch:
    inputs:
      states:
        description: 'States to rebuild, e.g. "MT OR CO". Blank = the next few that have not been checked.'
        default: ''
      report_only:
        description: 'Just rewrite the report from the keys we already have'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-us-key          # shares the answer-key lock: the two must never build at once
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Start from the NEWEST main (Nov 4 PM fix bundle, item 1; Brandon's yes relayed via Super Head Bot, 4:53 PM CST Nov 4)
        # A queued run checks out the commit of the moment it was queued. On Nov 4 this run (41860712149) waited behind the US key
        # (same lock), checked out the Nov 3 key, and its save copied that old index.json (stamp without a rules hash) over the
        # newer US-41846994942: the 11:19 AM CST nightly then rebuilt the WHOLE US key, then Canada and the world. Nothing else
        # writes data/us-key while this run holds the kpc-us-key lock, so starting from the newest main closes the gap.
        run: |
          if git fetch -q --depth 1 origin main && git reset -q --hard FETCH_HEAD; then echo "::notice title=Boundary check::started from the newest main $(git rev-parse --short HEAD)"
          else echo "::warning title=Boundary check::could not move to the newest main (exit $?): the stamp step still keeps the committed rules hash"; fi
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - name: Pick the states that have not been checked yet
        id: pick
        continue-on-error: true
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, os
          want = (os.environ.get('WANT') or '').split()
          if not want:
              todo = []
              for f in sorted(pathlib.Path('data/us-key').glob('*.json')):
                  if f.name == 'index.json':
                      continue
                  try:
                      d = json.loads(f.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  # redo anything not yet built from the ~110 m saved outlines ('detail' is only written by
                  # builds that know about it; anything older used the ~1.1 km ones)
                  if ((d.get('counts') or {}).get('detail') or 1) >= 0.01:
                      todo.append((d.get('st') or f.stem).replace('US-', ''))
              # Oct 30 (chat 2, HQ audit 'refresh.json never fires'): the nightly US key (kpc-us-key.yml, BOT B) and its monthly run
              # write detail 0.01 into every file, so this 'not yet at 110 m' list never emptied: the same 14 states were rebuilt here
              # every night and the monthly re-read below (needs <= 12) never ran. The key's own runs do the rebuilding now; this
              # job only re-reads two states' saved outlines a night (the rotation), or the states it is given by hand.
              want = []
          # Oct 27 (Fable's boundary review #7, HQ GO): the saved copies are re-read from the agencies in rotation, two
          # states a night (all 50 in about a month), oldest first (data/us-key/refresh.json); the old copy is kept as
          # prev-US-XX.json.gz and the observations log lists every outline that changed (25% / 500 acres / pieces)
          refresh = []
          if not os.environ.get('WANT') and len(want) <= 12:
              try: R = json.loads(pathlib.Path('data/us-key/refresh.json').read_text(encoding='utf-8')).get('states', {})
              except Exception: R = {}
              allst = sorted({(json.loads(f.read_text(encoding='utf-8')).get('st') or f.stem).replace('US-', '') for f in pathlib.Path('data/us-key').glob('US-??.json')})
              refresh = sorted(allst, key=lambda s: R.get(s, ''))[:2]
          print('states=' + ' '.join(want))
          print('refresh=' + ' '.join(refresh))
          print('left=%d' % len(want))
          PY
        env:
          WANT: ${{ inputs.states }}
      - name: Fetch the saved outlines
        if: ${{ !inputs.report_only && (steps.pick.outputs.states != '' || steps.pick.outputs.refresh != '') }}
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cache/us
          gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p 'US-*.json.gz' -D cache/us --clobber || echo "::warning title=download::a download failed (exit $?); results may use old or missing files"
      - name: FREEZE CHECK (Brandon Nov 2 7:11 AM; Nov 2 review, Mapping #7) - no US key rebuild while chat 11 grades a held build
        # Before: only kpc-us-key.yml asked. This nightly run rebuilt US-CA, US-CO and US-OR on Nov 2 while the US key was frozen.
        # Frozen = the rebuild, the outline upload and the stamp below are skipped; the report and the second witness still run.
        if: ${{ !inputs.report_only && (steps.pick.outputs.states != '' || steps.pick.outputs.refresh != '') }}
        env:
          KPC_INDEX_REF: origin/main   # Nov 4 PM fix bundle (items 1-2): decide on the NEWEST main's stamp, not this queued run's checkout
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_key_freeze.py check us-key || echo "::error title=kpc_key_freeze.py::stopped with an error (exit $?), see the log above"
      - name: Rebuild those keys with the check
        if: ${{ !inputs.report_only && (steps.pick.outputs.states != '' || steps.pick.outputs.refresh != '') && env.FROZEN != '1' }}
        id: kept_green_2
        continue-on-error: true
        env:
          # Oct 22: the states MUST go in the STATES setting. Passing them as words after the script name (as the
          # first version did) is ignored, so it quietly worked through every state in alphabetical order.
          STATES: ${{ steps.pick.outputs.states }}
          REFRESH: ${{ steps.pick.outputs.refresh }}
          GEO_CACHE_MODE: use          # saved outline if there is one, else fetch it once at ~110 m and save it
          GEO_DETAIL: '0.001'
          GEO_PAGE: '200'
        run: |
          pip install --quiet --break-system-packages pyshp pyproj || echo "::warning title=install::an install step failed (exit $?); the next steps may not work"   # Oct 28: zipped-shapefile layers (Mississippi)
          if [ -n "$STATES" ]; then echo "::notice title=Boundary check::rebuilding $STATES"; python3 .github/scripts/kpc_us_key.py 2>&1 | tee us-key.log || echo "::warning title=step::a script stopped with an error (exit $?)"; fi
          if [ -n "$REFRESH" ]; then
            echo "::notice title=Boundary check::re-reading the saved outlines of $REFRESH from the agencies (monthly rotation)"
            for s in $REFRESH; do [ -f cache/us/US-$s.json.gz ] && cp cache/us/US-$s.json.gz cache/us/prev-US-$s.json.gz; done
            STATES="$REFRESH" GEO_CACHE_MODE=refresh python3 .github/scripts/kpc_us_key.py 2>&1 | tee -a us-key.log; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || echo "::warning title=kpc_us_key.py::stopped with an error (exit $rc), see the log above"
            python3 - <<'PY' || echo "::error title=inline Python::stopped with an error (exit $?), see the log above"
          import json, os, pathlib, time
          p = pathlib.Path('data/us-key/refresh.json')
          try: d = json.loads(p.read_text(encoding='utf-8'))
          except Exception: d = {}
          st = d.setdefault('states', {})
          for s in os.environ['REFRESH'].split(): st[s] = time.strftime('%Y-%m-%d')
          d['about'] = 'When each state\'s saved outlines were last re-read from the agencies (kpc-boundary-check.yml, two states a night, oldest first; old copy kept as prev-US-XX.json.gz on the boundary-cache release).'
          p.write_text(json.dumps(d, indent=1, sort_keys=True) + '\n', encoding='utf-8')
          PY
          fi
      - name: Stamp the rebuilt key (Nov 2 review, Mapping #7) - a rebuild is a new build, so it gets its own build id
        # Only when a state file really changed; the rebuild keeps the old id as previous_build (kpc_us_key.py).
        if: ${{ !inputs.report_only && (steps.pick.outputs.states != '' || steps.pick.outputs.refresh != '') && env.FROZEN != '1' }}
        run: |
          if [ -n "$(git status --porcelain -- 'data/us-key/US-*.json')" ]; then
            python3 .github/scripts/kpc_key_freeze.py stamp us-key || echo "::error title=kpc_key_freeze.py::stopped with an error (exit $?), see the log above"
          else echo "::notice title=Boundary check::no US key state file changed: no new build id"; fi
      - name: Keep any newly saved outlines
        if: ${{ !inputs.report_only && (steps.pick.outputs.states != '' || steps.pick.outputs.refresh != '') && env.FROZEN != '1' }}
        id: kept_green_3
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view boundary-cache -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create boundary-cache -R "$GITHUB_REPOSITORY" --prerelease --title 'Saved park outlines' --notes 'Saved outlines for the boundary answer keys.' || echo "::warning title=download::a download failed (exit $?); results may use old or missing files"
          ls cache/us/*.json.gz >/dev/null 2>&1 && gh release upload boundary-cache cache/us/*.json.gz -R "$GITHUB_REPOSITORY" --clobber || echo "::warning title=download::a download failed (exit $?); results may use old or missing files"
      - name: Second witness (how sure is each outline?)
        id: kept_green_4
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Oct 26 (HQ boundary plan 2b): name, agency, a second map, POTA pin -> data/boundary-score.json
          mkdir -p cache/us
          ls cache/us/US-*.json.gz >/dev/null 2>&1 || gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p 'US-*.json.gz' -D cache/us --clobber || echo "::warning title=download::a download failed (exit $?); results may use old or missing files"
          python3 .github/scripts/kpc_outline_score.py || echo "::error title=kpc_outline_score.py::stopped with an error (exit $?), see the log above"
      - name: Write up what it found
        id: kept_green_5
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/kpc_boundary_report.py || echo "::error title=kpc_boundary_report.py::stopped with an error (exit $?), see the log above"
      - name: Save
        id: kept_green_6
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/us-key data/boundary-report.json data/boundary-score.json 2>/dev/null || true   # ok: an optional path may not exist
          git add data/status 2>/dev/null || true   # ok: an optional file or tidy step (Oct 25 storage plan: when each file last changed)
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" KPC_SAVE_SKIP="data/us-key/overrides.json data/us-key/answers-applied.json data/us-key/answers-states.txt data/ca-key/overrides.json data/ca-key/answers-applied.json data/ca-key/answers-provinces.txt data/world-key/overrides.json data/world-key/answers-applied.json data/world-key/extra-layers.json" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'Boundary check: are the joins in the right place?' - -- data/us-key data/boundary-report.json data/boundary-score.json data/status
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
