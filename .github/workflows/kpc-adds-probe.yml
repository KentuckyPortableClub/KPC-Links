name: KPC data adds probe (temporary, chat 9)
# Oct 27 (chat 9, HQ): tests candidate layers for the region adds from a runner (chat sessions cannot reach state map servers).
# Reads nothing the 2-fer runs read; writes only .claude/build/research/ADDS/*-tested.json. Never fails. DELETE after use.
on:
  workflow_dispatch:
    inputs:
      cand:
        description: candidates file
        default: .claude/build/research/ADDS/round5.json
permissions:
  contents: write
concurrency:
  group: kpc-adds-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/kpc_adds_probe.py || true
        continue-on-error: true
        env:
          CAND: ${{ inputs.cand }}
      - name: Save
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude/build/research/ADDS/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm 'Data adds probe results'
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i*8)); done
          true
