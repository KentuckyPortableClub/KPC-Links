name: KPC skipped-run watchdog
# Nov 2 2026 (chat 10; chat 2 + Brandon 7:18 AM: GitHub skipped most of last night's scheduled runs and things stalled).
# Every 2 hours: every scheduled workflow of this repo whose newest cron time (25 min to 26 h ago) has no run is started once by
# hand (kpc_watchdog.py). Remembered in data/status/watchdog.json; one board line. Never red.
on:
  schedule:
    - cron: '4 */2 * * *'   # G9 Nov 2: was '7 */2 * * *' (spread the start times; now 3 min earlier)
    - cron: '33 */2 * * *'   # a second chance: GitHub skips the watchdog too   # G9 Nov 2: was '37 */2 * * *' (spread the start times; now 4 min earlier)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-watchdog
  cancel-in-progress: false
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Read the watchdog's notes from the bookkeeping branch (Nov 3; they are saved there, not to main, between daily saves)
        run: bash .github/scripts/kpc_bookkeeping_save.sh --restore data/status/watchdog.json || true
      - name: Start what GitHub skipped
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_watchdog.py
      - name: Save
        id: save
        # Nov 3 (Brandon YES 5:29 PM): bookkeeping no longer goes to main on every run. The notes go to the branch 'kpc-bookkeeping'
        # (and this run's summary); main gets them once a day (08 UTC = 2 AM CST) or at once when a board line turns amber/red.
        # Repo variable KPC_BOOKKEEPING=main = the old way. A save that never lands is still RED (Nov 2 bot fixes).
        env:
          KPC_BOOKKEEPING: ${{ vars.KPC_BOOKKEEPING || 'branch' }}
        run: bash .github/scripts/kpc_bookkeeping_save.sh 'watchdog - skipped runs started again' data/status
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
