name: KPC Community
# Copies approved posts (and their photos) from the KPC Community Google Form sheet to the Community page.
# Runs every 2 hours, or any time from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: '53 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-community
  cancel-in-progress: false
jobs:
  community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install image tools
        run: pip install --quiet pillow
      - name: Copy approved posts
        env:
          COMMUNITY_SHEET_CSV: ${{ secrets.COMMUNITY_SHEET_CSV }}
        run: python3 .github/scripts/kpc_community.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kpc-community.json photos/community
          if ! git diff --cached --quiet; then
            git commit -m 'Update community posts'
            git pull --rebase --autostash || true
            git push || echo 'Push skipped; will save on the next run.'
          fi
