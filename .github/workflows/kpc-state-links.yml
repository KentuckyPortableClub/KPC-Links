name: KPC park links (states around Kentucky + Canada / North America)
# Weekly: official website, park type and activation methods for every POTA park in the states around Kentucky.
on:
  schedule:
    - cron: '41 8 * * 2'
  workflow_dispatch:
    inputs:
      states:
        description: 'States (blank = every state but KY)'
        default: ''
      programs:
        description: 'POTA programs outside the US, like CA MX (blank = all of North America when states is blank too)'
        default: ''
      recheck:
        description: 'Fetch every park page again'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-state-links
  cancel-in-progress: false
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Build the state files
        env:
          STATES: ${{ inputs.states }}
          PROGS: ${{ inputs.programs }}
          RECHECK: ${{ inputs.recheck && '1' || '' }}
        run: python3 .github/scripts/kpc_state_links.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/parkinfo
          if ! git diff --cached --quiet; then git commit -m 'Park links: states around Kentucky'; git pull --rebase --autostash || true; git push; fi
