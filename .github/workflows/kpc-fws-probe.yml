name: KPC FWS realty probe (temporary, chat 2)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Ask the FWS realty layer
        run: |
          python3 - <<'PY' || true
          import json, urllib.request, urllib.parse
          U='https://services.arcgis.com/QVENGdaPbd4LUkLV/arcgis/rest/services/FWSInterest_Simplified_Authoritative/FeatureServer/0'
          def q(where, fields, distinct=True):
              p={'where':where,'outFields':fields,'returnGeometry':'false','returnDistinctValues':'true' if distinct else 'false','resultRecordCount':40,'f':'json'}
              try:
                  with urllib.request.urlopen(U+'/query?'+urllib.parse.urlencode(p),timeout=60) as r: j=json.loads(r.read())
                  return j.get('error') or [f['attributes'] for f in j.get('features',[])]
              except Exception as e: return str(e)[:200]
          try:
              with urllib.request.urlopen(U+'?f=json',timeout=60) as r: L=json.loads(r.read())
              print('::notice title=FWS fields::'+', '.join(f"{f['name']}" for f in L.get('fields',[]))[:900])
          except Exception as e: print('::notice title=FWS fields::'+str(e)[:200])
          for nm in ('ARROWWOOD','DEVILS LAKE','KULM','VALLEY CITY','SALYER'):
              print(f'::notice title=FWS {nm}::'+json.dumps(q(f"UPPER(ORGNAME) LIKE '%{nm}%'",'ORGNAME,INTTYPE1'))[:900])
          print('::notice title=FWS INTTYPE1 values::'+json.dumps(q("1=1",'INTTYPE1'))[:600])
          PY
