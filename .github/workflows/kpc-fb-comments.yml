name: KPC Facebook comments
# Sends new comments on the club's Facebook posts to Discord, with a link to reply and a suggested answer
# for the questions we get asked a lot. Since Oct 24 it also answers the clear-cut ones on Facebook itself
# (fixed answers, switch in data/fb-comments-auto.json); everything else waits for a person.
# Hourly. Never fails, never emails. Nothing a visitor wrote is ever saved in this repo.
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Practice run: print what it would send, change nothing'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: kpc-fb-comments
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Look for new comments
        id: kept_green_1
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          KPC_DISCORD_WEBHOOK: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          KPC_ADMIN_WEBHOOK: ${{ secrets.KPC_ADMIN_WEBHOOK }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 .github/scripts/kpc_fb_comments.py || echo "::error title=kpc_fb_comments.py::stopped with an error (exit $?), see the log above"
      - name: Remember what was sent
        id: kept_green_2
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Oct 25: put back a state file whose only change is a time stamp, so quiet runs commit nothing
          python3 .github/scripts/kpc_save_filter.py data/fb-comments-state.json || echo "::error title=kpc_save_filter.py::stopped with an error (exit $?), see the log above"
          git add data/fb-comments-state.json 2>/dev/null || true   # ok: an optional path may not exist
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'Facebook comments: what has been passed on' - -- data/fb-comments-state.json
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
