name: KPC Reference Check
# Every Monday (before the Top 25 run at 11:17 and the guide PDFs at 13:41): compares the site's Kentucky POTA parks,
# W4K SOTA summits and KFF areas (kpc-ky-data.json) with the official lists, in one GitHub issue labelled "ref-check".
# Oct 23 (Brandon: 'make sure it dont happen again'): a park POTA RETIRED is added to data/ky-retired.json and
# kpc_retired_sweep.py takes it off every list (park data, search lists, map downloads, outlines, guides, Top 25);
# this job commits that. New parks are still only listed for a person to add.
on:
  schedule:
    - cron: '24 10 * * 1'   # G9 Nov 2: was '23 10 * * 1' (spread the start times; now 1 min later)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-ref-check
  cancel-in-progress: true
jobs:
  refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - name: Compare reference lists (and take retired parks off the site)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_refcheck.py
      - name: Save what was taken off
        id: kept_green_1
        continue-on-error: true
        run: |
          git config user.name "KPC bot"
          git config user.email "kpc-bot@users.noreply.github.com"
          python3 .github/scripts/kpc_refcheck_guard.py || echo "::error title=kpc_refcheck_guard.py::stopped with an error (exit $?), see the log above"   # Nov 2 (chat 5's WRONG list): a park lost that POTA did not retire / an emptied map file = put back
          git add -A kpc-ky-data.json locations-ky.json locations.json kpc-guide-*-data.json wwff-unmapped.json ky-*.geojson app/packs KPC_Kentucky_*.kml KPC_Kentucky_*.gpx kpc-top25.json data/ky-retired.json || true   # ok: an optional path may not exist
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -q -m "Retired parks taken off every list (reference check)"
          { saved=0; for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && { saved=1; break; }; sleep 10; done; [ "$saved" = 1 ] || echo "::error title=Save::not saved after every try; the next run tries again"; }
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
