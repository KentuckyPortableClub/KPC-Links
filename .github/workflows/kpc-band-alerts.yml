name: KPC Band Alerts
# Every 30 minutes: checks NOAA's space weather alerts and posts to the KPC Discord when there's a
# strong radio blackout (R3+), geomagnetic storm (G3+, aurora possible) or radiation storm (S3+).
# At most one post per kind every 6 hours unless it gets worse.
on:
  schedule:
    - cron: '18,48 * * * *'   # Nov 1: off the busy :00/:30 minutes (GitHub dropped runs for hours)   # G9 Nov 2: was '11,41 * * * *' (spread the start times; now 7 min later)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-social
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Check NOAA alerts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          CAMPOUT_WEBHOOK_URL: ${{ secrets.KPC_CAMPOUT_WEBHOOK }}
          GENERAL_WEBHOOK_URL: ${{ secrets.KPC_GENERAL_WEBHOOK }}
          ANNOUNCE_WEBHOOK_URL: ${{ secrets.KPC_ANNOUNCE_WEBHOOK }}
          PARKS_WEBHOOK_URL: ${{ secrets.KPC_PARKS_WEBHOOK }}
        run: node .github/scripts/kpc_social.js bandalert
      - name: Remember alerts
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f kpc-social-state.json ]; then
            git add kpc-social-state.json
            # Nov 2 review (G7): save with the shared helper (shared with another workflow (kpc-social-state.json): merged the old way, but loud). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
            KPC_SAVE_MODE=rebase KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
              bash .github/scripts/kpc_save_overwrite.sh 'Remember band alerts' - -- kpc-social-state.json
          fi
