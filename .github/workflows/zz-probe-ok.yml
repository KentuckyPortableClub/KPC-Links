name: zz probe OK
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: |
          python3 - <<'PY' || true
          import json,urllib.request,urllib.parse
          Q='https://edits.nationalmap.gov/arcgis/rest/services/PAD-US/PAD_US/MapServer/0/query'
          def g(p):
            try:
              r=urllib.request.urlopen(urllib.request.Request(Q+'?'+urllib.parse.urlencode(p),headers={'User-Agent':'KPC'}),timeout=120);return json.loads(r.read())
            except Exception as e: return {'err':str(e)}
          for st in ['OK','KY','TN']:
            print('::notice title=count %s::%s'%(st,g({'where':"State_Nm='%s'"%st,'returnCountOnly':'true','f':'json'})))
          j=g({'where':"State_Nm='OK' AND Unit_Nm LIKE '%Sequoyah%'",'outFields':'Unit_Nm,Category,Own_Type,Mang_Type,State_Nm','returnGeometry':'false','f':'json'})
          print('::notice title=Sequoyah::%s'%json.dumps([f['attributes'] for f in j.get('features',[])])[:900] if 'features' in j else j)
          j=g({'where':"State_Nm='OK' AND Unit_Nm LIKE '%Wildlife Management Area%'",'outFields':'Unit_Nm,Category,Own_Type,Mang_Type','returnGeometry':'false','f':'json'})
          print('::notice title=OK WMA::%s'%json.dumps([f['attributes'] for f in j.get('features',[])][:15])[:1500] if 'features' in j else j)
          j=g({'where':"State_Nm='OK'",'outFields':'Unit_Nm','returnGeometry':'false','f':'json','resultOffset':0,'resultRecordCount':500,'orderByFields':'OBJECTID'})
          print('::notice title=page0::n=%s exceeded=%s'%(len(j.get('features',[])),j.get('exceededTransferLimit')))
          PY
