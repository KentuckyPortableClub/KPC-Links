name: KPC Europe weather warnings
# Oct 24 2026 (Activators Lounge step 5): every 3 hours, copy MeteoAlarm's warnings for each European country into
# data/alerts/eu.json for the Field Weather page. Commits only when something changed. Never fails.
on:
  schedule:
    - cron: '41 */6 * * *'    # every 6 h (HQ Oct 27 limits plan: fewer site rebuilds)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-eu-alerts
  cancel-in-progress: true
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Copy the warnings
        run: python3 .github/scripts/kpc_eu_alerts.py || true
      - name: Save
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/alerts/eu.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'Europe weather warnings'
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done; exit 0
