name: KPC New Kentucky Lands Watch
# Mondays: looks for NEW Kentucky public lands (KY Fish & Wildlife, State Parks, Nature Preserves / Natural Areas,
# USGS PAD-US federal + state land, new POTA US-KY parks, news headlines). New finds are added as a comment on
# the GitHub issue labelled "ky-new-lands" (GitHub emails watchers about comments). Nothing on the site changes.
on:
  schedule:
    - cron: '37 13 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: kpc-new-lands
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Look for new Kentucky lands
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_new_lands.py
      - name: Save this week's lists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ky-lands-seen.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Kentucky new-lands watch lists'
            git pull --rebase --autostash || true
            git push || echo 'Push skipped'
          fi
