name: KPC what's new
# Posts the big additions listed in data/kpc-whats-new.json to Discord and the Facebook Page, once each.
# Nothing waiting in that file = no post. Small changes are never listed there, so they are never announced.
# Once a day, late morning Central. Never fails, never emails.
on:
  schedule:
    - cron: '7 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Practice run: print what it would say, post nothing'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: kpc-whats-new
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Post anything new
        continue-on-error: true
        env:
          KPC_DISCORD_WEBHOOK: ${{ secrets.KPC_DISCORD_WEBHOOK }}
          KPC_GENERAL_WEBHOOK: ${{ secrets.KPC_GENERAL_WEBHOOK }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 .github/scripts/kpc_whats_new.py || true
      - name: Remember what went out
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kpc-whats-new.json 2>/dev/null || true
          # Nov 2 review (G7): save with the shared helper (this run's files copied on top of the newest main). A save that never lands prints ::error (no more '|| true'); red only if the repo variable KPC_SAVE_RED=yes.
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy "What's new: posted" - -- data/kpc-whats-new.json
