name: KPC US closures into park cards (merge)
# OFF since Oct 29 (Brandon's SCOPE: no closures outside Kentucky): timer removed, by hand only.
# Oct 27 (storage plan Stage 2, step B5; chat 5): the closure watcher itself MOVED to KPC-Data (its kpc-us-closures.yml,
# 23 past 1/7/13/19 UTC) and writes data/alerts/us-parks.json there. This small job, 30 min later, copies those 'uc-' items
# into kpc-conditions.json here (the small file the park cards, Kit, planners and the app read). Commits only when the
# closures really changed. Posts nothing. Never fails. No secrets.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-us-closures-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Lay KPC-Data's moved data over the KPC-Links checkout (Step B; stops red on empty input)
        run: bash .github/scripts/kpc_overlay.sh
      - name: Merge KPC-Data's closures into kpc-conditions.json
        id: kept_green_1
        continue-on-error: true
        run: |
          mkdir -p data/alerts
          curl -fsSL --retry 3 -o /tmp/us-parks.json https://raw.githubusercontent.com/KentuckyPortableClub/KPC-Data/main/data/alerts/us-parks.json || exit 0
          python3 -c "import json;json.load(open('/tmp/us-parks.json'))" || exit 0
          cp /tmp/us-parks.json data/alerts/us-parks.json
          python3 .github/scripts/kpc_us_closures.py --merge || { kpc_rc=$?; echo "::error title=kpc_us_closures.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_us_closures.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          git checkout -- data/alerts 2>/dev/null || true   # ok: an optional file or tidy step (the file itself lives in KPC-Data now; only kpc-conditions.json is saved here)
      - name: Save (once, only real changes)
        id: kept_green_2
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/kpc_save_filter.py kpc-conditions.json || { kpc_rc=$?; echo "::error title=kpc_save_filter.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_save_filter.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          git add kpc-conditions.json
          git diff --cached --quiet && exit 0
          git commit -qm 'US park closures (merged from KPC-Data)'
          { for i in 1 2 3 4; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done; echo "::error title=Save::not saved after every try; the next run tries again"; }; exit 0
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
