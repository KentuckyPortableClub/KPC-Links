name: KPC saved shapes
# Downloads every state's official land outlines ONCE, at ~110 m detail instead of the ~1.1 km every live run
# has used, and keeps them as files on the 'boundary-cache' release (not in the repo). After that the answer
# keys can be rebuilt, and new matching rules tested, from the saved copy in minutes instead of hours.
# Fable's review, Oct 22: 'nearly all the time is re-downloading the same geometry'.
# By hand only (no schedule). Six states at a time so the government servers are not hammered. Never fails.
# Handoff 3 (KPC owner, 2026-11-17): 'from_requests' re-reads only the states named in the keeper's layer requests, with the
# same fetch, pacing, save-check and upload as below (.claude/notes/layer-refresh.md).
on:
  # SCHEDULE OFF, Brandon Nov 16 2026 ('the less downloading the less issues'): this job re-read every layer blind
  # (GEO_CACHE_MODE: refresh) on the 3rd of each month, whether or not one line of it had moved. Every layer we hold was
  # downloaded in the last few days, so a monthly re-download only risked a fresh copy being replaced by a worse read.
  # The keeper already checks every layer for change (KPC-Store store/layers-seen.json: ETag, lastEditDate, record count).
  # Before this is ever switched back on, read .claude/notes/layer-refresh.md: the plan is that the keeper ASKS and this
  # job fetches only the layers that moved. The by-hand button below still works and is how a refresh is started now.
  #schedule:
  #  - cron: '13 9 3 * *'          # the 3rd of each month, 4.17am Central
  workflow_dispatch:
    inputs:
      states:
        description: 'Only these states (blank = all of them)'
        default: ''
      from_requests:
        description: "Serve only the keeper's layer requests (layer-requests.json on the boundary-cache release; none = nothing is fetched)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-geo-cache
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.g.outputs.groups }}
    steps:
      - name: Make sure the release exists
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view boundary-cache -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create boundary-cache -R "$GITHUB_REPOSITORY" --prerelease --title 'Saved park outlines' \
            --notes 'Official land outlines saved by the KPC saved shapes workflow, for the boundary answer keys. Not a release of anything.' || { kpc_rc=$?; echo "::warning title=Release::the saved-shapes release could not be made (exit $kpc_rc)"; echo "Release - the saved-shapes release could not be made (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - uses: actions/checkout@v5   # Handoff 3 (layer refresh): only to read the request planner
        if: ${{ inputs.from_requests }}
        with:
          sparse-checkout: .github/scripts
      - name: Split the states into groups
        id: g
        env:
          WANT: ${{ inputs.states }}
          FROM_REQUESTS: ${{ inputs.from_requests }}
          GH_TOKEN: ${{ github.token }}
          # The owner's four layer-refresh rulings (.claude/notes/layer-refresh.md, R-LR1..R-LR4). Repo variables, UNSET until ruled;
          # unset = nothing extra is fetched. What each one does: .github/scripts/kpc_layer_refresh.py.
          KPC_LR_STALE_DAYS: ${{ vars.KPC_LR_STALE_DAYS }}
          KPC_LR_DYING: ${{ vars.KPC_LR_DYING }}
          KPC_LR_CHANGED_READ: ${{ vars.KPC_LR_CHANGED_READ }}
          KPC_LR_WHO: ${{ vars.KPC_LR_WHO }}
        run: |
          # Handoff 3 (KPC owner, 2026-11-17): the keeper asks, this job fetches. With from_requests the list is the keeper's request
          # file (read only; no file, an unreadable one or nothing servable = no state = nothing is fetched), else exactly as before.
          if [ "$FROM_REQUESTS" = true ]; then
            ALL='AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY'
            mkdir -p "$RUNNER_TEMP/lr"
            gh release view boundary-cache -R "$GITHUB_REPOSITORY" --json assets -q '[.assets[] | {name, updatedAt}]' > "$RUNNER_TEMP/lr/asset-dates.json" || echo '[]' > "$RUNNER_TEMP/lr/asset-dates.json"
            if grep -q '"layer-requests.json"' "$RUNNER_TEMP/lr/asset-dates.json"; then
              gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p layer-requests.json -D "$RUNNER_TEMP/lr" --clobber || { rm -f "$RUNNER_TEMP/lr/layer-requests.json"; echo "::warning title=Layer requests::the request file is on the release but could not be downloaded: nothing is fetched"; }
            fi
            python3 .github/scripts/kpc_layer_refresh.py plan --job us --requests "$RUNNER_TEMP/lr/layer-requests.json" --want "$WANT" --known "$ALL" \
              --asset-dates "$RUNNER_TEMP/lr/asset-dates.json" --receipt "$RUNNER_TEMP/lr/receipt.json" --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT" \
              || { echo 'groups=[]' >> "$GITHUB_OUTPUT"; echo "::warning title=Layer requests::the request planner stopped: nothing is fetched"; }
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ALL = 'AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY'.split()
          want = (os.environ.get('WANT') or '').upper().replace(',', ' ').split() or ALL
          groups = [' '.join(want[i:i + 5]) for i in range(0, len(want), 5)]
          print('groups=' + json.dumps(groups))
          PY
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
  fetch:
    needs: prepare
    if: ${{ needs.prepare.outputs.groups != '[]' && needs.prepare.outputs.groups != '' }}   # Handoff 3: no request to serve = nothing fetched
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        states: ${{ fromJSON(needs.prepare.outputs.groups) }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the moved data from KPC-Data (Step B, read only)
        run: bash .github/scripts/kpc_overlay.sh
      - name: Download and save these states
        id: kept_green_2
        continue-on-error: true
        env:
          STATES: ${{ matrix.states }}
          GEO_CACHE_MODE: refresh
          GEO_DETAIL: '0.001'
          GEO_PAGE: '200'
          MINUTES: '320'
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice title=Saved shapes::fetching $STATES"
          # Owner rule, 2026-11-10: start from the release copies (the layers on saved-copy-only hosts come only from them) and keep
          # them in .against, so the upload below sends only copies that hold at least as many records (save-check)
          mkdir -p cache/us .against
          gh release view boundary-cache -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > .against/ASSETS.txt || { rm -f .against/ASSETS.txt; echo "::warning title=Saved shapes::the release asset list could not be read: nothing is uploaded this run"; }
          for st in $STATES; do
            grep -qx "US-$st.json.gz" .against/ASSETS.txt 2>/dev/null || continue
            if gh release download boundary-cache -R "$GITHUB_REPOSITORY" -p "US-$st.json.gz" -D .against --clobber; then cp ".against/US-$st.json.gz" cache/us/
            else echo "::warning title=Saved shapes $st::the release copy could not be downloaded: $st is not uploaded this run"; echo "Saved shapes $st - release copy not downloaded" >> "$RUNNER_TEMP/kpc-hidden.txt"; fi
          done
          touch .against/T0
          pip install --quiet --break-system-packages pyshp pyproj || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # Oct 28: zipped-shapefile layers (Mississippi)
          python3 .github/scripts/kpc_us_key.py || { kpc_rc=$?; echo "::error title=kpc_us_key.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_us_key.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Put them on the release
        id: kept_green_3
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=$(find cache/us -maxdepth 1 -name 'US-*.json.gz' -newer .against/T0 2>/dev/null | sort | tr '\n' ' ')
          [ -n "$F" ] || { echo "::notice title=Saved shapes::nothing new saved for ${{ matrix.states }}"; exit 0; }
          # owner rule, 2026-11-10: only copies that pass the gate baseline and hold at least the release copy's records, per layer
          python3 .github/scripts/kpc_master_cli.py save-check --against .against --assets .against/ASSETS.txt --first-ok --ok-list .against/OK.txt $F || { kpc_rc=$?; echo "::error title=Saved shapes::save-check refused a copy (exit $kpc_rc, named above): not uploaded"; echo "Saved shapes - save-check refused a copy (exit $kpc_rc)" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          F=$(cat .against/OK.txt 2>/dev/null | tr '\n' ' ')
          [ -n "${F// /}" ] || { echo "::notice title=Saved shapes::no copy passed save-check for ${{ matrix.states }}"; exit 0; }
          gh release upload boundary-cache $F -R "$GITHUB_REPOSITORY" --clobber || { kpc_rc=$?; echo "::warning title=upload::an upload failed (exit $kpc_rc)"; echo "upload - an upload failed (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          echo "::notice title=Saved shapes::uploaded $F"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
