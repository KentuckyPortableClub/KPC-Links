name: KPC federal campgrounds (states around Kentucky)
# Weekly: Recreation.gov (RIDB) campgrounds on federal land for the US Trip Planner park cards. Needs secret RIDB_API_KEY.
on:
  schedule:
    - cron: '17 9 * * 2'
  workflow_dispatch:
    inputs:
      states:
        description: 'States (blank = all 21: KY neighbors + the next ring)'
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-fed-camps
  cancel-in-progress: false
jobs:
  camps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Fetch campgrounds
        env:
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
          STATES: ${{ inputs.states }}
        run: python3 .github/scripts/kpc_fed_camps.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p data/campfed; git add data/campfed
          if ! git diff --cached --quiet; then git commit -m 'Federal campgrounds: states around Kentucky'; git pull --rebase --autostash || true; git push; fi
