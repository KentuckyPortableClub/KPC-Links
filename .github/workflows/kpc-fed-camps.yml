name: KPC federal campgrounds (all states)
# Monthly (Oct 26, HQ: all states, monthly, never fails): Recreation.gov (RIDB) campgrounds on federal land for the park cards. Needs secret RIDB_API_KEY.
on:
  # schedule: - cron: '17 9 12 * *'   # OFF Oct 29 (Brandon 9:34 AM): no recurring Recreation.gov calls; outside KY camping is hidden (SCOPE)
  workflow_dispatch:
    inputs:
      states:
        description: 'States (blank = every state + DC)'
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-fed-camps
  cancel-in-progress: false
jobs:
  camps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Fetch campgrounds
        env:
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
          STATES: ${{ inputs.states }}
        id: kept_green_1
        continue-on-error: true
        run: python3 .github/scripts/kpc_fed_camps.py || echo "::error title=kpc_fed_camps.py::stopped with an error (exit $?), see the log above"
      - name: Save
        if: always()
        # Oct 28 (tune pass): the one safe save (fresh copy of main + only the changed files); red ONLY when the save failed
        env:
          STRICT: '1'
        run: mkdir -p data/campfed && bash .github/scripts/kpc_push_data.sh . 'Federal campgrounds (Recreation.gov)' data/campfed
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
