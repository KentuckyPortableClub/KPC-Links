name: KPC Kentucky KML/GPX map files (by hand)
# Nov 7 2026 (round 4, item 3; Brandon): BY HAND ONLY, optional. No schedule, no workflow_run.
# A thin wrapper for .claude/build/mapfiles/refresh.py: rebuilds the main pins of KPC_Kentucky_POTA_Parks.kml/.gpx and
# KPC_Kentucky_KFF_References.kml/.gpx from kpc-ky-data.json + ky-overlaps.geojson (it keeps the access-point folders and 'Notes:' lines).
# It writes ONLY those four files. The check step refuses to save if any of the four is not well-formed XML or is missing any ref of kpc-ky-data.json (4- and 5-digit refs).
# save = commit (default) | none (build and show the change only).
on:
  workflow_dispatch:
    inputs:
      save:
        description: 'commit (default) | none'
        required: false
        default: 'commit'
permissions:
  contents: write
concurrency:
  group: kpc-ky-mapfiles
  cancel-in-progress: false
jobs:
  mapfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the pins
        run: python3 .claude/build/mapfiles/refresh.py
      - name: Check the four files
        run: |
          python3 - <<'PY'
          import json, re, sys
          import xml.etree.ElementTree as ET
          d = json.load(open('kpc-ky-data.json'))
          want = {'KPC_Kentucky_POTA_Parks': {p['c'] for p in d['parks']}, 'KPC_Kentucky_KFF_References': {k['c'] for k in d['kff']}}
          bad = 0
          for base, refs in want.items():
              for ext in ('kml', 'gpx'):
                  f = f'{base}.{ext}'
                  try:
                      ET.parse(f)
                  except Exception as e:
                      print(f'::error title=Map files::{f} is not well-formed XML ({e}); nothing is saved'); bad += 1; continue
                  have = set(re.findall(r'\b(?:US|KFF)-\d{4,5}\b', open(f, encoding='utf-8').read()))
                  lost = sorted(refs - have)
                  print(f'{f}: {len(refs) - len(lost)}/{len(refs)} refs of kpc-ky-data.json present')
                  if lost:
                      print(f'::error title=Map files::{f} is missing {len(lost)} ref(s) of kpc-ky-data.json ({", ".join(lost[:8])}); nothing is saved'); bad += 1
          sys.exit(1 if bad else 0)
          PY
          git diff --stat -- KPC_Kentucky_POTA_Parks.kml KPC_Kentucky_POTA_Parks.gpx KPC_Kentucky_KFF_References.kml KPC_Kentucky_KFF_References.gpx | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save
        if: ${{ (inputs.save || 'commit') == 'commit' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KPC_Kentucky_POTA_Parks.kml KPC_Kentucky_POTA_Parks.gpx KPC_Kentucky_KFF_References.kml KPC_Kentucky_KFF_References.gpx
          KPC_SAVE_MODE="${{ vars.KPC_SAVE_MODE || 'overwrite' }}" KPC_SAVE_RED="${{ vars.KPC_SAVE_RED || 'no' }}" \
            bash .github/scripts/kpc_save_overwrite.sh --copy 'Kentucky KML/GPX map files (by hand)' - -- KPC_Kentucky_POTA_Parks.kml KPC_Kentucky_POTA_Parks.gpx KPC_Kentucky_KFF_References.kml KPC_Kentucky_KFF_References.gpx
