name: KPC SOTA public land
# Oct 24 2026 (Activators Lounge step 6): test US SOTA summits against the national public-lands map (PAD-US).
# Each SOTA area is redone every 30 days, oldest first, up to ~40 minutes a night. Never fails.
on:
  schedule:
    - cron: '23 9 * * *'   # 4:23 AM Central
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-sota-land
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Check summits
        run: python3 .github/scripts/kpc_sota_land.py || true
      - name: Save
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sota-land 2>/dev/null || exit 0
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'SOTA public land'
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done; exit 0
